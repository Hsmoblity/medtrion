id: FEAT-20241030-4
project: front-store
template: Feature
description: Integrate real GraphQL services for configurator flows and restore cart provider wiring so checkout uses live data.

context:
  background: |
    Configurator still uses mock handlers (add-to-cart, save, edit, option fetch) with TODO placeholders. Cart Context was never rewired to the Zustand store, so homepage add-to-cart fails and payment reads stale data. To meet PRD expectations and unblock Storybook/payment coverage, we must wire GraphQL mutations/queries and reintroduce an application-level cart provider.
  personas:
    - Shopper — expects configurator to update cart with chosen options.
    - Caregiver — needs edits to persist when assisting others.
    - Internal CSR — relies on live data during assisted checkout.
  dependencies:
    upstream:
      - GraphQL mutations from WooCommerce/Contentful backend (cart, configurator APIs)
      - Session management utilities (`sessionStorage.ts`)
    downstream:
      - Payment flow (`/payment`) and Storybook coverage
  artefacts:
    prd: .docs/PRD_CART_PAGE_COMPREHENSIVE.md
    design_spec: TBD (no major UI change; focus on data integration)
    analytics_dashboard: TBD (cart/configurator funnel)
  existing_initiatives:
    related_items:
      - id: FEAT-20241022-5
        summary: Cart→Configurator edit flow implementation
        status: in-flight
      - id: FEAT-20241030-1
        summary: Cart experience restoration
        status: new
    overlap_rationale: |
      FEAT-20241022-5 defines desired flow; this feature delivers backend integration and cart provider wiring to realize it. FEAT-20241030-1 addresses UI/experience on cart page; this feature supplies the data plumbing required.
    owner_notified: yes

technical_requirements:
  architecture:
    data_models:
      - name: ConfiguratorMutationPayload
        description: Response from add/save/edit mutations.
        fields:
          - cartItemId: string
          - configuration: Serialized option selection
          - totalPrice: number
          - financingSummary: object|null
          - compatibilityIssues: array
    state_management:
      storage_keys:
        - `_cart` cookie for persisted cart
        - `app_session` for edit sessions
      caches:
        - cartStore cache, invalidated on mutation success/broadcast
    services:
      apis:
        - name: AddConfigurationToCart
          method: GraphQL mutation
          contract: Adds configuration to cart, returns updated cart item
          error_handling: display toast, rollback optimistic state
        - name: UpdateConfiguratorOptions
          method: GraphQL mutation
          contract: Updates cart item configuration (edit flow)
          error_handling: revert to previous selection, broadcast error
        - name: FetchCategoryOptions
          method: GraphQL query
          contract: Returns option catalog for category
          error_handling: fallback to static options with warning
        - name: CheckCompatibility
          method: GraphQL query/mutation
          contract: Validate selected options and return issues
          error_handling: show inline warning, disable selection if severity error
    feature_flags:
      - id: configurator_graphql_integration
        default: off
        rollout_plan: enable on staging → canary 25% → full.
  ux_requirements:
    routing:
      entry_points:
        - /product/[slug]/options (SSR + CSR)
      exit_paths:
        - /cart
        - /success
        - /payment
    states:
      loading: Spinner/skeleton while mutation pending.
      success: Toast + navigation for add/save edit.
      error: Inline banner/toast with retry for failed mutations.
    accessibility:
      keyboard: CTA buttons remain focusable; loading states announced via aria-live.
      screen_reader: Mutation success/failure messages announced.
      visual: Disable buttons during mutation to avoid double submit.
    responsive_breakpoints: No new layout changes, ensure loading CTA works mobile/desktop.
  analytics_requirements:
    events:
      - name: configurator_add_to_cart
        trigger: Successful add mutation
        payload:
          - cartItemId
          - optionCount
          - totalPrice
        owner: Analytics
      - name: configurator_edit_saved
        trigger: Edit mutation success
        payload:
          - cartItemId
          - priceDelta
    funnels:
      - name: configurator_to_checkout
        steps:
          - configurator_add_to_cart
          - checkout_start
          - checkout_complete
        success_metric: +15% conversion from configurator.
  performance_budget:
    initial_load_ms: 2400 (including GQL fetch)
    interaction_latency_ms: 300 (mutation response target)
    bundle_delta_kb: ≤ 10KB (API clients)
  security_considerations:
    data_sensitivity: medium (cart info)
    storage_policy: avoid storing sensitive details; rely on secure GraphQL endpoint
    logging: redact option names if necessary
    threat_vectors: ensure mutations validated server-side

customer_journeys:
  - scenario: Shopper configures product and adds to cart
    preconditions:
      - Configurator loads product data.
    steps:
      - Select options.
      - Click “Add to Cart”.
      - Mutation succeeds; cart updates.
    success_criteria:
      - API call returns updated cart item; cart page reflects changes.

non_functional_requirements:
  reliability: Mutation success rate ≥ 99% with retry for transient errors.
  observability:
    logs: GraphQL errors logged with context (slug, cartItemId).
    metrics: Mutation success/failure counters.
    alerts: Trigger if failure rate >5% in 15 minutes.

rollout_strategy:
  phases:
    - name: staging
      description: Implement GraphQL integration & provider wiring; run QA.
      exit_criteria:
        - All automated tests green
        - QA verifies end-to-end flow
    - name: canary
      description: Enable feature flag for 25% production traffic.
      exit_criteria:
        - Error rate < threshold
        - Cart conversions stable
    - name: full_launch
      description: 100% rollout.
      exit_criteria:
        - Monitoring stable for 72h
  fallback_plan: Disable feature flag, revert to mock logic with maintenance banner.

risks:
  known_risks:
    - description: Backend mutations not ready / contract mismatch.
      mitigation: Align with backend team; define mocks for local dev separately.
      owner: Frontend lead
    - description: Cart provider refactor may introduce regressions.
      mitigation: Comprehensive tests & feature-flagged rollout.
      owner: Frontend dev
  open_questions:
    - Confirm final GraphQL schema (input/output fields) with backend.

communications:
  stakeholders:
    - name: Product manager
      update_cadence: Weekly
    - name: Backend lead
      update_cadence: Integration sync
    - name: QA lead
      update_cadence: Pre-canary test plan
  documentation:
    - Configurator integration README
    - Cart provider usage guide

  - name: Wire cart provider to Zustand store
    description: Reintroduce CartContext provider bridging to Zustand store and ensure payment reads live data.
    files:
      - src/pages/_app.tsx
      - src/components/PageLayout/PageLayout.tsx
      - src/contexts/cartItemsContext.ts
      - src/stores/cartStore.ts
      - src/pages/cart.tsx
      - src/pages/payment.tsx
    dependencies:
      internal:
        - step or module dependency
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Check for open cart provider refactors (FEAT-20241030-1 overlap).
            - Document dedupe outcome.
          acceptance_criteria:
            - Overlap recorded/stakeholders acknowledged.
        - step: 1
          name: Implement CartProvider
          files:
            - src/contexts/cartItemsContext.ts
            - src/pages/_app.tsx
            - src/stores/cartStore.ts
          details:
            - Create provider exposing dispatch/actions wired to Zustand.
            - Guard SSR (check window before using localStorage).
          acceptance_criteria:
            - Add-to-cart updates store & cookie; payment sees same data.
        - step: 2
          name: Update cart/payment consumers
          files:
            - src/components/ProductList/ProductList.tsx
            - src/pages/payment.tsx
          details:
            - Replace direct context references with provider hooks.
            - Ensure payment totals recompute from store.
          acceptance_criteria:
            - Cart page shows items added from homepage; payment summary accurate.
      testing_requirements:
        unit_tests:
          - CartProvider context mapping.
        integration_tests:
          - Add-to-cart -> cart -> payment flow.
        e2e_tests:
          - Playwright add/edit checkout scenario.
      monitoring_plan:
        dashboards:
          - Cart funnel metrics
        alerts:
          - cart_add_failure (0 events after release)
    deliverables:
      code:
        - CartProvider module
      documentation:
        - README update (cart usage)

  - name: Integrate configurator GraphQL mutations
    description: Replace mock handlers for add/save/edit with real API calls.
    files:
      - src/pages/product/[slug]/configure.tsx
      - src/components/OptionsClientWrapper.tsx
      - src/lib/graphql/configurator.ts
      - src/stores/configuratorStore.ts
    dependencies:
      internal:
        - Wire cart provider to Zustand store
      external:
        - Backend GraphQL schema availability
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Confirm backend endpoints ready.
            - Align with FEAT-20241022-5 owner.
          acceptance_criteria:
            - Overlap/ownership documented.
        - step: 1
          name: Add GraphQL client & mutations
          files:
            - src/lib/graphql/configurator.ts
            - src/pages/product/[slug]/configure.tsx
          details:
            - Define queries/mutations for add/save/edit/category options/compatibility.
            - Inject using SSR/CSR safe client (e.g., Apollo or fetch).
          acceptance_criteria:
            - Network tab shows GraphQL requests on interactions.
        - step: 2
          name: Wire handlers to mutations
          files:
            - src/pages/product/[slug]/configure.tsx
            - src/components/OptionsClientWrapper.tsx
            - src/stores/configuratorStore.ts
          details:
            - Replace setTimeout/mock responses with real mutation calls.
            - Handle optimistic updates and error fallback.
          acceptance_criteria:
            - Cart updates with configured options; edit saves persist.
        - step: 3
          name: Remove mock data & TODOs
          files:
            - src/pages/product/[slug]/configure.tsx
            - src/components/configurator/ModelConfigurator.tsx
          details:
            - Clean up TODO comments; ensure fallback to real data.
          acceptance_criteria:
            - No TODO placeholders remain; linter passes.
      testing_requirements:
        unit_tests:
          - GraphQL client helpers (mocked responses).
        integration_tests:
          - RTL test verifying add-to-cart mutation called.
        e2e_tests:
          - Playwright: configure -> add -> cart.
      monitoring_plan:
        dashboards:
          - GraphQL mutation success/failure
        alerts:
          - configurator_mutation_failure >5%
    deliverables:
      code:
        - GraphQL module & wired handlers
      documentation:
        - API usage notes

  - name: QA & analytics instrumentation
    description: Add MSW mocks for Storybook/tests, update analytics events, and document QA checklist.
    files:
      - src/stories/configurator/ModelConfigurator.stories.tsx
      - src/stories/cart/CartEditFlow.stories.tsx
      - tests/integration/configuratorApi.test.tsx
      - analytics tracking config
      - docs/configurator-qa-checklist.md
    dependencies:
      internal:
        - Integrate configurator GraphQL mutations
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Ensure analytics team aligned on event schema.
          acceptance_criteria:
            - Overlap noted with analytics owner.
        - step: 1
          name: Update Storybook & MSW
          files:
            - src/stories/configurator/ModelConfigurator.stories.tsx
            - src/stories/cart/CartEditFlow.stories.tsx
          details:
            - Replace static mocks with MSW handlers mirroring GraphQL.
          acceptance_criteria:
            - Storybook renders with realistic responses.
        - step: 2
          name: Add integration tests
          files:
            - tests/integration/configuratorApi.test.tsx
          details:
            - Assert mutation called and store updated.
          acceptance_criteria:
            - Tests fail pre-integration, pass post.
        - step: 3
          name: Update analytics & QA docs
          files:
            - analytics config
            - docs/configurator-qa-checklist.md
          details:
            - Emit events on mutation success.
            - Document QA flow (configure -> cart -> payment).
          acceptance_criteria:
            - Analytics dashboards receiving events; QA sign-off referencing checklist.
      testing_requirements:
        unit_tests:
          - Analytics helper returns expected payload.
        integration_tests:
          - configuratorApi.test.tsx verifying network calls.
        e2e_tests:
          - Playwright verifying full flow with analytics check.
      monitoring_plan:
        dashboards:
          - Analytics configurator funnel
        alerts:
          - configurator_event_drop
    deliverables:
      code:
        - Updated stories/tests/analytics
      documentation:
        - QA checklist

workflow:
  order: sequential
  dependencies:
    - Integrate configurator GraphQL mutations depends-on Wire cart provider to Zustand store
    - QA & analytics instrumentation depends-on Integrate configurator GraphQL mutations
  cadences:
    standups: Tue/Thu
    demos: Mid-sprint integration demo, final demo on staging

rules:
  - DRY, KISS
  - stable params/returns
  - no duplicate functions
  - no ghost code
  - no overlapping code
  - no unnecessary complexity
  - confirm if requirements are ambiguous before implementing

acceptance_criteria:
  functional_requirements:
    - [ ] Configurator add/save/edit operations call real GraphQL endpoints.
    - [ ] Cart updates with configured options and persists through checkout.
    - [ ] Payment summary reflects updated cart without manual refresh.
    - [ ] Feature flag toggles new integration on/off cleanly.
  technical_requirements:
    - [ ] GraphQL client handles SSR/CSR safely.
    - [ ] Cart provider exposes dispatch/selectors via Context+Zustand without runtime errors.
    - [ ] Tests (unit/integration/e2e) pass in CI.
    - [ ] Mutation failure path shows user-friendly message and logs error.
  quality_requirements:
    - [ ] Storybook scenarios run with MSW-backed APIs.
    - [ ] QA checklist executed on staging.
    - [ ] Accessibility verified for loading/error states.
  security_requirements:
    - [ ] No sensitive data logged; GraphQL endpoints secured.
  analytics_requirements:
    - [ ] `configurator_add_to_cart` and `configurator_edit_saved` events appear in staging dashboard.

validation_matrix:
  test_plan:
    unit:
      owner: Frontend dev
      status: planned
    integration:
      owner: Frontend dev
      status: planned
    e2e:
      owner: QA lead
      status: planned
    accessibility:
      owner: QA lead
      status: planned
    performance:
      owner: Frontend dev
      status: planned
  sign_offs:
    - role: frontend-dev
      person: TBD
      status: pending
    - role: backend-dev
      person: TBD
      status: pending
    - role: qa
      person: TBD
      status: pending

metrics_and_observability:
  baseline_metrics:
    - name: configurator_add_to_cart (event absent)
      current_value: 0
      source: analytics
  target_metrics:
    - name: configurator_add_to_cart
      target_value: >0 within 24h of launch
      measurement_window: 7 days
    - name: cart_checkout_conversion
      target_value: +15% uplift after full rollout
      measurement_window: 30 days

checklist:
  - [ ] Code reviewed
  - [ ] Tests passed (unit/integration/e2e)
  - [ ] Storybook/docs updated where applicable
  - [ ] Feature flag rollout plan documented
  - [ ] Analytics events validated
  - [ ] Accessibility audit completed
  - [ ] Performance benchmarks documented
  - [ ] Operational runbook updated
  - [ ] Dedupe scan recorded and related owners notified (context.existing_initiatives)

tracking:
  document: ../.tracking/feat_tracking.md
  entry: "FEAT-20241030-4 | Configurator GraphQL integration & cart provider restore | new"
