### Fix 2: Update Data Mapping to Properly Extract Prices
```typescript
// FIXED: Robust price extraction and mapping
const mapWooToProductSchema = (wooProduct: any): ProductSchema => {
  // Extract price with fallback logic
  const extractPrice = (priceData: any): number => {
    if (!priceData) return 0;
    
    // Handle string prices (e.g., "$150.00" or "150.00")
    if (typeof priceData === 'string') {
      const cleanPrice = priceData.replace(/[^0-9.-]/g, '');
      const parsed = parseFloat(cleanPrice);
      return isNaN(parsed) ? 0 : parsed;
    }
    
    // Handle numeric prices
    if (typeof priceData === 'number') {
      return isNaN(priceData) ? 0 : priceData;
    }
    
    return 0;
  };

  return {
    id: wooProduct.id,
    databaseId: wooProduct.databaseId,
    name: wooProduct.name,
    description: wooProduct.description,
    shortDescription: wooProduct.shortDescription,
    sku: wooProduct.sku,
    type: wooProduct.type,
    
    // Extract all price fields
    price: extractPrice(wooProduct.price),
    regularPrice: extractPrice(wooProduct.regularPrice),
    salePrice: extractPrice(wooProduct.salePrice),
    
    // Map variations if present
    variations: wooProduct.variations?.nodes?.map((variation: any) => ({
      id: variation.id,
      databaseId: variation.databaseId,
      name: variation.name,
      sku: variation.sku,
      price: extractPrice(variation.price),
      regularPrice: extractPrice(variation.regularPrice),
      salePrice: extractPrice(variation.salePrice),
    })) || [],
    
    // ... other fields
  };
};
```

### Fix 3: Update Option Products Fetching
```typescript
// FIXED: fetchOptionProductsByIds with proper price mapping
export const fetchOptionProductsByIds = async (ids: number[]): Promise<ConfigurableProductSchema[]> => {
  const query = GET_OPTION_PRODUCTS_BY_IDS;
  const variables = { ids: ids.map(String) };
  
  const response = await fetchGraphQL(query, variables);
  
  if (!response.data?.products?.nodes) {
    return [];
  }

  return response.data.products.nodes.map((node: any) => {
    const extractPrice = (priceData: any): number => {
      if (!priceData) return 0;
      if (typeof priceData === 'string') {
        const cleanPrice = priceData.replace(/[^0-9.-]/g, '');
        const parsed = parseFloat(cleanPrice);
        return isNaN(parsed) ? 0 : parsed;
      }
      if (typeof priceData === 'number') {
        return isNaN(priceData) ? 0 : priceData;
      }
      return 0;
    };

    const configurableProduct: ConfigurableProductSchema = {
      id: node.id,
      databaseId: node.databaseId,
      name: node.name,
      slug: node.slug,
      description: node.description,
      shortDescription: node.shortDescription,
      type: node.type,
      
      // Extract prices
      price: extractPrice(node.price),
      regularPrice: extractPrice(node.regularPrice),
      salePrice: extractPrice(node.salePrice),
      
      // Map variations with prices
      variations: (node.variations?.nodes || []).map((variation: any) => ({
        id: variation.id,
        databaseId: variation.databaseId,
        name: variation.name,
        sku: variation.sku,
        price: extractPrice(variation.price),
        regularPrice: extractPrice(variation.regularPrice),
        salePrice: extractPrice(variation.salePrice),
        attributes: variation.attributes?.nodes || []
      })),
      
      // ... other fields
    };
    
    return configurableProduct;
  });
};
```

