## Business Rules and Constraints

### Compatibility Rules
1. **Base Model Compatibility**: Not all options work with all base models
2. **Option Dependencies**: Some options may require other options
3. **Conflict Resolution**: Some option combinations may conflict
4. **Required Options**: Some categories may be mandatory

### Inventory Management
1. **Variation-Level Stock**: Each variation has its own inventory
2. **Stock Validation**: Check availability before allowing selection
3. **Backorder Handling**: Handle out-of-stock variations gracefully
4. **SKU Management**: Each variation has unique SKU for tracking

### Pricing Rules
1. **Price Validation**: Ensure all prices are positive numbers
2. **Currency Handling**: Support multiple currencies if needed
3. **Tax Calculation**: Apply appropriate tax rates
4. **Discount Application**: Support promotional pricing

