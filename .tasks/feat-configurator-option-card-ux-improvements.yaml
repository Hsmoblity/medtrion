## Proposed Solutions

### Solution 1: Toggle Selection with Visual States

**Approach**: Replace button with toggle mechanism showing clear selection states

```tsx
// OptionCard.tsx - Improved implementation
interface OptionCardProps {
  option: ConfigurableProductSchema;
  isSelected: boolean;
  onToggle: (option: ConfigurableProductSchema) => void;
  // ... other props
}

const OptionCard: React.FC<OptionCardProps> = ({ option, isSelected, onToggle }) => {
  return (
    <div className={`option-card ${isSelected ? 'option-card-selected' : 'option-card-unselected'}`}>
      {/* Card content */}
      <div className="option-content">
        <h3 className="option-title">{option.name}</h3>
        
        {/* Fixed description rendering */}
        <div 
          className="option-description"
          dangerouslySetInnerHTML={{ __html: option.shortDescription }}
        />
        
        <div className="option-price">${option.price}</div>
      </div>
      
      {/* Toggle selection button */}
      <button
        onClick={() => onToggle(option)}
        className={`option-toggle-btn ${isSelected ? 'selected' : 'unselected'}`}
        aria-label={isSelected ? `Remove ${option.name} from configuration` : `Add ${option.name} to configuration`}
      >
        {isSelected ? (
          <>
            <span className="toggle-icon">✓</span>
            <span className="toggle-text">Selected</span>
          </>
        ) : (
          <>
            <span className="toggle-icon">+</span>
            <span className="toggle-text">Select</span>
          </>
        )}
      </button>
    </div>
  );
};
```

