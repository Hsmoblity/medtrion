## User Experience Flow

### Scenario: Changing Variation Selection

#### Initial State
1. User configures "Seat Color" option
2. Selects "Red Leather" variation
3. Clicks "Add to Configuration"
4. Summary shows: "Seat Color: Red Leather - $125"

#### Update Flow (Currently BROKEN)
5. User clicks on "Seat Color" option again
6. OptionVariationPopup opens showing current selection: "Red Leather"
7. User deselects "Red Leather"
8. User selects "Blue Fabric" variation
9. User clicks "Update Configuration"
10. **Expected**: Summary updates to "Seat Color: Blue Fabric - $130"
11. **Actual**: Summary still shows "Seat Color: Red Leather - $125" ❌

#### Expected Fix Flow
5. User clicks on already-configured "Seat Color" option
6. OptionVariationPopup opens in **UPDATE MODE**
7. Shows current selection: "Red Leather" (pre-selected)
8. User deselects "Red Leather", selects "Blue Fabric"
9. Price preview updates: $100 (base) + $30 (Blue Fabric) = $130
10. User clicks "Update Configuration"
11. **configuratorStore.updateOption()** called
12. Summary updates to show "Seat Color: Blue Fabric - $130" ✅
13. Total price updates correctly ✅

