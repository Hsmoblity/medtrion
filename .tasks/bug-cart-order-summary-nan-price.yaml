## Testing Requirements

### Unit Tests
```typescript
describe('Price Parsing and Calculation', () => {
  it('should handle 0 price correctly', () => {
    expect(parsePrice(0)).toBe(0);
    expect(parsePrice('0')).toBe(0);
    expect(parsePrice('$0.00')).toBe(0);
  });
  
  it('should handle NaN values correctly', () => {
    expect(parsePrice(NaN)).toBe(0);
    expect(parsePrice('invalid')).toBe(0);
    expect(parsePrice(null)).toBe(0);
    expect(parsePrice(undefined)).toBe(0);
  });
  
  it('should calculate order total correctly with 0 prices', () => {
    const items = [
      { id: '1', name: 'Free Item', price: 0, quantity: 1 },
      { id: '2', name: 'Paid Item', price: 10, quantity: 2 }
    ];
    
    const total = calculateOrderTotal(items);
    expect(total.subtotal).toBe(20);
    expect(total.tax).toBe(1.6);
    expect(total.total).toBe(21.6);
  });
});
```

