# Business Context
## Problem Statement
In the Model Configurator, when users click the select button on option cards, the variation popup does not appear. This prevents users from selecting specific variations for variable option products, leading to a broken user experience and inability to configure products properly.

## Business Impact
- **User Experience**: Users cannot access variation selection, breaking the core configurator functionality
- **Sales Impact**: Customers cannot complete product configurations, leading to abandoned purchases
- **Functionality**: Core feature of the Model Configurator is non-functional
- **Trust**: Broken functionality undermines user confidence in the platform
- **Support**: Increased support tickets due to non-working variation selection

## Success Metrics
- 100% of option card select button clicks trigger the variation popup
- All variable option products show their variations correctly
- Users can successfully select variations and add them to configuration
- No console errors related to popup triggering
- Improved user completion rate for product configuration

# User Story
**As a** customer using the Model Configurator
**I want** to click the select button on option cards and see the variation popup
**So that** I can choose specific variations for my product configuration

**Acceptance Criteria:**
- Clicking select button on option cards opens the variation popup
- Popup displays all available variations for the selected option
- Users can select variations and add them to configuration
- Popup closes properly after selection or cancellation
- Works for both SIMPLE and VARIABLE option types

# Technical Requirements

## Root Cause Analysis
The issue likely stems from one or more of the following problems:

### 1. Missing Click Handler
```typescript
