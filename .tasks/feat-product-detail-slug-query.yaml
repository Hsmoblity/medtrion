feature:
  title: Fetch product detail via GetProductBySlug query
  area: frontend
  priority: p0
  status: completed
  requested_by: techlead
  environment: production
  completed_by: claude-sonnet4
  completed_date: 2024-12-19

summary:
  goal: Replace legacy product detail fetches with a fresh WooCommerce GraphQL query that resolves by slug using `products(where: { slugIn: [$slug] })` so we always receive current pricing, attributes, and related options.
  scope:
    - Add GraphQL template `GetProductBySlug($slug: String!)` per provided shape.
    - Use the new query in product detail SSR (and related flows) instead of Contentful fallback.
    - Normalize response into `ConfigurableProductSchema`, including local/global attributes and `relatedOptions`.
  impact: Guarantees slug-based detail pages render with live WooCommerce data.

acceptance_criteria:
  - Query template defined in `src/lib/graphql/configurator.ts` (or `woocommerce.ts`) matches:
    ```graphql
    query GetProductBySlug($slug: String!) {
      products(where: { slugIn: [$slug] }, first: 1) {
        nodes {
          id
          databaseId
          name
          slug
          __typename
          shortDescription
          description
          localAttributes { nodes { label options } }
          globalAttributes { nodes { label terms { nodes { name } } } }
          relatedOptions
          image { sourceUrl }
          galleryImages(first: 10) { nodes { sourceUrl } }
          ... on SimpleProduct { price regularPrice salePrice }
        }
      }
    }
    ```
  - Product detail `getServerSideProps` consumes this query, sanitizes data for SSR, and falls back gracefully when no node returned.
  - Mapping layer populates configurator schema fields (images, pricing, related options).
  - Tests validate slug query returns expected node, handles empty result, and integrates with option-fetch logic.

implementation_plan:
  - Define query string and add client wrapper (`configuratorAPI.getProductBySlug`).
  - Replace existing GraphQL/Contentful fetch path in product detail view with new helper.
  - Normalize `localAttributes`, `globalAttributes`, and pricing fields; attach to product props.
  - Update mocks/tests to use new payload structure.

risks:
  - WooCommerce response may omit configurator categories; ensure option fetch still works via `relatedOptions`.
  - Slug mismatch (case sensitivity, hyphen differences) could still yield zero results; log and fallback gracefully.

stakeholders:
  - Frontend team
  - Backend/WooCommerce team
  - QA

