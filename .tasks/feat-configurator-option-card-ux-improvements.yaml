### Automated Testing

```typescript
// E2E Test - Option Card Toggle
describe('Option Card Toggle Functionality', () => {
  it('should toggle selection state correctly', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Navigate to a category
    cy.get('.configuration-category-item').contains('Warranty').click();
    
    // Wait for options to load
    cy.get('.option-card').should('be.visible');
    
    // Test initial state (unselected)
    cy.get('.option-card').first().should('have.class', 'option-card-unselected');
    cy.get('.option-toggle-btn').first().should('contain', 'Select');
    
    // Click to select
    cy.get('.option-toggle-btn').first().click();
    
    // Verify selected state
    cy.get('.option-card').first().should('have.class', 'option-card-selected');
    cy.get('.option-toggle-btn').first().should('contain', 'Selected');
    
    // Click to deselect
    cy.get('.option-toggle-btn').first().click();
    
    // Verify unselected state
    cy.get('.option-card').first().should('have.class', 'option-card-unselected');
    cy.get('.option-toggle-btn').first().should('contain', 'Select');
  });
  
  it('should display descriptions as formatted text', () => {
    cy.visit('/product/acorn-stairlift/configure');
    cy.get('.configuration-category-item').contains('Warranty').click();
    
    // Check that descriptions don't contain raw HTML
    cy.get('.option-description').each(($desc) => {
      cy.wrap($desc).should('not.contain', '<p>');
      cy.wrap($desc).should('not.contain', '<strong>');
      cy.wrap($desc).should('not.contain', '<em>');
    });
    
    // Check that formatting is applied
    cy.get('.option-description').should('be.visible');
  });
  
  it('should maintain selection state across categories', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Select an option in first category
    cy.get('.configuration-category-item').first().click();
    cy.get('.option-toggle-btn').first().click();
    
    // Switch to another category
    cy.get('.configuration-category-item').eq(1).click();
    
    // Switch back to first category
    cy.get('.configuration-category-item').first().click();
    
    // Verify option is still selected
    cy.get('.option-card').first().should('have.class', 'option-card-selected');
    cy.get('.option-toggle-btn').first().should('contain', 'Selected');
  });
});
```

