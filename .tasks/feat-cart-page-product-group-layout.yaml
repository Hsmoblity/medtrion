## Data Structure Requirements

### **Cart Group Data Structure**
```typescript
interface CartGroup {
  id: string;
  configId: string;
  mainProduct: Product;
  options: ProductOption[];
  totalPrice: number;
  quantity: number;
  createdAt: Date;
  updatedAt: Date;
}

interface Product {
  id: string;
  name: string;
  description: string;
  price: number;
  image: string;
  sku: string;
  type: 'SIMPLE' | 'VARIABLE';
  quantity: number;
}

interface ProductOption {
  id: string;
  name: string;
  description: string;
  price: number;
  sku: string;
  category: string;
  mainProductId: string;
}
```

### **Cart State Management**
```typescript
interface CartState {
  groups: CartGroup[];
  totalItems: number;
  totalPrice: number;
  isLoading: boolean;
  error: string | null;
}

// Cart Actions
interface CartActions {
  addProductGroup: (group: CartGroup) => void;
  removeProductGroup: (groupId: string) => void;
  updateProductQuantity: (groupId: string, quantity: number) => void;
  updateOptionQuantity: (groupId: string, optionId: string, quantity: number) => void;
  editConfiguration: (groupId: string) => void;
  clearCart: () => void;
}
```

## Component Architecture

### **Component Hierarchy**
```
CartPage
├── CartHeader
├── CartGroupsList
│   ├── ProductGroup
│   │   ├── GroupHeader
│   │   ├── BaseProductCard
│   │   │   ├── ProductImage
│   │   │   ├── ProductInfo
│   │   │   └── ProductControls
│   │   └── ProductOptionsList
│   │       ├── OptionsHeader
│   │       └── OptionItem
│   │           ├── ConnectionLine
│   │           └── OptionContent
│   └── EmptyCartState
├── CartSummary
└── CartActions
```

### **Component Props Interface**
```typescript
interface CartPageProps {
  groups: CartGroup[];
  isLoading: boolean;
  error: string | null;
}

interface ProductGroupProps {
  group: CartGroup;
  onEditConfiguration: (groupId: string) => void;
  onRemoveGroup: (groupId: string) => void;
  onUpdateQuantity: (groupId: string, quantity: number) => void;
}

interface BaseProductCardProps {
  product: Product;
  onEditConfiguration: () => void;
  onRemoveProduct: () => void;
  onUpdateQuantity: (quantity: number) => void;
}

interface ProductOptionsListProps {
  options: ProductOption[];
  mainProduct: Product;
  onEditConfiguration: () => void;
}
```

## Acceptance Criteria

### **Functional Requirements**
- [ ] Cart items are grouped by main product in block containers
- [ ] Each group displays main product with all associated options
- [ ] Visual hierarchy clearly distinguishes main products from options
- [ ] Connection lines show relationship between main product and options
- [ ] Pricing breakdown shows base price + options + group total
- [ ] Quantity controls work for main products and options
- [ ] Edit configuration button opens configurator with current settings
- [ ] Remove functionality works for entire groups or individual items

### **Visual Requirements**
- [ ] Group containers have clear boundaries and proper spacing
- [ ] Main products are visually prominent with larger typography
- [ ] Options are indented and visually connected to main product
- [ ] Connection lines are properly styled and positioned
- [ ] Pricing information is clearly displayed and formatted
- [ ] Responsive layout works on mobile, tablet, and desktop
- [ ] Loading states and empty states are properly handled

### **Technical Requirements**
- [ ] Components are properly typed with TypeScript
- [ ] State management integrates with existing cart store
- [ ] Performance is optimized for large cart contents
- [ ] Accessibility requirements are met (ARIA labels, keyboard navigation)
- [ ] Cross-browser compatibility is maintained
- [ ] Code follows established patterns and conventions

### **User Experience Requirements**
- [ ] Cart is easy to understand and navigate
- [ ] Product groupings are intuitive and logical
- [ ] Pricing is transparent and accurate
- [ ] Actions are clearly labeled and accessible
- [ ] Loading and error states provide good feedback
- [ ] Mobile experience is optimized for touch interaction

