## Expected Behavior
```typescript
// Correct Implementation
const handleStartConfiguration = async (product: ProductSchema) => {
  try {
    // Show loading state
    setLoading(true);
    
    // Fetch product options
    const productOptions = await fetchProductOptions(product.id);
    
    // Navigate to configuration page with options
    navigate(`/product/${product.slug}/configure`, {
      state: {
        product,
        options: productOptions,
        configurationState: {
          selectedProduct: product,
          selectedOptions: [],
          categories: groupOptionsByCategory(productOptions),
          loading: false
        }
      }
    });
  } catch (error) {
    console.error('Failed to start configuration:', error);
    // Show error message to user
  } finally {
    setLoading(false);
  }
};

const ProductDetailPage: React.FC = ({ product, isConfiguratorMode }) => {
  return (
    <div className="product-detail">
      {/* Product information */}
      
      {/* Only show Start Configuration button on product detail page */}
      {!isConfiguratorMode && (
        <button onClick={() => handleStartConfiguration(product)}>
          Start Configuration
        </button>
      )}
    </div>
  );
};

const ConfigurationPage: React.FC = ({ product, options }) => {
  const [configurationState, setConfigurationState] = useState({
    selectedProduct: product,
    selectedOptions: [],
    categories: groupOptionsByCategory(options),
    loading: false
  });
  
  return (
    <div className="configuration-page">
      {/* Configuration interface with options */}
      <ModelConfigurator
        product={product}
        options={options}
        configurationState={configurationState}
      />
    </div>
  );
};
```

