feature:
  title: Provide reusable loading overlay skeleton
  area: frontend
  priority: p1
  status: new
  requested_by: techlead
  environment: production

summary:
  goal: Build a shared loading overlay/skeleton component reusable across pages that incur heavy data fetches (configurator, shop, cart).
  scope:
    - Design a consistent overlay with spinner/skeleton states that can be dropped into any page.
    - Support blocking and non-blocking modes (full-page overlay vs section-level skeleton).
    - Integrate into key flows currently showing ad-hoc loaders.
  impact: Improves perceived performance and consistency while data loads.

acceptance_criteria:
  - New `LoadingOverlay` component (or skeleton variant) lives under `src/components/ui` with props for `show`, `variant`, `message`.
  - Component supports full-screen overlay and inline skeleton list/grid.
  - At least two heavy-load pages adopt the overlay (e.g., configurator SSR fallback, shop page SSR/CSR load).
  - Storybook stories document usage; visual regression snapshot added.

implementation_plan:
  - Define component API and Tailwind/CSS tokens for backdrop, spinner, skeleton shimmer.
  - Implement component with accessibility (aria-busy, role status) and reduced-motion support.
  - Refactor targeted pages to use the shared overlay (replace bespoke loaders).
  - Add docs/snippets in `/docs/ui-loading-overlay.md` and tests verifying render logic.

risks:
  - Incorrect overlay usage could block interaction unnecessarily; document guidance.
  - Need to ensure performance of skeleton shimmer (respect prefers-reduced-motion).

stakeholders:
  - Frontend team
  - Product/UX
  - QA
