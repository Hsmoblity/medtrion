### Phase 3: Check Event Handlers

```typescript
// Verify option toggle updates state
const handleOptionToggle = (option, categoryId) => {
  setSelectedOptions(prev => {
    // Check if this properly updates state immutably
    const categoryOptions = prev[categoryId] || [];
    const isSelected = categoryOptions.some(o => o.id === option.id);
    
    return {
      ...prev,  // ← Immutable update required
      [categoryId]: isSelected
        ? categoryOptions.filter(o => o.id !== option.id)
        : [...categoryOptions, option]
    };
  });
};
```

## Fix Strategy

### Option A: Pass State as Prop (Most Likely Fix)

**ModelConfigurator.tsx:**
```tsx
// Ensure selectedOptions is passed to sidebar
<ConfiguratorSidebar
  categories={categories}
  selectedOptions={selectedOptions}  // ← Add this prop
  onCategoryChange={setCurrentCategoryId}
/>
```

**ConfiguratorSidebar.tsx:**
```tsx
interface ConfiguratorSidebarProps {
  categories: ConfiguratorCategory[];
  selectedOptions: Record<string, ConfigurableProductSchema[]>;  // ← Add this
  currentCategoryId?: string;
  onCategoryChange?: (categoryId: string) => void;
}

const ConfiguratorSidebar: React.FC<ConfiguratorSidebarProps> = ({
  categories,
  selectedOptions,  // ← Use this
  currentCategoryId,
  onCategoryChange
}) => {
  // Calculate totals
  const totalSelected = useMemo(() => 
    Object.values(selectedOptions).flat().length,
    [selectedOptions]  // ← Recalculate when selectedOptions changes
  );

  const totalOptions = useMemo(() => 
    categories.reduce((sum, cat) => sum + (cat.options?.length || 0), 0),
    [categories]
  );

  return (
    <div>
      {/* Progress bar */}
      <div className="progress-section">
        <p>Total: {totalSelected} of {totalOptions} options selected</p>
        <div className="progress-bar">
          <div 
            className="progress-fill"
            style={{ width: `${(totalSelected / totalOptions) * 100}%` }}
          />
        </div>
      </div>
    </div>
  );
};
```

### Option B: Use Zustand Store (If Using Global State)

```typescript
// src/stores/configuratorStore.ts
export const useConfiguratorStore = create<ConfiguratorState>((set, get) => ({
  selectedOptions: {},
  
  getSelectedCount: () => {
    const options = get().selectedOptions;
    return Object.values(options).flat().length;
  },
  
  addOption: (option, categoryId) => {
    set(state => ({
      selectedOptions: {
        ...state.selectedOptions,
        [categoryId]: [...(state.selectedOptions[categoryId] || []), option]
      }
    }));
  }
}));

// In Sidebar component
const ConfiguratorSidebar = () => {
  const selectedCount = useConfiguratorStore(state => 
    Object.values(state.selectedOptions).flat().length
  );
  
  return <div>Total: {selectedCount} options selected</div>;
};
```

### Option C: Fix Stale Closure (If Using useEffect)

```typescript
// Fix stale closure issue
const ConfiguratorSidebar = ({ selectedOptions }) => {
  const [displayCount, setDisplayCount] = useState(0);
  
  // Update display count when selectedOptions changes
  useEffect(() => {
    const count = Object.values(selectedOptions).flat().length;
    setDisplayCount(count);
  }, [selectedOptions]);  // ← Ensure dependency is correct
  
  return <div>Total: {displayCount} options selected</div>;
};
```

