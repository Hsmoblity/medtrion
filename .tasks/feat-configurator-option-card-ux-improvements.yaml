### State Management Updates

**CategoryGroup.tsx**:
```tsx
// Pass selection state to OptionCard
<OptionCard
  key={option.databaseId}
  option={option}
  isSelected={isSelected(option)} // Add this prop
  onToggle={() => onToggleOption?.(option)}
  // ... other props
