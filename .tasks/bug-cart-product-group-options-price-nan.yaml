## Testing Requirements

### **Unit Tests**
```typescript
// src/utils/__tests__/priceValidation.test.ts
import { parsePrice, formatPrice, isValidPrice } from '../priceValidation';

describe('Price Validation Utilities', () => {
  test('parsePrice handles valid numbers', () => {
    expect(parsePrice(25.50)).toBe(25.50);
    expect(parsePrice(0)).toBe(0);
    expect(parsePrice(-10)).toBe(-10);
  });

  test('parsePrice handles string prices', () => {
    expect(parsePrice('25.50')).toBe(25.50);
    expect(parsePrice('$25.50')).toBe(25.50);
    expect(parsePrice('USD 25.50')).toBe(25.50);
  });

  test('parsePrice handles invalid values', () => {
    expect(parsePrice(null)).toBe(0);
    expect(parsePrice(undefined)).toBe(0);
    expect(parsePrice('invalid')).toBe(0);
    expect(parsePrice(NaN)).toBe(0);
  });

  test('formatPrice formats correctly', () => {
    expect(formatPrice(25.50)).toBe('$25.50');
    expect(formatPrice(0)).toBe('$0.00');
    expect(formatPrice('25.50')).toBe('$25.50');
    expect(formatPrice(null)).toBe('$0.00');
  });

  test('isValidPrice validates correctly', () => {
    expect(isValidPrice(25.50)).toBe(true);
    expect(isValidPrice(0)).toBe(true);
    expect(isValidPrice('25.50')).toBe(true);
    expect(isValidPrice(null)).toBe(false);
    expect(isValidPrice('invalid')).toBe(false);
    expect(isValidPrice(NaN)).toBe(false);
  });
});
```

