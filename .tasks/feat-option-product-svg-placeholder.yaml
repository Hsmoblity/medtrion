## Accessibility

### ARIA Attributes
```typescript
<div 
  className="image-placeholder"
  role="img"
  aria-label={`${option.name} placeholder image`}
  aria-describedby={`${option.id}-description`}
>
  {/* SVG Icon */}
</div>

<span id={`${option.id}-description`} className="sr-only">
  Product image not available
</span>
```

### Screen Reader Support
- Proper `role="img"` for placeholder containers
- Descriptive `aria-label` indicating placeholder status
- Alternative text describing what the image represents
- Visual indicators don't rely on color alone

