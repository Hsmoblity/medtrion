## Product Requirements Document (PRD)

### Executive Summary

This PRD defines the comprehensive architecture for the HSM Mobility product configuration system, detailing the relationship between main products, option products, and their variations. The system supports complex three-level product hierarchies for customizable mobility equipment.

### Business Context

HSM Mobility sells configurable stairlifts and mobility equipment where customers can:
- Select a base model (main product)
- Choose from various option categories (option products)
- Customize specific variations within each option (variations)

This architecture enables sophisticated product customization while maintaining clear pricing, inventory, and configuration management.

---

## Product Architecture Overview

### Three-Level Hierarchy

```
Level 1: Main Products (Base Models)
    ↓
Level 2: Option Products (Configuration Categories)
    ↓
Level 3: Variations (Specific Customizations)
```

### Visual Representation

```
🏠 Main Product: "Acorn Stairlift 180"
├── 🎨 Option: "Seat Color" (VARIABLE, radio)
│   ├── 🔴 Variation: "Red Leather" (+$0)
│   ├── 🔵 Variation: "Blue Leather" (+$0)
│   └── ⚫ Variation: "Premium Black" (+$50)
├── 🛡️ Option: "Safety Features" (VARIABLE, checkbox)
│   ├── 🚨 Variation: "Emergency Stop" (+$99)
│   ├── 🛡️ Variation: "Safety Rails" (+$149)
│   └── 💡 Variation: "Warning Lights" (+$79)
└── 📦 Option: "Warranty" (SIMPLE)
    └── 📋 Variation: "5-Year Extended" (+$299)
```

---

## Level 1: Main Products (Base Models)

### Definition
Main products are the foundational stairlift models that customers start with. These are SIMPLE products in WooCommerce that reference option products through the `relatedOptions` field.

### Characteristics
- **Type**: `SIMPLE` in WooCommerce
- **Purpose**: Base stairlift models (e.g., "Acorn Stairlift 180", "Acorn Stairlift 130")
- **Identification**: Products with non-empty `relatedOptions` field
- **Filtering**: Excludes products with "option" in their slug

### Data Structure
```typescript
interface MainProduct {
  id: string;
  databaseId: number;
  name: string; // "Acorn Stairlift 180"
  slug: string; // "acorn-stairlift-180"
  type: "SIMPLE";
  price: number; // Base model price
  description: string;
  shortDescription: string;
  image: {
    sourceUrl: string;
    altText: string;
  };
  relatedOptions: number[]; // Array of option product database IDs
  _related_options_products?: OptionProduct[]; // Populated option objects
}
```

### Examples
```typescript
// Main Product Examples
{
  id: "acorn-stairlift-180",
  name: "Acorn Stairlift 180",
  type: "SIMPLE",
  price: 2500,
  relatedOptions: [101, 102, 103, 104, 105]
},
{
  id: "acorn-stairlift-130", 
  name: "Acorn Stairlift 130",
  type: "SIMPLE",
  price: 2200,
  relatedOptions: [101, 102, 103, 106, 107]
}
```

### Business Rules
1. **Unique Base Models**: Each main product represents a distinct stairlift model
2. **Option Compatibility**: Not all options are compatible with all base models
3. **Base Pricing**: Main product price is the starting point for configuration
4. **Required Selection**: Users must select a main product before configuring options

---

## Level 2: Option Products (Configuration Categories)

### Definition
Option products are VARIABLE products in WooCommerce that represent configuration categories. They contain multiple variations that users can choose from to customize their stairlift.

### Characteristics
- **Type**: `VARIABLE` in WooCommerce
- **Purpose**: Configuration categories (e.g., "Seat Color", "Safety Features", "Warranty")
- **Identification**: Products with "option" in slug OR referenced in main product's `relatedOptions`
- **Categories**: Organized by `optionType` (SAFETY, COMFORT, INSTALLATION, ACCESSORY, DELIVERY, WARRANTY)

### Data Structure
```typescript
interface OptionProduct {
  id: string;
  databaseId: number;
  name: string; // "Comfort Seat Upgrade"
  slug: string; // "comfort-seat-option"
  type: "VARIABLE";
  optionType: "SAFETY" | "COMFORT" | "INSTALLATION" | "ACCESSORY" | "DELIVERY" | "WARRANTY";
  variableType: "radio" | "checkbox"; // Selection behavior
  price: number; // Base option price
  description: string;
  shortDescription: string;
  image: {
    sourceUrl: string;
    altText: string;
  };
  variations: Variation[]; // Array of specific variations
  compatibleBaseModels?: number[]; // Which main products this option works with
}
```

### Option Categories

#### 1. SAFETY Options
- **Purpose**: Safety-related features and accessories
- **Examples**: Emergency stop buttons, safety rails, warning lights
- **Selection**: Usually checkbox (multiple features allowed)
- **Pricing**: Individual feature pricing

```typescript
{
  name: "Safety Features Package",
  optionType: "SAFETY",
  variableType: "checkbox",
  variations: [
    { name: "Emergency Stop Button", price: 99 },
    { name: "Safety Rails", price: 149 },
    { name: "Warning Lights", price: 79 }
  ]
}
```

#### 2. COMFORT Options
- **Purpose**: Comfort and convenience features
- **Examples**: Seat colors, padding upgrades, armrests
- **Selection**: Usually radio (single choice) or checkbox (multiple)
- **Pricing**: Often base price with variation modifiers

```typescript
{
  name: "Seat Color Selection",
  optionType: "COMFORT", 
  variableType: "radio",
  variations: [
    { name: "Red Leather", price: 0 },
    { name: "Blue Leather", price: 0 },
    { name: "Premium Black", price: 50 }
  ]
}
```

#### 3. INSTALLATION Options
- **Purpose**: Installation and setup services
- **Examples**: Professional installation, custom fitting, electrical work
- **Selection**: Usually radio (single service level)
- **Pricing**: Service-based pricing

```typescript
{
  name: "Installation Service",
  optionType: "INSTALLATION",
  variableType: "radio", 
  variations: [
    { name: "Standard Installation", price: 299 },
    { name: "Premium Installation", price: 499 },
    { name: "White-Glove Service", price: 799 }
  ]
}
```

#### 4. ACCESSORY Options
- **Purpose**: Additional accessories and add-ons
- **Examples**: Remote controls, charging stations, covers
- **Selection**: Usually checkbox (multiple accessories)
- **Pricing**: Individual accessory pricing

#### 5. DELIVERY Options
- **Purpose**: Delivery and shipping options
- **Examples**: Standard delivery, express delivery, white-glove delivery
- **Selection**: Usually radio (single delivery method)
- **Pricing**: Delivery-based pricing

#### 6. WARRANTY Options
- **Purpose**: Warranty and service plans
- **Examples**: Extended warranties, service plans, maintenance packages
- **Selection**: Usually radio (single warranty level)
- **Pricing**: Warranty-based pricing

### Business Rules
1. **Category Organization**: Each option belongs to exactly one category
2. **Selection Behavior**: Radio (single) vs Checkbox (multiple) based on `variableType`
3. **Compatibility**: Options may only work with specific base models
4. **Pricing**: Base option price + variation price modifiers
5. **Required vs Optional**: Some categories may be required for configuration

