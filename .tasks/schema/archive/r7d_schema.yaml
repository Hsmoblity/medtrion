id: R7D-XXX
project: <project-name>
template: Research & Design
description: <Explain the research objective and decision to enable>

overview:
  problem_statement: |
    <Describe the user/business problem. Include context and constraints.>
  opportunity_hypothesis: |
    <What success could look like if the research validates the idea?>
  timeframe:
    start: <YYYY-MM-DD>
    end: <YYYY-MM-DD>
  sponsors:
    - <product manager/designer/tech lead>
  stakeholders:
    - <team or individual needing updates>
  related_work:
    - <Linked FEAT/BUG/PRD docs>
  initiative_overlap:
    related_initiatives:
      - id: <initiative id or link>
        focus: <summary>
        status: <discovery|delivery|shipped>
    differentiation_notes: |
      <Document findings from the dedupe scan and clarify how this research adds new insight or supports existing efforts.>
    alignment_owner_notified: <yes|no>

research_questions:
  primary:
    - <Key question whose answer unblocks a decision>
  secondary:
    - <Supporting or exploratory question>

success_metrics:
  decision_criteria:
    - <What must be true to proceed>
  quantitative:
    - metric: <name>
      baseline: <value/source>
      target: <desired change>
  qualitative:
    - <User sentiment, usability thresholds>

hypotheses:
  - statement: <Hypothesis to validate>
    supporting_evidence:
      - <Existing data or assumption>
    experiment_risk: <low|medium|high>

methodology:
  research_methods:
    - type: <usability test|survey|data analysis|benchmark>
      participants: <count and profile>
      artifacts: <prototype, interview script>
  constraints:
    recruitment: <lead time, demographic>
    tooling: <Figma, Lookback, analytics>
    legal_compliance: <PII handling, consent>

tasks:
  - name: <Research/Design task name>
    description: <Detailed outcome for this task>
    owners:
      - role: <designer|ux researcher|engineer>
        person: <name>
    files:
      - <doc/design/prototype path>
    steps:
      - name: Confirm existing initiative alignment
        details:
          - Review backlog, roadmap, and knowledge base for overlapping research
          - Update overview.initiative_overlap with findings and outreach notes
        success_indicator: <Overlap documented and owning leads aligned>
      - <Step-by-step action plan>
      - <Validation or synthesis milestone>
    data_capture_plan:
      instruments:
        - <Interview guide, analytics query>
      storage: <Notion doc, spreadsheet, repository>
    success_indicators:
      - <Observable signal that the task answered the question>

analysis_plan:
  synthesis_workshops:
    - <Session name, participants>
  frameworks:
    - <Journey map, Kano, SWOT>
  deliverable_outline:
    - <Sections expected in final report>
  decision_forum:
    name: <Design review/Steering committee>
    date: <YYYY-MM-DD>
    required_materials:
      - <Deck, prototype link, summary>

risk_management:
  risks:
    - description: <risk>
      mitigation: <action>
      trigger: <signal to escalate>
  open_questions:
    - <Unknown requiring follow-up>

outputs:
  - type: <Research summary|Prototype|Architecture memo>
    description: <What it contains>
    format: <Notion, PDF, Storybook>
    distribution_list:
      - <stakeholder email or channel>

acceptance_criteria:
  - [ ] Research questions answered or follow-up items documented
  - [ ] Insights synthesized into shareable format with source links
  - [ ] Recommendations include effort/impact assessment
  - [ ] Decision record captured (proceed/pivot/stop)
  - [ ] Stakeholders reviewed findings and acknowledged outcomes

checklist:
  - [ ] Recruitment completed and participants confirmed
  - [ ] Consent/privacy requirements satisfied
  - [ ] Sessions executed and recorded
  - [ ] Notes transcribed and stored in shared location
  - [ ] Synthesis workshop held and outcomes documented
  - [ ] Final artifacts shared with stakeholders
  - [ ] Next steps/roadmap adjustments proposed
  - [ ] Dedupe/overlap alignment documented (overview.initiative_overlap)

tracking:
  document: ../.tracking/r7d_tracking.md
  entry: "R7D-XXX | <research-title> | <status> | <decision summary>"
