```

### Phase 2: Browser DevTools Inspection
1. Open browser DevTools (F12)
2. Inspect `<body>` element computed styles
3. Look for `cursor` property in computed styles
4. Check for any elements with `cursor: none`
5. Verify cursor image URLs (if using custom cursor)

### Phase 3: Test Specific Elements
1. Check interactive elements (buttons, links)
2. Verify form inputs and textareas
3. Test hover states on cards and components
4. Check modal/overlay z-index stacking

## Fix Strategy

### Option A: Remove Global Cursor Override
```css
/* globals.css - REMOVE if exists */
* {
  cursor: none;  /* ❌ DELETE THIS */
}
```

### Option B: Fix Custom Cursor Implementation
```css
/* globals.css - FIX custom cursor */
body {
  /* Ensure fallback cursor is specified */
  cursor: url('/cursor-click.svg'), auto;
}

/* Verify SVG file exists in public/ */
```

### Option C: Fix Component-Specific Issue
```typescript
// Remove cursor: none from component styles
// Check for inline styles or CSS modules
<div style={{ cursor: 'none' }}>  {/* ❌ REMOVE */}
```

### Option D: Fix Tailwind Configuration
```javascript
// tailwind.config.js - check cursor utilities
module.exports = {
  theme: {
    extend: {
      cursor: {
        // Verify custom cursor definitions
      }
    }
  }
}
```

## Testing Plan

### Manual Testing
1. **Desktop Browsers**: Test on Chrome, Firefox, Safari, Edge
2. **Different Pages**: Homepage, product pages, cart, checkout
3. **Interactive Elements**: Buttons, links, forms, modals
4. **Hover States**: Verify cursor changes appropriately
5. **Accessibility**: Test with high contrast mode enabled

### Automated Testing
```typescript
// Cursor visibility test (Playwright)
test('cursor should be visible on desktop', async ({ page }) => {
  await page.goto('/');
  
  const body = await page.locator('body');
  const cursorStyle = await body.evaluate((el) => 
    window.getComputedStyle(el).cursor
  );
  
  expect(cursorStyle).not.toBe('none');
  expect(cursorStyle).toBeTruthy();
});

// Interactive elements cursor test
test('buttons should show pointer cursor', async ({ page }) => {
  await page.goto('/');
  
  const button = await page.locator('button').first();
  const cursorStyle = await button.evaluate((el) => 
    window.getComputedStyle(el).cursor
  );
  
  expect(cursorStyle).toBe('pointer');
});
```

### CSS Audit Checklist
- [ ] No `cursor: none` in global styles
- [ ] Custom cursor images exist and are valid
- [ ] Cursor property not overridden with `!important`
- [ ] Interactive elements have `cursor: pointer`
- [ ] Form inputs have `cursor: text`
- [ ] No z-index issues covering cursor

## Files to Modify

### Primary Suspects
1. `globals.css` - Most likely location of global cursor override
2. `tailwind.config.js` - Tailwind cursor customizations
3. `src/components/PageLayout/Header.tsx` - Navigation cursor styles
4. `src/components/ui/PrimaryButton.tsx` - Button cursor styles
5. `src/styles/**/*.css` - Any CSS module files

### Quick Fix Approach
```css
/* globals.css - Add this if cursor is globally hidden */
* {
  cursor: inherit !important;
}

body {
  cursor: auto !important;
}

button, a, [role="button"] {
  cursor: pointer !important;
}

input, textarea {
  cursor: text !important;
}
```

