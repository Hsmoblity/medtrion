### **Step 4: Update ProductGroup Component**
```typescript
// src/components/cart/ProductGroup.tsx
import { parsePrice, formatPrice } from '@/utils/priceValidation';

interface ProductGroupProps {
  group: CartGroup;
  onEditConfiguration: (groupId: string) => void;
  onRemoveGroup: (groupId: string) => void;
  onUpdateQuantity: (groupId: string, quantity: number) => void;
}

const ProductGroup: React.FC<ProductGroupProps> = ({
  group,
  onEditConfiguration,
  onRemoveGroup,
  onUpdateQuantity
}) => {
  // Calculate group total with price validation
  const calculateGroupTotal = (group: CartGroup): number => {
    const mainProductPrice = parsePrice(group.mainProduct.price);
    const optionsTotal = group.options.reduce((sum, option) => {
      return sum + parsePrice(option.price);
    }, 0);
    return mainProductPrice + optionsTotal;
  };

  const groupTotal = calculateGroupTotal(group);

  return (
    <div className="product-group">
      <div className="group-header">
        <div className="group-info">
          <h2 className="group-title">{group.mainProduct.name}</h2>
          <div className="group-meta">
            <span className="item-count">{group.options.length + 1} items</span>
            <span className="group-type">Configured Product</span>
            <span className="group-id">Config ID: {group.configId}</span>
          </div>
        </div>
        <div className="group-total">
          <div className="total-price">{formatPrice(groupTotal)}</div>
          <div className="total-label">Group Total</div>
        </div>
      </div>
      
      <div className="group-items">
        <div className="main-product-item">
          <BaseProductCard 
            product={group.mainProduct}
            onEditConfiguration={() => onEditConfiguration(group.id)}
            onRemoveProduct={() => onRemoveGroup(group.id)}
            onUpdateQuantity={(quantity) => onUpdateQuantity(group.id, quantity)}
          />
        </div>
        
        {group.options.length > 0 && (
          <ProductOptionsList
            options={group.options}
            mainProduct={group.mainProduct}
            onEditConfiguration={() => onEditConfiguration(group.id)}
          />
        )}
      </div>
    </div>
  );
};
```

