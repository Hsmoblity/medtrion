#### Step 1.3: Identify Duplicate State
- Map all state variables across components
- Identify duplicates between local and global
- Document data flow and dependencies

### Phase 2: Design Consolidated State Architecture (2-4 hours)

#### Step 2.1: Define Global State Structure
```typescript
// Global stores for shared data
- configuratorStore: Model configuration state
- cartStore: Shopping cart state
- productStore: Product catalog/cache
- userStore: User preferences/session
```

#### Step 2.2: Define State Ownership
```typescript
// Clear ownership for each piece of state
Model Configuration -> configuratorStore
Cart Items -> cartStore
Product Catalog -> productStore
UI Interactions -> Local component state
```

#### Step 2.3: Design Data Flow
```
User Action
    ↓
Component Handler
    ↓
Global Store Action
    ↓
State Update
    ↓
All Subscribers Re-render
    ↓
Persist (if needed)
```

### Phase 3: Implementation (8-12 hours)

#### Step 3.1: Consolidate Configurator State
```typescript
// Remove local state duplicates
- Remove: const [categories, setCategories] = useState(...)
- Remove: const [compatibilityIssues, setCompatibilityIssues] = useState(...)
- Use: const { categories, compatibilityIssues } = useConfiguratorStore()

// Fix duplicate store calls
- Remove: Duplicate useConfiguratorStore() calls
- Use: Single store call with all needed state/actions
```

#### Step 3.2: Audit and Fix Other Pages
For each page:
1. Identify current state management
2. Determine what should be global vs local
3. Move shared data to global store
4. Keep only UI state local
5. Test data flow and persistence

#### Step 3.3: Create Missing Stores
If needed, create:
- `cartStore.ts` - For cart state management
- `productStore.ts` - For product catalog/cache
- Ensure all stores follow consistent patterns

#### Step 3.4: Update Data Flow
- Ensure cart ↔ configurator flow uses global state
- Ensure product → configurator flow uses global state
- Ensure checkout → cart flow uses global state
- Test all cross-page data flows

