### **2. Base Product Card Layout**

#### **Base Product Card Structure**
```vue
<template>
  <div class="base-product-card">
    <!-- Product Image Section -->
    <div class="product-image-section">
      <SafeImage 
        :src="product.image" 
        :alt="product.name"
        class="product-image"
      />
    </div>
    
    <!-- Product Information Section -->
    <div class="product-info-section">
      <!-- Product Header -->
      <div class="product-header">
        <h2 class="product-title">{{ product.name }}</h2>
        <div class="product-meta">
          <span class="product-sku">SKU: {{ product.sku }}</span>
          <span class="product-type">Base Model</span>
        </div>
      </div>
      
      <!-- Product Description -->
      <div class="product-description">
        <p>{{ product.description }}</p>
      </div>
      
      <!-- Configuration Status -->
      <div class="configuration-status">
        <div class="config-indicator">
          <ConnectionDot />
          <span class="config-text">Configured Product</span>
        </div>
        <button class="btn-edit-config" @click="editConfiguration">
          <EditIcon />
          <span>Edit Configuration</span>
        </button>
      </div>
    </div>
    
    <!-- Product Controls Section -->
    <div class="product-controls-section">
      <!-- Quantity Controls -->
      <div class="quantity-controls">
        <button class="btn-quantity" @click="decreaseQuantity">-</button>
        <span class="quantity-display">{{ product.quantity }}</span>
        <button class="btn-quantity" @click="increaseQuantity">+</button>
      </div>
      
      <!-- Price Display -->
      <div class="price-display">
        <span class="price-amount">${{ formatPrice(product.price) }}</span>
        <span class="price-label">Base Price</span>
      </div>
      
      <!-- Remove Button -->
      <button class="btn-remove" @click="removeProduct">
        <TrashIcon />
        <span>Remove</span>
      </button>
    </div>
  </div>
</template>
```

