- [ ] No TypeScript compilation errors
- [ ] Homepage shows configurable products correctly
- [ ] Shop page filters work as expected
- [ ] All tests pass with new field mapping

## Testing Plan

### Unit Tests
```typescript
// Test data mapping
describe('mapWooToProductSchema', () => {
  it('should map _related_options to relatedOptions', () => {
    const wooProduct = { relatedOptions: [1, 2, 3], /* ... */ };
    const result = mapWooToProductSchema(wooProduct);
    expect(result.relatedOptions).toEqual([1, 2, 3]);
    expect(result._related_options).toEqual([1, 2, 3]); // Backward compat
  });
});

// Test filtering
describe('filterConfigurableProducts', () => {
  it('should filter products with relatedOptions', () => {
    const products = [
      { relatedOptions: [1, 2], slug: 'product-1', title: 'Product 1' },
      { relatedOptions: [], slug: 'product-2', title: 'Product 2' },
    ];
    const result = filterConfigurableProducts(products);
    expect(result).toHaveLength(1);
    expect(result[0].slug).toBe('product-1');
  });
});
```

