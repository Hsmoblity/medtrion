## Expected Fix

### Data Flow Fix
```typescript
// ModelConfigurator.tsx - Ensure product price is included
const ModelConfigurator: React.FC = ({ product }) => {
  const basePrice = product.price || 0;
  const [selectedOptions, setSelectedOptions] = useState([]);
  
  const totalPrice = useMemo(() => {
    const optionsTotal = selectedOptions.reduce((sum, option) => sum + option.price, 0);
    return basePrice + optionsTotal;
  }, [basePrice, selectedOptions]);

  return (
    <div className="model-configurator">
      <ModelHero 
        product={product}
        basePrice={basePrice}
      />
      <SummaryPanel 
        basePrice={basePrice}
        selectedOptions={selectedOptions}
        totalPrice={totalPrice}
      />
    </div>
  );
};
```

### Price Display Component
```tsx
// ModelHero.tsx - Display base product price
const ModelHero: React.FC = ({ product, basePrice }) => {
  return (
    <div className="model-hero">
      <h1>{product.name}</h1>
      <div className="product-price">
        <span className="price-label">Base Price:</span>
        <span className="price-value">${basePrice.toFixed(2)}</span>
      </div>
      {/* Other product details */}
    </div>
  );
};
```

### Summary Panel Update
```tsx
// SummaryPanel.tsx - Include base price in summary
const SummaryPanel: React.FC = ({ basePrice, selectedOptions, totalPrice }) => {
  return (
    <div className="summary-panel">
      <div className="price-breakdown">
        <div className="base-price">
          <span>Base Product:</span>
          <span>${basePrice.toFixed(2)}</span>
        </div>
        {selectedOptions.map(option => (
          <div key={option.id} className="option-price">
            <span>{option.name}:</span>
            <span>${option.price.toFixed(2)}</span>
          </div>
        ))}
        <div className="total-price">
          <span>Total:</span>
          <span>${totalPrice.toFixed(2)}</span>
        </div>
      </div>
    </div>
  );
};
```

