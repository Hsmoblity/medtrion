#### 2. **ModelConfigurator Integration**
```typescript
// Update ModelConfigurator to handle option popup
const ModelConfigurator: React.FC = () => {
  const [optionPopup, setOptionPopup] = useState<OptionPopupState>({
    isOpen: false,
    selectedOption: null,
    selectedVariations: [],
    tempSelections: [],
    pricePreview: 0,
    isAlreadyInConfiguration: false
  });

  const handleViewOption = (option: OptionProduct) => {
    const isAlreadySelected = isOptionInConfiguration(option.id);
    const currentVariations = getCurrentVariations(option.id);
    
    setOptionPopup({
      isOpen: true,
      selectedOption: option,
      selectedVariations: currentVariations,
      tempSelections: currentVariations,
      pricePreview: calculateOptionPrice(option.price, currentVariations),
      isAlreadyInConfiguration: isAlreadySelected
    });
  };

  const handleAddToConfiguration = (option: OptionProduct, variations?: Variation[]) => {
    if (option.type === "SIMPLE") {
      // Add simple option to configuration
      addSimpleOptionToConfiguration(option);
    } else if (option.type === "VARIABLE" && variations) {
      // Add variable option with selected variations
      addVariableOptionToConfiguration(option, variations);
    }
    
    // Close popup
    setOptionPopup(prev => ({ ...prev, isOpen: false }));
  };

  return (
    <div className="model-configurator">
      {/* Existing configurator content */}
      
      <OptionPopup
        isOpen={optionPopup.isOpen}
        option={optionPopup.selectedOption!}
        selectedVariations={optionPopup.selectedVariations}
        onClose={() => setOptionPopup(prev => ({ ...prev, isOpen: false }))}
        onAddToConfiguration={handleAddToConfiguration}
        onCancel={() => setOptionPopup(prev => ({ ...prev, isOpen: false }))}
      />
    </div>
  );
};
```

