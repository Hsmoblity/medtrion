id: FEAT-XXX
project: <project-name>
template: Feature
description: <1-2 sentence summary describing the user value and measurable goal>

context:
  background: |
    <Explain why this feature exists, the business context, and the problem being solved. Reference prior bugs/feats/PRDs where relevant.>
  personas:
    - <Persona name> — <primary motivation and pain point>
  dependencies:
    upstream:
      - <Feature/Bug/PRD id or external system prerequisite>
    downstream:
      - <Teams or deliverables that depend on this work>
  artefacts:
    prd: <link-or-doc id>
    design_spec: <link to Figma or design doc>
    analytics_dashboard: <link to dashboard or query>
  existing_initiatives:
    related_items:
      - id: <initiative id or link>
        summary: <what the initiative covers>
        status: <in-flight|shipped|backlog>
    overlap_rationale: |
      <Describe how this feature is distinct, extends, or hands off to the related initiatives. Record outcome of the dedupe scan.>
    owner_notified: <yes|no>

technical_requirements:
  architecture:
    data_models:
      - name: <InterfaceOrEntityName>
        description: <purpose>
        fields:
          - <fieldName>: <type> — <notes/validation>
    state_management:
      storage_keys:
        - key: <storage key>
          scope: <browser|server|hybrid>
          schema: <example JSON structure>
      caches:
        - name: <cache identifier>
          invalidation: <rules>
    services:
      apis:
        - name: <GraphQL/REST endpoint>
          method: <query|mutation|GET|POST>
          contract: <request/response summary>
          error_handling: <retry/backoff/logging>
      events:
        - channel: <BroadcastChannel/EventBus>
          payload: <payload description>
          latency_budget_ms: <number>
    feature_flags:
      - id: <flag name>
        default: <on|off>
        rollout_plan: <strategy>
  ux_requirements:
    routing:
      entry_points:
        - path: <route pattern>
          gate: <SSR|CSR>
      exit_paths:
        - success: <url>
        - cancel: <url>
        - error: <url>
    states:
      loading: <visible indicators>
      success: <copy/toasts>
      error: <messages and recovery actions>
      empty: <empty state behaviour>
    accessibility:
      keyboard: <tab order, shortcuts>
      screen_reader: <aria-live usage, labels>
      visual: <contrast, focus, motion guidelines>
    responsive_breakpoints:
      - name: mobile
        min_width: 0
        max_width: 767
        adjustments: <layout tweaks>
      - name: desktop
        min_width: 1024
        adjustments: <layout tweaks>
  analytics_requirements:
    events:
      - name: <event name>
        trigger: <interaction>
        payload:
          - <field>: <description>
        owner: <analytics stakeholder>
    funnels:
      - name: <funnel name>
        steps:
          - <event or page>
        success_metric: <conversion target>
  performance_budget:
    initial_load_ms: <target>
    interaction_latency_ms: <target>
    bundle_delta_kb: <target>
  security_considerations:
    data_sensitivity: <none|low|high>
    storage_policy: <encryption/compression requirements>
    logging: <PII redaction, log levels>
    threat_vectors:
      - <e.g., XSS, CSRF, replay>

customer_journeys:
  - scenario: <Scenario name>
    preconditions:
      - <cart contains configurable item>
    steps:
      - <step-by-step narrative>
    success_criteria:
      - <observable outcome>

non_functional_requirements:
  reliability: <uptime or error budget>
  observability:
    logs: <what to log>
    metrics: <metric name + unit>
    alerts: <thresholds>

rollout_strategy:
  phases:
    - name: <alpha/beta/ga>
      description: <scope>
      exit_criteria:
        - <metric or validation>
  fallback_plan: <toggle flag, revert instructions>

risks:
  known_risks:
    - description: <risk>
      mitigation: <plan>
      owner: <person or team>
  open_questions:
    - <question needing answer>

communications:
  stakeholders:
    - name: <person/team>
      update_cadence: <weekly standup, release note>
  documentation:
    - <Notion page, README, architectural decision record>

tasks:
  - name: <feature-task name>
    description: <Detailed task goal linking to the context>
    rationale: <Why this task is necessary and what breaks if omitted>
    files:
      - <new-or-updated-file path>
    dependencies:
      internal:
        - <step or module dependency>
      external:
        - <service or upstream change>
    steps:
      implementation_steps:
        - step: <0>
          name: Audit existing initiatives
          files: []
          details:
            - Review backlog, .tasks folder, and roadmap for overlapping work
            - Document findings in context.existing_initiatives.overlap_rationale
            - Notify owners of related initiatives when overlap exists
          acceptance_criteria:
            - Overlap assessment recorded and stakeholders acknowledged outcome
        - step: <1>
          name: <step title>
          files:
            - <file path>
          details:
            - <specific change requirement>
            - <edge case or validation>
          acceptance_criteria:
            - <condition verifying the step>
        - step: <2>
          name: <step title>
          files:
            - <file path>
          details:
            - <specific change requirement>
          acceptance_criteria:
            - <condition verifying the step>
      testing_requirements:
        unit_tests:
          - <function/component to cover>
        integration_tests:
          - <flow to exercise>
        e2e_tests:
          - <user journey>
        performance_tests:
          - metric: <name>
            threshold: <value>
      monitoring_plan:
        dashboards:
          - <dashboard or log explorer link>
        alerts:
          - name: <alert name>
            condition: <threshold>
    deliverables:
      code:
        - <PR or module>
      documentation:
        - <README/Storybook/ADR>
      operational:
        - <feature flag change, migration script>

workflow:
  order: <sequential|parallel|mixed>
  dependencies:
    - <Task A> depends-on <Task B>
  cadences:
    standups: <frequency>
    demos: <planned demo dates>

rules:
  - DRY, KISS
  - stable params/returns
  - no duplicate functions
  - no ghost code
  - no overlapping code
  - no unnecessary complexity
  - confirm if requirements are ambiguous before implementing

acceptance_criteria:
  functional_requirements:
    - [ ] <User observable behaviour requirement>
  technical_requirements:
    - [ ] <System/architecture commitment>
  quality_requirements:
    - [ ] <Testing, accessibility, localization, etc.>
  security_requirements:
    - [ ] <Security/privacy expectation>
  analytics_requirements:
    - [ ] <Event/funnel validation>

validation_matrix:
  test_plan:
    unit:
      owner: <name>
      status: <planned|in-progress|done>
    integration:
      owner: <name>
      status: <planned|in-progress|done>
    e2e:
      owner: <name>
      status: <planned|in-progress|done>
    accessibility:
      owner: <name>
      status: <planned|in-progress|done>
    performance:
      owner: <name>
      status: <planned|in-progress|done>
  sign_offs:
    - role: frontend-dev
      person: <name>
      status: <pending|approved>
    - role: backend-dev
      person: <name>
      status: <pending|approved>
    - role: qa
      person: <name>
      status: <pending|approved>

metrics_and_observability:
  baseline_metrics:
    - name: <metric>
      current_value: <value>
      source: <tool>
  target_metrics:
    - name: <metric>
      target_value: <value>
      measurement_window: <period>

checklist:
  - [ ] Code reviewed
  - [ ] Tests passed (unit/integration/e2e)
  - [ ] Storybook/docs updated where applicable
  - [ ] Feature flag rollout plan documented
  - [ ] Analytics events validated
  - [ ] Accessibility audit completed
  - [ ] Performance benchmarks documented
  - [ ] Operational runbook updated
  - [ ] Dedupe scan recorded and related owners notified (context.existing_initiatives)

tracking:
  document: ../.tracking/feat_tracking.md
  entry: "FEAT-XXX | <feature-title> | <status> | <short description>"
