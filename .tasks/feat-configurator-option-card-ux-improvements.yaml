## Feature Overview

Improve the user experience of option cards in the Model Configurator by replacing the "Add to Configuration" button with a toggle selection mechanism and fixing the description display to show normal text instead of HTML code.

### Business Value

- **User Experience**: More intuitive selection mechanism with visual feedback
- **Usability**: Clear toggle states (selected/deselected) improve user understanding
- **Content Display**: Proper text rendering instead of raw HTML improves readability
- **Accessibility**: Better screen reader support with clear selection states
- **Consistency**: Unified selection pattern across all option cards

## Current State

**Problems**:
1. **Button Text**: "Add to Configuration" button doesn't clearly indicate selection state
2. **No Toggle Feedback**: Users can't easily see if an option is already selected
3. **HTML Display**: Short descriptions show raw HTML code instead of formatted text
4. **Poor UX**: Confusing interaction pattern for selection/deselection

**Current Implementation**:
```tsx
// Current problematic implementation
<OptionCard
  option={option}
  onToggle={() => handleOptionToggle(option)}
  // Button shows "Add to Configuration" regardless of state
  // Description shows HTML: "<p>This is a <strong>description</strong></p>"
/>
```

## Desired State

**Improved Implementation**:
1. **Toggle Selection**: Replace button with clear toggle mechanism
2. **Visual States**: Clear selected/deselected visual indicators
3. **Text Rendering**: Display descriptions as formatted text, not HTML
4. **Better UX**: Intuitive selection pattern with immediate feedback

