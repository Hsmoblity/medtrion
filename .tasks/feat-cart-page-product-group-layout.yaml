### **3. Product Options Layout**

#### **Options Section Structure**
```vue
<template>
  <div class="options-section">
    <!-- Options Header -->
    <div class="options-header">
      <div class="options-header-left">
        <div class="connection-indicator">
          <ConnectionDot />
          <ConnectionLineHorizontal />
        </div>
        <div class="options-title-section">
          <h3 class="options-title">Selected Options</h3>
          <p class="options-subtitle">Connected to {{ mainProduct.name }}</p>
        </div>
      </div>
      <div class="options-count">
        {{ options.length }} options
      </div>
    </div>
    
    <!-- Options List -->
    <div class="options-list">
      <div 
        v-for="(option, index) in options" 
        :key="option.id"
        class="option-item"
      >
        <!-- Connection Line -->
        <div class="connection-line">
          <ConnectionLineVertical v-if="index < options.length - 1" />
          <ConnectionLineEnd v-else />
        </div>
        
        <!-- Option Content -->
        <div class="option-content">
          <div class="option-header">
            <h4 class="option-title">{{ option.name }}</h4>
            <span class="option-price">+${{ formatPrice(option.price) }}</span>
          </div>
          <p class="option-description">{{ option.description }}</p>
          <div class="option-meta">
            <span class="option-sku">SKU: {{ option.sku }}</span>
            <span class="option-category">{{ option.category }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>
```

