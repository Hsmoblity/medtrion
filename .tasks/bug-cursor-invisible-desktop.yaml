## Problem Statement

The mouse cursor becomes invisible or hidden on desktop browsers due to CSS styling issues. This severely impacts user experience and makes the site difficult to navigate, as users cannot see where they are clicking.

### Current Behavior

- Mouse cursor is invisible or not visible on desktop browsers
- Users cannot see where they are pointing/clicking
- Navigation and interaction become difficult and confusing
- Affects overall usability and accessibility

### Expected Behavior

- Mouse cursor should be visible at all times on desktop
- Standard cursor should display on normal elements
- Pointer cursor should display on interactive elements (links, buttons)
- Custom cursors (if any) should be clearly visible
- Cursor should follow system preferences and accessibility settings

## Impact

- **User Impact**: CRITICAL - Users cannot properly navigate the site
- **Accessibility Impact**: Violates accessibility guidelines (WCAG)
- **User Experience**: Severely degraded, may cause users to leave site
- **Business Impact**: Potential loss of conversions and user trust

## Affected Components

### Potential Root Causes

1. **Global CSS Reset**: Overly aggressive CSS reset hiding cursor
2. **Custom Cursor Implementation**: Broken custom cursor CSS
3. **Z-index Issues**: Overlay elements covering cursor
4. **CSS Properties**: Incorrect `cursor: none` declarations
5. **Image Cursor**: Missing or invalid cursor image files

### Files to Investigate

1. `globals.css` - Global styles that may hide cursor
2. `tailwind.config.js` - Tailwind customizations affecting cursor
3. `src/components/**/*.css` - Component-specific styles
4. `src/components/**/*.tsx` - Inline styles with cursor properties
5. `public/cursor-click.svg` - Custom cursor image (if used)

### Common CSS Patterns to Check

```css
/* Check for these problematic patterns */
* {
  cursor: none !important;  /* ❌ BAD */
}

body {
  cursor: url('/cursor.svg'), auto;  /* ⚠️ Check if image exists */
}

.interactive-element {
  cursor: inherit;  /* ⚠️ May inherit 'none' */
}
```

## Root Cause Analysis

### Likely Causes (Priority Order)

1. **Global Cursor Override**: CSS reset or global style setting `cursor: none`
2. **Custom Cursor SVG Missing**: Using `cursor: url(...)` with missing/broken file
3. **Hover State Bug**: Cursor hidden on hover states
4. **Overlay/Modal Issue**: Fixed position elements with high z-index hiding cursor
5. **Tailwind Utility**: Unintended `cursor-none` class applied globally

## Steps to Reproduce

1. Open the website on desktop browser (Chrome, Firefox, Safari)
2. Move mouse cursor over the page
3. **Observe**: Cursor is invisible or not visible
4. Try hovering over different elements (buttons, links, text)
5. **Check**: Cursor remains invisible throughout

