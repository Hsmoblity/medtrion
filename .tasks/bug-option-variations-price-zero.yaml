## Fix 2: Update fetchOptionProductsByIds to Parse Variation Prices
```typescript
// src/lib/woocommerce.ts
export const fetchOptionProductsByIds = async (
  ids: number[]
): Promise<ConfigurableProductSchema[]> => {
  const query = GET_OPTION_PRODUCTS_BY_IDS;
  const variables = { ids: ids.map(String) };
  
  const response = await fetchGraphQL(query, variables);
  
  if (!response.data?.products?.nodes) {
    return [];
  }

  return response.data.products.nodes.map((node: any) => {
    // Robust price parsing function
    const parsePrice = (priceValue: any): number => {
      if (priceValue === null || priceValue === undefined) {
        console.warn('Variation price is null/undefined');
        return 0;
      }
      
      if (typeof priceValue === 'number') {
        return isNaN(priceValue) ? 0 : priceValue;
      }
      
      if (typeof priceValue === 'string') {
        const cleanPrice = priceValue.replace(/[^0-9.-]/g, '');
        const parsed = parseFloat(cleanPrice);
        return isNaN(parsed) ? 0 : parsed;
      }
      
      console.warn(`Unexpected price type: ${typeof priceValue}`, priceValue);
      return 0;
    };

    const configurableProduct: ConfigurableProductSchema = {
      id: node.id,
      databaseId: node.databaseId,
      name: node.name,
      type: node.type,
      price: parsePrice(node.price),
      regularPrice: parsePrice(node.regularPrice || node.price),
      salePrice: node.salePrice ? parsePrice(node.salePrice) : null,
      variableType: node.variableType || undefined,
      
      // ⭐ CRITICAL: Map variations with proper price parsing
      variations: (node.variations?.nodes || []).map((variation: any) => {
        const variationPrice = parsePrice(variation.price);
        const variationRegularPrice = parsePrice(variation.regularPrice || variation.price);
        const variationSalePrice = variation.salePrice ? parsePrice(variation.salePrice) : null;
        
        // Debug logging
        console.log('Variation price mapping:', {
          variationId: variation.id,
          variationName: variation.name,
          rawPrice: variation.price,
          parsedPrice: variationPrice,
          rawRegularPrice: variation.regularPrice,
          parsedRegularPrice: variationRegularPrice
        });
        
        return {
          id: variation.id,
          databaseId: variation.databaseId,
          name: variation.name || '',
          sku: variation.sku || '',
          price: variationPrice,
          regularPrice: variationRegularPrice,
          salePrice: variationSalePrice,
          image: variation.image?.sourceUrl || '',
          attributes: variation.attributes?.nodes || []
        };
      }),
      
      // ... other fields
    };
    
    return configurableProduct;
  });
};
```

