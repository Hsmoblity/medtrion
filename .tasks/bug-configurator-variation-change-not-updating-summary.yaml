describe('configuratorStore - updateOption', () => {
  test('updates existing option with new variations', () => {
    const store = useConfiguratorStore.getState();
    
    // Add initial option
    store.addOption(optionWithRedLeather, 'color-category');
    
    let options = store.selectedOptions['color-category'];
    expect(options[0].selectedVariations[0].name).toBe('Red Leather');
    
    // Update option with new variation
    store.updateOption(optionWithBlueFabric, 'color-category');
    
    options = store.selectedOptions['color-category'];
    expect(options[0].selectedVariations[0].name).toBe('Blue Fabric');
    expect(options.length).toBe(1); // Should still be 1 option, not 2
  });

  test('updates option price when variation changes', () => {
    const store = useConfiguratorStore.getState();
    
    store.addOption({ ...option, totalPrice: 125 }, 'category-1');
    expect(store.summary.optionsTotal).toBe(125);
    
    store.updateOption({ ...option, totalPrice: 130 }, 'category-1');
    expect(store.summary.optionsTotal).toBe(130);
  });
});

