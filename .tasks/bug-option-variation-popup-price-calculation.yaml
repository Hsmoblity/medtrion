## User Experience Flow

### Selection Flow
1. **User clicks option card** → OptionVariationPopup opens
2. **Popup displays**:
   - Parent option name and description
   - Base option price: $100
   - Available variations with individual prices
   - Current total: $100 (base only)
3. **User selects variation** (e.g., Red Leather - $25)
4. **Price preview updates**:
   - Base option price: $100
   - + Selected variation: $25
   - = Total: $125
5. **User clicks "Add to Configuration"**
6. **Configuration summary updates**:
   - Shows "Seat Color (Red Leather): $125"
   - Updates grand total correctly

### Price Preview Requirements
- **Real-time Updates**: Price updates as variations selected/deselected
- **Clear Breakdown**: Shows base + variations = total
- **Visual Feedback**: Highlight selected variations
- **Accurate Totals**: Always shows correct combined price

# Testing Requirements

## Unit Tests
```typescript
describe('OptionVariationPopup Price Calculation', () => {
  test('calculates total for radio type (single variation)', () => {
    const option = {
      id: '1',
      name: 'Seat Color',
      price: 100,
      type: 'VARIABLE',
      variableType: 'radio',
      variations: [
        { id: 'v1', name: 'Red', price: 25 },
        { id: 'v2', name: 'Blue', price: 30 }
      ]
    };
    
    const selectedVariations = [{ id: 'v1', name: 'Red', price: 25 }];
    
    const { getByText } = render(
      <OptionVariationPopup 
        option={option} 
        selectedVariations={selectedVariations}
        isOpen={true}
      />
    );
    
    // Should show combined price: 100 + 25 = 125
    expect(getByText('$125.00')).toBeInTheDocument();
  });

  test('calculates total for checkbox type (multiple variations)', () => {
    const option = {
      id: '1',
      name: 'Safety Features',
      price: 200,
      type: 'VARIABLE',
      variableType: 'checkbox',
      variations: [
        { id: 'v1', name: 'Emergency Stop', price: 50 },
        { id: 'v2', name: 'LED Lights', price: 30 }
      ]
    };
    
    const selectedVariations = [
      { id: 'v1', name: 'Emergency Stop', price: 50 },
      { id: 'v2', name: 'LED Lights', price: 30 }
    ];
    
    const { getByText } = render(
      <OptionVariationPopup 
        option={option} 
        selectedVariations={selectedVariations}
        isOpen={true}
      />
    );
    
    // Should show combined price: 200 + 50 + 30 = 280
    expect(getByText('$280.00')).toBeInTheDocument();
  });

  test('updates price preview when variations selected', () => {
    const { rerender, getByText } = render(
      <OptionVariationPopup 
        option={option} 
        selectedVariations={[]}
      />
    );
    
    // Initially shows base price only
    expect(getByText('$100.00')).toBeInTheDocument();
    
    // Select a variation
    rerender(
      <OptionVariationPopup 
        option={option} 
        selectedVariations={[{ id: 'v1', name: 'Red', price: 25 }]}
      />
    );
    
    // Should now show combined price
    expect(getByText('$125.00')).toBeInTheDocument();
  });
});
```

