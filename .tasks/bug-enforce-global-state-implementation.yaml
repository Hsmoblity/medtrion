### Fixed Implementation
```typescript
const OptionVariationPopup = ({ option, categoryId, onClose }) => {
  // ✅ Use global store
  const { addOption, selectedOptions } = useConfiguratorStore();
  
  // ✅ Get current selections from global store
  const currentOption = selectedOptions[categoryId]?.find(
    opt => opt.databaseId === option.databaseId
  );
  const currentVariations = currentOption?.selectedVariations || [];
  
  // ✅ Local state ONLY for temporary preview before applying
  const [tempSelectedVariations, setTempSelectedVariations] = useState(currentVariations);
  
  // ✅ When user confirms, update global store
  const handleAddToConfiguration = () => {
    const optionWithVariations = {
      ...option,
      selectedVariations: tempSelectedVariations,
      totalPrice: calculateTotalPrice(option, tempSelectedVariations)
    };
    
    addOption(optionWithVariations, categoryId);
    onClose();
  };
};
```

## Step 5: Fix SummaryPanel

### Current Implementation Check
