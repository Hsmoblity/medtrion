## Level 3: Variations (Specific Customizations)

### Definition
Variations are the specific choices within each option product. They represent the actual customizable elements like colors, materials, features, or service levels.

### Characteristics
- **Type**: Individual variation records within VARIABLE products
- **Purpose**: Specific customization choices (e.g., "Red Leather", "Emergency Stop Button")
- **Attributes**: Rich attribute data (color, material, size, features)
- **Pricing**: Individual pricing that can modify base option price

### Data Structure
```typescript
interface Variation {
  id: string;
  databaseId: number;
  name: string; // "Red Leather Seat"
  price: number; // Price modifier (can be 0, positive, or negative)
  sku: string; // Unique SKU for inventory tracking
  image?: {
    sourceUrl: string;
    altText: string;
  };
  attributes: Array<{
    id: string;
    name: string; // "Color", "Material", "Size"
    value: string; // "Red", "Leather", "Large"
  }>;
  stockStatus?: "instock" | "outofstock" | "onbackorder";
  weight?: number;
  dimensions?: {
    length: number;
    width: number;
    height: number;
  };
}
```

### Variation Examples

#### Color Variations
```typescript
{
  name: "Red Leather Seat",
  price: 0, // No additional cost
  attributes: [
    { name: "Color", value: "Red" },
    { name: "Material", value: "Leather" }
  ],
  image: { sourceUrl: "red-leather-seat.jpg" }
},
{
  name: "Premium Black Leather",
  price: 50, // +$50 upgrade
  attributes: [
    { name: "Color", value: "Black" },
    { name: "Material", value: "Premium Leather" }
  ],
  image: { sourceUrl: "premium-black-seat.jpg" }
}
```

#### Feature Variations
```typescript
{
  name: "Emergency Stop Button",
  price: 99,
  attributes: [
    { name: "Feature", value: "Emergency Stop" },
    { name: "Type", value: "Wireless" }
  ],
  image: { sourceUrl: "emergency-stop-button.jpg" }
},
{
  name: "Safety Rails",
  price: 149,
  attributes: [
    { name: "Feature", value: "Safety Rails" },
    { name: "Material", value: "Stainless Steel" }
  ],
  image: { sourceUrl: "safety-rails.jpg" }
}
```

#### Service Variations
```typescript
{
  name: "Standard Installation",
  price: 299,
  attributes: [
    { name: "Service", value: "Installation" },
    { name: "Level", value: "Standard" },
    { name: "Duration", value: "4-6 hours" }
  ]
},
{
  name: "White-Glove Service",
  price: 799,
