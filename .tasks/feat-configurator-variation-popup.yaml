    selectedVariations: [],
    tempSelections: [],
    pricePreview: 0,
    isAlreadyInConfiguration: false
  });

  // State management logic
};
```

#### 2. **Price Calculation**
```typescript
const calculateOptionPrice = (
  basePrice: number,
  selectedVariations: Variation[]
): number => {
  const variationTotal = selectedVariations.reduce(
    (sum, variation) => sum + variation.price,
    0
  );
  return basePrice + variationTotal;
};
```

