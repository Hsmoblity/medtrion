## Expected Fix Implementation

### Fix 1: Add Price Calculation Logic
```typescript
// FIXED: Calculate combined price correctly
import { parsePrice, formatPrice } from '@/lib/utils/priceUtils';
import { useMemo, useCallback } from 'react';

const OptionVariationPopup: React.FC<OptionVariationPopupProps> = ({
  option,
  isOpen,
  selectedVariations,
  onClose,
  onAddToConfiguration,
  onCancel
}) => {
  // Parse parent option base price
  const baseOptionPrice = useMemo(() => {
    return parsePrice(option.price || option.regularPrice);
  }, [option.price, option.regularPrice]);

  // Calculate selected variations total
  const variationsTotal = useMemo(() => {
    return selectedVariations.reduce((sum, variation) => {
      const variationPrice = parsePrice(variation.price || variation.regularPrice);
      return sum + variationPrice;
    }, 0);
  }, [selectedVariations]);

  // Calculate combined total
  const totalPrice = useMemo(() => {
    // For radio type: Parent price + ONE selected variation price
    if (option.variableType === 'radio') {
      const selectedVariation = selectedVariations[0];
      if (selectedVariation) {
        const variationPrice = parsePrice(selectedVariation.price);
        return baseOptionPrice + variationPrice;
      }
      return baseOptionPrice;
    }
    
    // For checkbox type: Parent price + ALL selected variation prices
    if (option.variableType === 'checkbox') {
      return baseOptionPrice + variationsTotal;
    }
    
    // Default: Parent price only
    return baseOptionPrice;
  }, [baseOptionPrice, variationsTotal, selectedVariations, option.variableType]);

  // Format for display
  const displayTotal = formatPrice(totalPrice);

  return (
    <div className="option-variation-popup">
      <div className="popup-header">
        <h3>{option.name}</h3>
        <button onClick={onClose}>×</button>
      </div>
      
      <div className="popup-body">
        {/* Price Breakdown */}
        <div className="price-breakdown">
          <div className="price-item">
            <span className="label">Base Option Price:</span>
            <span className="value">{formatPrice(baseOptionPrice)}</span>
          </div>
          
          {selectedVariations.length > 0 && (
            <>
              <div className="price-divider">+</div>
              <div className="price-item">
                <span className="label">Selected Variations:</span>
                <span className="value">{formatPrice(variationsTotal)}</span>
              </div>
            </>
          )}
          
          <div className="price-divider total-divider">=</div>
          
          <div className="price-item price-total">
            <span className="label">Total Price:</span>
            <span className="value">{displayTotal}</span>
          </div>
        </div>
        
        {/* Variations Grid */}
        <div className="variations-grid">
          {option.variations?.map((variation) => (
            <OptionVariationCard
              key={variation.id}
              variation={variation}
              option={option}
              isSelected={isVariationSelected(variation.id)}
              selectionType={option.variableType === 'checkbox' ? 'checkbox' : 'radio'}
              onToggle={handleVariationToggle}
              showPrice={true}
            />
          ))}
        </div>
      </div>
      
      <div className="popup-footer">
        <div className="footer-total">
          <span className="total-label">Total:</span>
          <span className="total-value">{displayTotal}</span>
        </div>
        
        <div className="footer-actions">
          <button 
            className="btn-cancel" 
            onClick={onCancel}
          >
            Cancel
          </button>
          <button 
            className="btn-add" 
            onClick={() => handleAddWithCorrectPrice()}
            disabled={selectedVariations.length === 0 && option.type === 'VARIABLE'}
          >
            Add to Configuration
          </button>
        </div>
      </div>
    </div>
  );
};
```

### Fix 2: Update handleAddToConfiguration
```typescript
// FIXED: Add option with combined price
const handleAddWithCorrectPrice = useCallback(() => {
  // Create enhanced option object with combined price
  const optionWithTotalPrice = {
    ...option,
    selectedVariations,
    totalPrice: totalPrice, // ⭐ Combined price
    priceBreakdown: {
      basePrice: baseOptionPrice,
      variationsTotal: variationsTotal,
      combinedTotal: totalPrice
    }
  };

  // Log for debugging
  console.log('Adding option with combined price:', {
    optionId: option.id,
    optionName: option.name,
    basePrice: baseOptionPrice,
    variationsTotal: variationsTotal,
    totalPrice: totalPrice,
    selectedVariations: selectedVariations.map(v => ({
      id: v.id,
      name: v.name,
      price: parsePrice(v.price)
    }))
  });

  // Pass to parent with correct pricing
  onAddToConfiguration(optionWithTotalPrice, selectedVariations);
  
  // Close popup
  onClose();
}, [option, selectedVariations, totalPrice, baseOptionPrice, variationsTotal, onAddToConfiguration, onClose]);
```

### Fix 3: Update ConfiguratorStore to Use Combined Price
```typescript
// src/stores/configuratorStore.ts
addOption: (option, categoryId) => {
  // Log incoming option price structure
  console.log('Adding option to store:', {
    optionId: option.id,
    optionName: option.name,
    basePrice: option.price,
    totalPrice: option.totalPrice, // ⭐ Should include variations
    hasVariations: option.selectedVariations?.length > 0,
    selectedVariations: option.selectedVariations?.map(v => ({
      id: v.id,
      name: v.name,
      price: v.price
    }))
  });

  set((state) => {
    const newSelectedOptions = { ...state.selectedOptions };
    
    if (!newSelectedOptions[categoryId]) {
      newSelectedOptions[categoryId] = [];
    }
    
    // Add option with combined price
    if (category?.multiSelect) {
      const exists = newSelectedOptions[categoryId].some(
        opt => opt.databaseId === option.databaseId
      );
      if (!exists) {
        newSelectedOptions[categoryId].push(option);
      }
    } else {
      newSelectedOptions[categoryId] = [option];
    }
    
    return { selectedOptions: newSelectedOptions };
  });
  
  // Recalculate summary with correct prices
  get().calculateSummary();
  get().updateProgressCount();
},

calculateSummary: () => {
  set((state) => {
    const { model, selectedOptions } = state;
    
    const basePrice = parseFloat(model?.price?.toString() || '0');
    
    // ⭐ Use totalPrice if available (includes variations)
    const optionsTotal = Object.values(selectedOptions)
      .flat()
      .reduce((total, option) => {
        // Use combined price (base + variations) if available
        const optionPrice = option.totalPrice || parseFloat(option.price?.toString() || '0');
        
        console.log('Calculating option price:', {
          optionId: option.id,
          optionName: option.name,
          basePrice: parseFloat(option.price?.toString() || '0'),
          totalPrice: option.totalPrice,
          usedPrice: optionPrice
        });
        
        return total + optionPrice;
      }, 0);
    
    // Calculate final totals
    const installationCost = model?.installationRequired ? 300 : 0;
    const shippingCost = 50;
    const subtotal = basePrice + optionsTotal + installationCost + shippingCost;
    const taxAmount = subtotal * 0.08;
    const grandTotal = subtotal + taxAmount;
    
    const newSummary: ConfigurationSummary = {
      basePrice,
      optionsTotal,
      installationCost,
      shippingCost,
      taxAmount: Math.round(taxAmount * 100) / 100,
      grandTotal: Math.round(grandTotal * 100) / 100,
      estimatedDelivery: '2-3 weeks',
      financingOptions: calculateFinancingOptions(grandTotal),
      insuranceEstimate: calculateInsuranceEstimate(grandTotal)
    };
    
    return { summary: newSummary, previousSummary: state.summary };
  });
}
```

