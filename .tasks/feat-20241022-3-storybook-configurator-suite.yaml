id: FEAT-20241022-3
project: front-store
template: Feature
description: Build the Storybook library and placeholder pages that cover every UX/state described in PRD_HSM_MODEL_CONFIGURATOR.md.

tasks:
  - name: Storybook coverage for Model Configurator experience
    description: Implement components and stories for the base model hero, option browsing, pricing summary, compatibility alerts, and cart hand-off exactly as specified in the PRD.
    files:
      - src/components/configurator/ModelConfigurator.tsx
      - src/components/configurator/ModelHero.tsx
      - src/components/configurator/ConfiguratorSidebar.tsx
      - src/components/configurator/CategoryGroup.tsx
      - src/components/configurator/OptionCard.tsx
      - src/components/configurator/SummaryPanel.tsx
      - src/components/configurator/CompatibilityAlert.tsx
      - src/components/configurator/ConfigurationSummary.tsx
      - src/components/configurator/SaveConfigurationModal.tsx
      - src/pages/configurator/index.tsx
      - src/pages/configurator/[slug].tsx
      - src/stories/configurator/**/*.stories.tsx
      - src/components/storybook/storyHelpers.tsx
    steps:
      - Translate the PRD sections into component requirements:
        - Base model display (ModelHero) showing name, ADA features, image gallery, pricing, installation flags, financing badge.
        - Sidebar navigation for categories with required indicators, progress counts, and lazy-load affordances.
        - CategoryGroup accordion states (collapsed, loading options, populated list, required validation error).
        - OptionCard states (default, selected, disabled, recommended, compatibility warning/error, view-details modal state).
        - SummaryPanel with full price breakdown (base, options, installation, shipping, tax), financing table, insurance estimate banner, payment schedule card, tax disclosure.
        - CompatibilityAlert banners for required/conflicting/recommended rules with distinct severity visuals and actionable guidance.
        - ConfigurationSummary review screen with delivery estimate, selected options grouped by category, share/save actions.
        - SaveConfigurationModal capturing name/notes with validation.
        - Add-to-cart confirmation state (success, GraphQL error with retry messaging) and save/share flows.
      - Stub configurator data structures per PRD (ConfigurableProductSchema, ConfiguratorCategory, CompatibilityRule, FinancingOption, InsuranceEstimate) inside story helpers for reuse.
      - Create Storybook stories that exercise:
        - Happy path flow showing fully configured model with zero compatibility issues.
        - Required category missing selection (CategoryGroup + global alert).
        - Conflicting option selection with auto-resolve suggestion and recommended alternatives.
        - GraphQL loading/error states for model fetch, category option fetch, and add-to-cart mutation.
        - Financing scenario variations (multiple financing plans, no financing available, financing error state) and insurance coverage toggles.
        - Accessibility states (screen-reader announcements, high contrast mode knob, keyboard focus outlines) with documentation notes.
        - Mobile viewport snapshots (Storybook viewports) for OptionCard grids and SummaryPanel sticky behaviour.
      - Document GraphQL shapes (base model query, category options query, add-to-cart mutation) within Storybook MDX/controls so engineers know expected payloads.
      - Add docs/controls to stories explaining props, events (`configuration-change`, `option-toggle`, `add-to-cart`, `save-configuration`, `financing-change`, `insurance-check`).
      - Provide lightweight `/configurator` Next.js pages that mock GraphQL responses and render the composed configurator for end-to-end preview (SSR-safe, using static sample data and compatibility rules).
      - Capture PRD acceptance criteria in Storybook docs tabs (model loading, option management, price calculation, cart integration, accessibility, performance budgets) and note any open questions.
      - Outline unit/integration test ideas per component (OptionCard selection, compatibility enforcement, SummaryPanel calculations) so QA can align with PRD testing requirements.
    agents:
      - role: frontend-dev
        responsibilities:
          - Implement the configurator component hierarchy, ensuring responsiveness, Tailwind styles, and ARIA semantics match PRD guidelines.
          - Wire Storybook stories with realistic sample data, docs, and controls for QA/design review.
      - role: qa
        responsibilities:
          - Validate Storybook stories against PRD acceptance criteria (model loading, option management, price calculation, cart hand-off, accessibility).
          - Log discrepancies or missing states back into tracking.
    outputs:
      - Storybook catalog covering all configurator components, flows, and edge cases outlined in PRD_HSM_MODEL_CONFIGURATOR.md.
      - Sample `/configurator` pages demonstrating navigation into the configurator using the same data fixtures.

workflow:
  order: sequential
  dependencies: []

rules:
  - DRY, KISS
  - stable params/returns
  - no duplicate functions
  - no ghost code
  - no overlaping code
  - no unnecessary complexity
  - confirm if confuses requirements

checklist:
  - [ ] Code reviewed
  - [ ] Tests passed

tracking:
  document: ../.tracking/feat_tracking.md
  entry: "FEAT-20241022-3 | Storybook coverage for configurator PRD | new"
