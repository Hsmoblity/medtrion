# Problem Statement
## Issue Summary
Multiple components import and use global state stores (Zustand) but still maintain duplicate local state (useState) for the same data. This creates state synchronization issues, data inconsistencies, and violates the single source of truth principle. Components must either use global state OR local state, not both for the same data.

## Current Behavior
- Components import global store but also use local state for same data
- Duplicate state management creates synchronization issues
- State updates may not propagate correctly
- Data inconsistencies between local and global state
- Unclear which state is the "source of truth"
- Potential bugs from state conflicts
- Code is harder to maintain and debug

## Expected Behavior
- Components using global state should ONLY use global state
- No duplicate state between local and global for same data
- Clear separation: Global state for data, local state for UI only
- Single source of truth for all shared data
- State updates propagate consistently
- Predictable, maintainable code

## Impact Assessment
### Technical Impact
- **State Synchronization**: Critical bugs from conflicting state
- **Data Consistency**: Users see incorrect or stale data
- **Debugging Difficulty**: Hard to track which state is being used
- **Performance**: Duplicate state updates cause unnecessary re-renders
- **Code Quality**: Violates fundamental state management principles
- **Maintainability**: Code becomes increasingly difficult to maintain

### User Impact
- **Data Loss**: State sync issues may lose user selections
- **Incorrect Display**: Users see wrong data due to state conflicts
- **Broken Functionality**: State conflicts break features
- **Trust Issues**: Inconsistent data erodes user trust
- **Poor Experience**: Buggy behavior frustrates users

### Business Impact
- **Revenue Loss**: State bugs prevent sales
- **Support Burden**: State-related bugs increase support tickets
- **Development Velocity**: Inconsistent patterns slow development
- **Technical Debt**: Accumulates significant maintenance overhead
- **Quality Issues**: State bugs are hard to catch and fix

# Root Cause Analysis

## Identified Pattern Violations

### Pattern 1: ModelConfigurator - Duplicate Store Calls
**File**: `src/components/configurator/ModelConfigurator.tsx`
**Issue**: Calls `useConfiguratorStore()` twice (lines 109-117 and 119-126)

```typescript
// ❌ VIOLATION: Duplicate store calls
const {
  model,
  setModel,
  selectedOptions, // ✅ Use global store
  summary,
  calculateSummary,
  checkCompatibility: storeCheckCompatibility
} = useConfiguratorStore();

// ❌ DUPLICATE CALL - Same store called again
const {
  model,
  setModel,
  summary,
  calculateSummary,
  checkCompatibility: storeCheckCompatibility
} = useConfiguratorStore();
```

**Fix Required**:
```typescript
// ✅ CORRECT: Single store call
const {
  model,
  setModel,
  selectedOptions,
  summary,
  categories,
  compatibilityIssues,
  calculateSummary,
  checkCompatibility,
  addOption,
  removeOption
} = useConfiguratorStore();

// Remove all local state that duplicates store state
// Remove: const [categories, setCategories] = useState(...)
// Remove: const [compatibilityIssues, setCompatibilityIssues] = useState(...)
```

### Pattern 2: Components with Duplicate State
**Files to Audit**: All components using global stores

**Common Violations**:
```typescript
// ❌ VIOLATION: Duplicate state
const { items } = useCartStore(); // Global state
const [cartItems, setCartItems] = useState([]); // ❌ Local duplicate

// ❌ VIOLATION: Duplicate state
const { categories } = useConfiguratorStore(); // Global state
const [categories, setCategories] = useState([]); // ❌ Local duplicate

// ❌ VIOLATION: Duplicate state
const { selectedOptions } = useConfiguratorStore(); // Global state
const [selections, setSelections] = useState({}); // ❌ Local duplicate
```

**Fix Required**:
```typescript
// ✅ CORRECT: Use ONLY global state
const { items, addItem, removeItem } = useCartStore();
// Remove: const [cartItems, setCartItems] = useState([])

// ✅ CORRECT: Use ONLY global state
const { categories, setCategories } = useConfiguratorStore();
// Remove: const [categories, setCategories] = useState([])

// ✅ CORRECT: Use ONLY global state
const { selectedOptions, addOption, removeOption } = useConfiguratorStore();
// Remove: const [selections, setSelections] = useState({})
```

### Pattern 3: Components Not Using Global State When They Should
**Issue**: Components manage shared data in local state instead of global state

```typescript
// ❌ VIOLATION: Shared data in local state
const ProductCard = () => {
  const [product, setProduct] = useState(null); // Should use productStore
  const [isInCart, setIsInCart] = useState(false); // Should use cartStore
  
  // ... component logic
};
```

**Fix Required**:
```typescript
// ✅ CORRECT: Use global state for shared data
const ProductCard = () => {
  const { getProduct, cacheProduct } = useProductStore();
  const { isProductInCart } = useCartStore();
  
  // ✅ Local state only for UI
  const [isHovered, setIsHovered] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  
  // ... component logic
};
```

