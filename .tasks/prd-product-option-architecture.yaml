## User Experience Flow

### Configuration Process
1. **Select Base Model**: User chooses main product (e.g., "Acorn Stairlift 180")
2. **Browse Option Categories**: System displays available option categories
3. **Configure Options**: For each category:
   - User selects option product
   - If VARIABLE: User chooses variations (radio or checkbox)
   - If SIMPLE: Option is automatically selected
4. **Review Configuration**: System shows selected options and total price
5. **Add to Cart**: Configuration is converted to cart items

### UI Components
- **Product Selector**: Choose base model
- **Option Categories**: Organized by `optionType`
- **Option Cards**: Display option products with descriptions and pricing
- **Variation Selectors**: Radio buttons or checkboxes for variations
- **Configuration Summary**: Show selected options and running total
- **Price Calculator**: Real-time price updates

