## Fix Strategy

### Option 1: Add Button to OptionCard

```tsx
// src/components/configurator/OptionCard.tsx
interface OptionCardProps {
  option: ConfigurableOption;
  isSelected: boolean;
  onToggle: (optionId: string) => void;
}

export const OptionCard: React.FC<OptionCardProps> = ({ 
  option, 
  isSelected, 
  onToggle 
}) => {
  return (
    <div className={`option-card ${isSelected ? 'selected' : ''}`}>
      <div className="option-info">
        <h3>{option.name}</h3>
        <p>{option.description}</p>
        <p className="price">${option.price}</p>
      </div>
      
      {/* ⚠️ ADD THIS CONTROL */}
      <button
        onClick={() => onToggle(option.id)}
        className={`btn-toggle ${isSelected ? 'btn-remove' : 'btn-add'}`}
        aria-pressed={isSelected}
      >
        {isSelected ? (
          <>
            <CheckIcon /> Remove from Configuration
          </>
        ) : (
          <>
            <PlusIcon /> Add to Configuration
          </>
        )}
      </button>
    </div>
  );
};
```

### Option 2: Wire Up Parent Component

```tsx
// src/components/ProductOptions.tsx or OptionsClientWrapper.tsx
const [selectedOptionIds, setSelectedOptionIds] = useState<string[]>([]);

const handleToggleOption = useCallback((optionId: string) => {
  setSelectedOptionIds(prev => {
    const isSelected = prev.includes(optionId);
    const newSelection = isSelected
      ? prev.filter(id => id !== optionId)
      : [...prev, optionId];
    
    // Trigger price recalculation
    onSelectionChange?.(newSelection);
    
    return newSelection;
  });
}, [onSelectionChange]);

// Pass to OptionCard
<OptionCard
  option={option}
  isSelected={selectedOptionIds.includes(option.id)}
  onToggle={handleToggleOption}
/>
```

### Option 3: Update Configuration Summary

```tsx
// src/components/SummaryPanel.tsx
const calculateTotal = useMemo(() => {
  const basePrice = product.price;
  const optionsTotal = selectedOptions.reduce(
    (sum, optionId) => {
      const option = allOptions.find(o => o.id === optionId);
      return sum + (option?.price || 0);
    },
    0
  );
  return basePrice + optionsTotal;
}, [product.price, selectedOptions, allOptions]);

return (
  <div className="summary-panel">
    <h3>Configuration Summary</h3>
    <div className="base-price">
      Base: ${product.price}
    </div>
    <div className="selected-options">
      <h4>Selected Options:</h4>
      {selectedOptions.map(optionId => {
        const option = allOptions.find(o => o.id === optionId);
        return (
          <div key={optionId} className="option-line">
            <span>{option?.name}</span>
            <span>${option?.price}</span>
          </div>
        );
      })}
    </div>
    <div className="total-price">
      <strong>Total: ${calculateTotal}</strong>
    </div>
  </div>
);
```

