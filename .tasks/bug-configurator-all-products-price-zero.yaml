### Fix 6: Add Comprehensive Price Validation Utility
```typescript
// FIXED: Comprehensive price validation and formatting utilities
export const validatePrice = (price: any): number => {
  // Handle null, undefined, or empty string
  if (price === null || price === undefined || price === '') {
    console.warn('Price is null/undefined/empty, defaulting to 0');
    return 0;
  }
  
  // Handle numeric values
  if (typeof price === 'number') {
    if (isNaN(price) || !isFinite(price)) {
      console.warn('Price is NaN or Infinity, defaulting to 0');
      return 0;
    }
    return price;
  }
  
  // Handle string values
  if (typeof price === 'string') {
    // Remove currency symbols and whitespace
    const cleanPrice = price.replace(/[$,\s]/g, '');
    const parsed = parseFloat(cleanPrice);
    
    if (isNaN(parsed) || !isFinite(parsed)) {
      console.warn(`Failed to parse price string: "${price}", defaulting to 0`);
      return 0;
    }
    
    return parsed;
  }
  
  console.warn(`Unexpected price type: ${typeof price}, defaulting to 0`);
  return 0;
};

export const formatPrice = (price: any): string => {
  const validPrice = validatePrice(price);
  return `$${validPrice.toFixed(2)}`;
};

export const formatPriceRange = (minPrice: any, maxPrice: any): string => {
  const min = validatePrice(minPrice);
  const max = validatePrice(maxPrice);
  
  if (min === max) {
    return formatPrice(min);
  }
  
  return `${formatPrice(min)} - ${formatPrice(max)}`;
};
```

