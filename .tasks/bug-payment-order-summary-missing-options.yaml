# Testing Requirements

## Unit Tests
```typescript
describe('OrderSummaryPanel', () => {
  test('displays main product', () => {
    const item = { product: { name: 'Test Product' }, configuration: null };
    render(<OrderSummaryPanel items={[item]} />);
    expect(screen.getByText('Test Product')).toBeInTheDocument();
  });

  test('displays configured option items', () => {
    const item = {
      product: { name: 'Main Product' },
      configuration: {
        options: [
          { name: 'Option 1', price: 50 },
          { name: 'Option 2', price: 75 }
        ]
      }
    };
    
    render(<OrderSummaryPanel items={[item]} />);
    
    expect(screen.getByText('Main Product')).toBeInTheDocument();
    expect(screen.getByText('Option 1')).toBeInTheDocument();
    expect(screen.getByText('Option 2')).toBeInTheDocument();
    expect(screen.getByText('+$50.00')).toBeInTheDocument();
    expect(screen.getByText('+$75.00')).toBeInTheDocument();
  });

  test('displays variation details for options', () => {
    const item = {
      product: { name: 'Main Product' },
      configuration: {
        options: [{
          name: 'Seat Color',
          selectedVariations: [
            { name: 'Red Leather', attributes: [{ name: 'Color', value: 'Red' }] }
          ]
        }]
      }
    };
    
    render(<OrderSummaryPanel items={[item]} />);
    
    expect(screen.getByText(/Red Leather/)).toBeInTheDocument();
    expect(screen.getByText(/Color: Red/)).toBeInTheDocument();
  });
});
```

