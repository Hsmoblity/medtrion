# Testing Requirements

## Unit Tests
```typescript
describe('ImagePlaceholder', () => {
  test('renders SVG icon for option type', () => {
    render(<ImagePlaceholder type="option" />);
    expect(screen.getByRole('img')).toBeInTheDocument();
  });

  test('applies correct size classes', () => {
    const { container } = render(<ImagePlaceholder size="large" />);
    expect(container.firstChild).toHaveClass('w-48', 'h-48');
  });

  test('supports dark mode', () => {
    const { container } = render(<ImagePlaceholder />);
    expect(container.firstChild).toHaveClass('dark:bg-gray-800');
  });
});

describe('OptionImage', () => {
  test('shows placeholder when no src provided', () => {
    render(<OptionImage src={null} alt="Test" />);
    expect(screen.getByRole('img')).toBeInTheDocument();
  });

  test('loads actual image when src provided', () => {
    render(<OptionImage src="/test-image.jpg" alt="Test" />);
    expect(screen.getByAltText('Test')).toBeInTheDocument();
  });

  test('shows placeholder on image error', async () => {
    render(<OptionImage src="/broken-image.jpg" alt="Test" />);
    const img = screen.getByAltText('Test');
    fireEvent.error(img);
    await waitFor(() => {
      expect(screen.getByRole('img')).toBeInTheDocument();
    });
  });
});
```

