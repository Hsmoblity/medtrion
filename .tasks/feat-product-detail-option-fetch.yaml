feature:
  title: Hydrate product detail options from WooCommerce related IDs
  area: frontend
  priority: p0
  status: completed
  requested_by: techlead
  environment: production
  completed_date: 2025-09-28
  implemented_by: frontend-team

summary:
  goal: When loading `/product/[slug]`, fetch option products referenced by the main product’s `_related_options` so the configurator panel displays real data; fall back gracefully when none available.
  scope:
    - Extend product detail `getServerSideProps` to call `fetchProductsByDatabaseIds` (or new single-option query) when `_related_options` is present.
    - Provide fail-safe UI for the configuration sidebar if no option data returns (hide panel or show informative message).
    - Ensure page renders without blocking even when WooCommerce data for options is missing.
  impact: Enables real configuration data and prevents UI breakage when backend doesn’t supply options.

acceptance_criteria:
  - Product detail SSR fetches option products for any `_related_options` and attaches them to the page props (`_related_options_products`).
  - Configuration sidebar and category group components handle empty/undefined data gracefully with user-facing messaging.
  - Page never throws “Product not found” solely because options fail to load; only base product failure should block render.
  - Automated test covers scenario with option IDs present (data rendered) and absent (fail-safe state).

implementation_plan:
  - Update `src/pages/product/[slug]/index.tsx` SSR logic to collect `_related_options`, call WooCommerce helper, and merge results.
  - Adjust configurator components to consume either the new field or explicit prop and render fallback UI when array empty.
  - Add logging/monitoring for cases where option fetch fails, but continue render.
  - Write tests to cover both successful hydration and fallback path.

risks:
  - Large option sets could impact SSR time; consider caching or limiting fetch size.
  - Need backend to guarantee `_related_options` accuracy; coordinate if missing.

stakeholders:
  - Frontend team
  - Backend/WooCommerce team
  - QA
