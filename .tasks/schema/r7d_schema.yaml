id: R7D-XXX
project: <project-name>
template: Research & Design
description: <research context and purpose>

charter: ../project_charter.yaml

plan:
  - define research questions
  - identify experiments
  - collect references
  - evaluate options

context:
  before: |
    <describe current knowledge gap, e.g. "Unclear which cache strategy best suits API">
  after: |
    <describe desired knowledge, e.g. "Decision made between Redis and in-memory cache">
  inputs:
    - <input, e.g. "API response patterns">
  expected_outputs:
    - <output, e.g. "performance metrics and recommendation">

research_questions:
  - <question-1>
  - <question-2>

tasks:
  - name: <research-task>
    description: <task detail>
    files:
      - <file-if-any>
    steps:
      - <step-1>
      - <step-2>

test_stage:
  - design small experiment or prototype
  - run controlled test
  - analyze outcomes

outputs:
  - <expected outcome, doc, or prototype>

references:
  - <link-or-doc>

conditions:
  - avoid scope creep
  - provide evidence-backed findings

tool_permissions:
  - file_read
  - file_write
  - prototype_runner
  - doc_generator

agents:
  - researcher
  - code-reviewer

workflow:
  order: sequential
  dependencies:
    - "Do research" → researcher
    - "Review findings" → code-reviewer

headless_allowed: false

checklist:
  - [ ] Research notes complete
  - [ ] Prototype tested
  - [ ] Findings reviewed
  - [ ] Decision recorded

tracking:
  document: ../.tracking/r7d_tracking.md
  entry: "R7D-XXX | <research-title> | <status>"
