## Responsive Breakpoints

### Desktop (lg: 1024px+)
- Two-column layout: 2/3 forms + 1/3 summary
- Order summary sticky on scroll
- All fields visible
- Optimal for form completion

### Tablet (md: 768px - 1023px)
- Two-column layout maintained
- Smaller gaps between panels
- Optimized for tablet viewing

### Mobile (< 768px)
- Single-column layout
- Order summary at top
- Edit cart button at bottom
- Touch-optimized input sizes

# Accessibility Requirements

## ARIA Labels and Roles
```tsx
// Form fields
<input
  aria-label="First name"
  aria-required="true"
  aria-invalid={!!errors.firstName}
  aria-describedby={errors.firstName ? 'firstName-error' : undefined}
/>

// Error messages
<p id="firstName-error" role="alert" className="error-message">
  {errors.firstName.message}
</p>

// Buttons
<button aria-label="Edit shopping cart">
  Edit Cart
</button>
```

## Keyboard Navigation
- Tab order follows logical flow
- Focus indicators clearly visible
- Enter key submits form
- Escape key closes modals
- All interactive elements keyboard accessible

## Screen Reader Support
- Semantic HTML elements
- Clear labels for all inputs
- Error announcements
- Loading state announcements
- Success/failure feedback

## Color Contrast
- WCAG AA compliant: minimum 4.5:1 for text
- WCAG AAA target: 7:1 for important text
- Error states: high contrast red
- Success states: high contrast green

# Form Validation

## Real-time Validation
```typescript
// Validation rules
const validationRules = {
  firstName: {
    required: 'First name is required',
    minLength: { value: 2, message: 'Minimum 2 characters' },
    pattern: { value: /^[a-zA-Z\s-]+$/, message: 'Only letters, spaces, and hyphens' }
  },
  email: {
    required: 'Email is required',
    pattern: { 
      value: /^[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}$/i, 
      message: 'Invalid email address' 
    }
  },
  phone: {
    required: 'Phone number is required',
    pattern: { 
      value: /^[\d\s\-\+\(\)]+$/, 
      message: 'Invalid phone format' 
    }
  },
  zipCode: {
    required: 'ZIP code is required',
    pattern: { 
      value: /^\d{5}(-\d{4})?$/, 
      message: 'Invalid ZIP code format' 
    }
  }
};
```

## Error Handling
- Inline error messages below fields
- Red border on invalid fields
- Error icon next to field
- Helpful error text explaining how to fix
- Form submission disabled until valid

