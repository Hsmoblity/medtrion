## Step 2: Determine Consolidation Strategy

### Strategy A: Complete Consolidation (If Identical)
```typescript
// RECOMMENDED: Single function with clear name
export const fetchProductsByIds = async (
  ids: number[],
  options?: {
    includeVariations?: boolean;
    includeRelatedOptions?: boolean;
    type?: 'product' | 'option' | 'configurable';
  }
): Promise<ProductSchema[]> => {
  // Unified implementation
  const query = options?.includeVariations 
    ? GET_PRODUCTS_WITH_VARIATIONS_BY_IDS 
    : GET_PRODUCTS_BY_IDS;
  
  const response = await fetchGraphQL(query, { ids });
  
  // Unified data mapping
  return response.data.products.nodes.map(mapWooToProductSchema);
};

// Create type-specific convenience functions
export const fetchOptionProductsByIds = async (
  ids: number[]
): Promise<ConfigurableProductSchema[]> => {
  return fetchProductsByIds(ids, {
    includeVariations: true,
    includeRelatedOptions: true,
    type: 'option'
  }) as Promise<ConfigurableProductSchema[]>;
};

export const fetchRelatedProductsByIds = async (
  ids: number[]
): Promise<ProductSchema[]> => {
  return fetchProductsByIds(ids, {
    includeRelatedOptions: true,
    type: 'product'
  });
};
```

### Strategy B: Extract Shared Logic (If Similar)
```typescript
// RECOMMENDED: Extract common logic
const fetchProductsCore = async (
  ids: number[],
  query: string,
  mapFunction: (data: any) => any
) => {
  const response = await fetchGraphQL(query, { ids });
  if (!response.data?.products?.nodes) {
    return [];
  }
  return response.data.products.nodes.map(mapFunction);
};

// Specific implementations using core
export const fetchRelatedProductsByIds = async (
  ids: number[]
): Promise<ProductSchema[]> => {
  return fetchProductsCore(
    ids,
    GET_PRODUCTS_BY_IDS,
    mapWooToProductSchema
  );
};

export const fetchOptionProductsByIds = async (
  ids: number[]
): Promise<ConfigurableProductSchema[]> => {
  return fetchProductsCore(
    ids,
    GET_OPTION_PRODUCTS_BY_IDS,
    mapWooToConfigurableProductSchema
  );
};
```

