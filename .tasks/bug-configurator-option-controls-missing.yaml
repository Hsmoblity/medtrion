### Automated Testing

```typescript
// OptionCard.test.tsx
describe('OptionCard', () => {
  it('should display add button when option is not selected', () => {
    render(
      <OptionCard 
        option={mockOption} 
        isSelected={false} 
        onToggle={mockToggle} 
      />
    );
    
    expect(screen.getByText(/Add to Configuration/i)).toBeInTheDocument();
  });
  
  it('should call onToggle when button is clicked', () => {
    const handleToggle = jest.fn();
    render(
      <OptionCard 
        option={mockOption} 
        isSelected={false} 
        onToggle={handleToggle} 
      />
    );
    
    fireEvent.click(screen.getByRole('button'));
    expect(handleToggle).toHaveBeenCalledWith(mockOption.id);
  });
  
  it('should display remove button when option is selected', () => {
    render(
      <OptionCard 
        option={mockOption} 
        isSelected={true} 
        onToggle={mockToggle} 
      />
    );
    
    expect(screen.getByText(/Remove from Configuration/i)).toBeInTheDocument();
  });
});

// Integration test
describe('Configurator Integration', () => {
  it('should update summary when option is selected', async () => {
    render(<ConfiguratorPage product={mockProduct} />);
    
    const initialTotal = screen.getByText(/Total: \$1000/i);
    expect(initialTotal).toBeInTheDocument();
    
    const addButton = screen.getByText(/Add to Configuration/i);
    fireEvent.click(addButton);
    
    await waitFor(() => {
      expect(screen.getByText(/Total: \$1250/i)).toBeInTheDocument();
    });
  });
});
```

