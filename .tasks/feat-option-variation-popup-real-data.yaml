### Data Validation and Mapping
```typescript
// Validate and map real variation data
const validateAndMapVariations = (option: OptionProduct): Variation[] => {
  if (!option.variations || !Array.isArray(option.variations)) {
    console.warn('OptionVariationPopup: No variations data found for option:', option.id);
    return [];
  }

  return option.variations.map((variation: any) => {
    // Validate required fields
    if (!variation.id || !variation.databaseId) {
      console.error('Invalid variation data:', variation);
      return null;
    }

    return {
      id: variation.id,
      databaseId: variation.databaseId,
      name: variation.name || 'Unnamed Variation',
      price: parseFloat(variation.price || '0'),
      sku: variation.sku || '',
      image: variation.image ? {
        sourceUrl: variation.image.sourceUrl || '',
        altText: variation.image.altText || variation.name || 'Variation image'
      } : undefined,
      attributes: variation.attributes || [],
      stockStatus: determineStockStatus(variation)
    };
  }).filter(Boolean); // Remove null entries
};
```

## WooCommerce Data Integration

### GraphQL Query Enhancement
```typescript
// Ensure variations are properly fetched in option product queries
export const GET_OPTION_PRODUCTS_BY_IDS = gql`
  query GetOptionProductsByIds($ids: [Int]) {
    products(where: { include: $ids, typeIn: [VARIABLE] }) {
      nodes {
        id
        databaseId
        name
        type
        variableType  # ← Important for selection behavior
        
        # Enhanced variation data
        variations(first: 50) {
          nodes {
            id
            databaseId
            name
            price
            regularPrice
            salePrice
            sku
            stockStatus  # ← Real stock status
            image { 
              sourceUrl 
              altText 
            }
            attributes { 
              nodes { 
                id 
                name 
                value 
              } 
            }
          }
        }
      }
    }
  }
`;
```

