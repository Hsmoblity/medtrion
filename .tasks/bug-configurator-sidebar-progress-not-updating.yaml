### Automated Testing

```typescript
// ConfiguratorSidebar.test.tsx
describe('ConfiguratorSidebar Progress Bar', () => {
  it('should display 0 options selected initially', () => {
    render(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{}}
      />
    );
    
    expect(screen.getByText(/0 options selected/i)).toBeInTheDocument();
  });
  
  it('should update when options are selected', () => {
    const { rerender } = render(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{}}
      />
    );
    
    expect(screen.getByText(/0 options selected/i)).toBeInTheDocument();
    
    // Simulate option selection
    rerender(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{ warranty: [mockOption1] }}
      />
    );
    
    expect(screen.getByText(/1 option selected/i)).toBeInTheDocument();
  });
  
  it('should update when options are deselected', () => {
    const { rerender } = render(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{ warranty: [mockOption1, mockOption2] }}
      />
    );
    
    expect(screen.getByText(/2 options selected/i)).toBeInTheDocument();
    
    rerender(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{ warranty: [mockOption1] }}
      />
    );
    
    expect(screen.getByText(/1 option selected/i)).toBeInTheDocument();
  });
  
  it('should calculate total across multiple categories', () => {
    render(
      <ConfiguratorSidebar 
        categories={mockCategories}
        selectedOptions={{
          warranty: [mockOption1],
          delivery: [mockOption2, mockOption3]
        }}
      />
    );
    
    expect(screen.getByText(/3 options selected/i)).toBeInTheDocument();
  });
});
```

