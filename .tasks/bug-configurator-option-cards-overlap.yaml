### Automated Testing

```typescript
// E2E Test - Option Cards Layout
describe('Configurator Option Cards Layout', () => {
  it('should display cards without overlap', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Navigate to a category with many options
    cy.get('.configuration-category-item').contains('Warranty').click();
    
    // Wait for options to load
    cy.get('.option-cards-grid').should('be.visible');
    
    // Check that cards don't overlap
    cy.get('.option-card').each(($card) => {
      cy.wrap($card).should('be.visible');
      cy.wrap($card).should('not.have.css', 'position', 'absolute');
    });
    
    // Verify grid layout
    cy.get('.option-cards-grid').should('have.css', 'display', 'grid');
  });
  
  it('should be responsive on different screen sizes', () => {
    // Test mobile - should be 1 column
    cy.viewport(375, 667);
    cy.visit('/product/acorn-stairlift/configure');
    cy.get('.option-cards-grid').should('have.css', 'grid-template-columns', '1fr');
    
    // Test tablet - should be 2 columns
    cy.viewport(768, 1024);
    cy.reload();
    cy.get('.option-cards-grid').should('have.css', 'grid-template-columns', '1fr 1fr');
    
    // Test desktop - should be 2 columns
    cy.viewport(1280, 720);
    cy.reload();
    cy.get('.option-cards-grid').should('have.css', 'grid-template-columns', '1fr 1fr');
  });
  
  it('should handle many options gracefully with 2-column layout', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Navigate to category with many options
    cy.get('.configuration-category-item').contains('Warranty').click();
    
    // Check that all options are accessible
    cy.get('.option-card').should('have.length.greaterThan', 3);
    cy.get('.option-cards-grid').should('have.css', 'grid-template-columns', '1fr 1fr');
    
    // Verify cards don't overlap and maintain dimensions
    cy.get('.option-card').each(($card, index) => {
      cy.wrap($card).should('be.visible');
      cy.wrap($card).should('not.be.covered');
      cy.wrap($card).should('have.css', 'width');
      cy.wrap($card).should('have.css', 'height');
    });
    
    // Test specific layout: 4 options = 2 columns × 2 rows
    cy.get('.option-card').should('have.length', 4);
    cy.get('.option-cards-grid').should('have.css', 'grid-template-rows');
  });
});
```

