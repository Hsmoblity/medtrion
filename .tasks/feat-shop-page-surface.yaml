feature:
  title: Launch curated shop page
  area: frontend
  priority: p1
  status: new
  requested_by: techlead
  environment: production

summary:
  goal: Deliver a `/products` landing page that showcases five polished product cards backed by normalized data.
  scope:
    - Create Next.js page (`src/pages/products/index.tsx`) powered by existing `getProducts` helper.
    - Render curated set of five spotlight products using `ProductHeroCard` with final design tokens.
    - Coordinate QA enablement once sale-price serialization bugfix ships.
  impact: Eliminates dead CTA link, highlights key inventory, and ensures data resilience.

acceptance_criteria:
  - `/products` route responds with SSR content that fetches products via `getProducts`, applies sanitization (no `undefined` in payload), and returns 200 in CI smoke tests.
  - Page displays exactly five curated products with polished `ProductHeroCard` styling approved by design.
  - Links and CTAs on the new page route correctly (detail view, configure, cart) and pass Playwright navigation checks.
  - QA sign-off captured after data-normalization bug fix deploy; ticket references QA checklist run.

implementation_plan:
  - Scaffold page component with `getServerSideProps`, reusing homepage sanitization helper to strip `undefined`.
  - Build curated product selection logic (static list, CMS flag, or config); ensure deterministic five-item array.
  - Compose layout using existing `ProductHeroCard` grid, layer in special polish tokens (badges, spacing, copy) per design direction.
  - Add automated tests (unit for selector, integration for page rendering, e2e for nav flow); update sitemap/nav docs.
  - Coordinate QA activation post data-normalization bug fix; document results in `/docs/qa/shop-page.md`.

risks:
  - CMS data may still lack required fields; depends on normalization feature.
  - Additional polish tokens may require new assets or design sign-off.
  - Duplicate product fetches could impact performance; consider caching once stabilized.

stakeholders:
  - Frontend team
  - Design/UX
  - QA
  - Product

notes:
  - Sync with marketing on which five products to spotlight before launch.
