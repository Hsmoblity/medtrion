## Expected Behavior
```typescript
// Correct Implementation
const handleEditConfig = async (cartItem: CartItem) => {
  try {
    // Show loading state
    setLoading(true);
    
    // Fetch complete product data with options
    const productWithOptions = await fetchProductWithOptions(cartItem.product.id);
    
    // Load option categories
    const categories = await fetchOptionCategories(productWithOptions.relatedOptions);
    
    // Initialize configuration state
    const configurationState = {
      selectedProduct: productWithOptions,
      selectedOptions: cartItem.configuration || [],
      categories,
      loading: false
    };
    
    // Navigate to configurator with complete data
    navigate('/configurator', {
      state: {
        product: productWithOptions,
        currentConfig: cartItem.configuration,
        categories,
        configurationState
      }
    });
  } catch (error) {
    console.error('Failed to load product options:', error);
    // Show error message to user
  } finally {
    setLoading(false);
  }
};

const fetchProductWithOptions = async (productId: string) => {
  // Fetch product with related options
  const product = await fetchProduct(productId);
  
  // Fetch option products
  const optionProducts = await fetchOptionProductsByIds(product.relatedOptions);
  
  return {
    ...product,
    options: optionProducts
  };
};

const fetchOptionCategories = async (optionIds: number[]) => {
  // Group options by category
  const categories = await fetchCategoriesWithOptions(optionIds);
  
  return categories.map(category => ({
    ...category,
    options: category.options || []
  }));
};
```

