### Automated Testing

```typescript
// E2E Test - Class verification
describe('Configurator Semantic Classes', () => {
  it('should have semantic layout classes', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Verify main sections
    cy.get('.configurator-layout').should('exist');
    cy.get('.configurator-sidebar').should('exist');
    cy.get('.configurator-content').should('exist');
    cy.get('.configurator-summary').should('exist');
  });
  
  it('should have position identifiers', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    cy.get('.configurator-section-left').should('exist');
    cy.get('.configurator-section-center').should('exist');
    cy.get('.configurator-section-right').should('exist');
  });
  
  it('should have content-specific classes', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Left sidebar
    cy.get('.configuration-options-container').should('exist');
    cy.get('.configuration-categories-nav').should('exist');
    
    // Center content
    cy.get('.option-cards-container').should('exist');
    cy.get('.option-cards-grid').should('exist');
    
    // Right panel
    cy.get('.configuration-summary-container').should('exist');
    cy.get('.selected-options-list').should('exist');
    cy.get('.configuration-total-price').should('exist');
  });
  
  it('should apply state modifiers correctly', () => {
    cy.visit('/product/acorn-stairlift/configure');
    
    // Click a category
    cy.get('.configuration-category-item').first().click();
    cy.get('.configuration-category-active').should('exist');
    
    // Select an option
    cy.get('.option-card').first().click();
    cy.get('.option-card-selected').should('exist');
  });
});
```

