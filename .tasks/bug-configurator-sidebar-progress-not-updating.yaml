## Acceptance Criteria

- [ ] Progress bar displays initial selection count correctly (0 on first load)
- [ ] Progress bar updates immediately when an option is selected
- [ ] Progress bar updates immediately when an option is deselected
- [ ] Count is accurate - matches actual number of selected options
- [ ] Progress bar visual indicator (percentage/bar fill) updates correctly
- [ ] Per-category counts update in sidebar navigation
- [ ] Updates happen without page refresh
- [ ] No visible lag or delay in updates (< 100ms)
- [ ] Updates work across all configuration categories
- [ ] Updates persist when navigating between categories
- [ ] Progress bar shows total selected across all categories
- [ ] No console errors during selection/deselection

