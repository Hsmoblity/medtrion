    { name: "Service", value: "Installation" },
    { name: "Level", value: "White-Glove" },
    { name: "Duration", value: "Full Day" }
  ]
}
```

### Business Rules
1. **Unique Attributes**: Each variation has distinct attribute combinations
2. **Pricing Flexibility**: Variations can add, subtract, or maintain base option price
3. **Inventory Tracking**: Each variation has its own SKU and stock status
4. **Visual Representation**: Variations can have their own images
5. **Compatibility**: Variations may have compatibility rules with other selections

