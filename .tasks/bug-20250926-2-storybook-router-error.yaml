id: BUG-20250926-2
project: front-store
template: Bug Fix
description: "The showcase pages in Storybook are failing with the error 'invariant expected app router to be mounted'."

tasks:
  - name: "Fix Storybook router context"
    description: "The showcase pages in Storybook are failing because the components on these pages use Next.js router hooks, and the router context is not available in the Storybook environment."
    files:
      - ".storybook/main.js"
      - ".storybook/preview.js"
      - "src/stories/pages/Homepage.stories.tsx"
      - "src/stories/pages/ProductPage.stories.tsx"
      - "src/stories/pages/CartPage.stories.tsx"
    steps:
      - "Install the `storybook-addon-next-router` addon."
      - "Configure the addon in `.storybook/main.js` and `.storybook/preview.js` to provide a mock router context to all stories."
      - "Verify that the showcase pages render correctly in Storybook without the router error."
    conditions:
      - follow DRY, KISS
      - no duplicate functions
      - no ghost code
      - no overlaping code
      - confirm if the bug confused
      - no unnecessary complexity

checklist:
  - [ ] Bug reproducible
  - [ ] Fix applied
  - [ ] Tests passed

tracking:
  document: "../.tracking/bug_tracking.md"
  entry: "BUG-20250926-2 | all showcase > pages error invariant expected app router to be mounted | new"