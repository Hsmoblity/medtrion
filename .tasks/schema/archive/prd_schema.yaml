id: PRD-XXX
project: <project-name>
template: Product Requirement
version: <major.minor>
date: <YYYY-MM-DD>
status: <Draft|In Review|Approved|Deprecated>
owners:
  product: <name>
  design: <name>
  engineering: <name>
  analytics: <name>

executive_summary: |
  <1–2 paragraph overview covering business objective, target users, and success criteria.>

background:
  problem_statement: |
    <Describe the current pain points with evidence (metrics, user quotes).>
  market_landscape:
    competitors:
      - <Competitor insight>
    differentiators:
      - <Why this initiative is unique>
  assumptions:
    - <Assumption that must be validated>
  initiative_overlap:
    related_initiatives:
      - id: <initiative id or link>
        summary: <scope>
        status: <discovery|delivery|launched>
    differentiation: |
      <Explain how this PRD differs or extends the related items and capture dedupe scan evidence.>
    alignment_contacted: <yes|no>

objectives_and_kpis:
  goals:
    - id: <G1>
      description: <Business or user outcome>
      metric: <Metric name>
      target: <Numeric or qualitative target>
  non_goals:
    - <Explicitly state what this initiative will not do>

user_personas:
  - name: <Persona>
    primary_needs:
      - <Need>
    frustrations:
      - <Pain point>

use_cases:
  primary:
    - id: <UC1>
      title: <Scenario>
      narrative: |
        <Step-by-step story from user perspective>
      success_metrics:
        - <What success looks like>
  edge_cases:
    - <Edge scenario requiring handling>

functional_requirements:
  - id: <FR1>
    description: <Requirement statement>
    priority: <Must|Should|Could>
    acceptance_tests:
      - <How to verify>
    supporting_flows:
      - <Link to journey or diagram>

non_functional_requirements:
  performance:
    - metric: <page load, interaction latency>
      threshold: <value>
  accessibility:
    - <WCAG target, screen reader requirement>
  localization:
    - <Languages/support expectations>
  reliability:
    - <Availability, error budget>
  compliance:
    - <HIPAA, PCI, GDPR, etc. implication>

information_architecture:
  data_entities:
    - name: <Entity/interface>
      description: <How it is used>
      fields:
        - <field>: <type> — <validation>
  content_requirements:
    - <Copy tone, enums, glossary>

system_interactions:
  upstream_integrations:
    - service: <API or system>
      contract: <request/response summary>
      owner: <team>
  downstream_events:
    - event: <Name>
      payload: <Schema>
      consumer: <Team>
  feature_flags:
    - name: <flag>
      rollout_strategy: <phased|regional|AB test>

analytics_requirements:
  tracking_plan:
    - event: <name>
      trigger: <interaction>
      properties:
        - <prop>: <description>
      source_of_truth: <Amplitude, GA, Snowflake>
  dashboards:
    - <Dashboard link or query>

release_plan:
  milestones:
    - name: <Alpha/Beta/GA>
      date: <YYYY-MM-DD>
      entry_criteria:
        - <Requirement to enter phase>
      exit_criteria:
        - <Requirement to exit phase>
  communications:
    internal:
      - <Channel and cadence>
    external:
      - <Customer comms, release notes, blog>
  rollout_risks:
    - description: <risk>
      mitigation: <plan>

success_validation:
  experiment_plan:
    - type: <A/B test, staged rollout>
      guardrail_metrics:
        - <Metric and threshold>
      primary_metrics:
        - <Metric and target>
  post_launch_review:
    schedule: <YYYY-MM-DD>
    owner: <name>
    required_artifacts:
      - <Dashboard, retro doc, support summary>

open_questions:
  - <Pending decision or clarification>

appendix:
  glossary:
    - term: <term>
      definition: <definition>
  references:
    - <Link to additional documents>

checklist:
  - [ ] Requirements reviewed by design, engineering, analytics, and QA
  - [ ] Acceptance tests defined for each functional requirement
  - [ ] Analytics plan reviewed and approved
  - [ ] Legal/compliance review (if required)
  - [ ] Risk mitigation and rollback plan documented
  - [ ] Stakeholder sign-off recorded
  - [ ] Dedupe scan completed and alignment captured (background.initiative_overlap)

tracking:
  document: ../.tracking/prd_tracking.md
  entry: "PRD-XXX | <prd-title> | <status> | <notes>"
