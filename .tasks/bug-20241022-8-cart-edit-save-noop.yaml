id: BUG-20241022-8
project: front-store
template: Bug Fix
description: Cart “Edit configuration” page ignores new option selections and never recomputes price.

metadata:
  severity: critical
  priority: p0
  status: new
  regression: unknown
  environment:
    - Browser: Chrome 119 (desktop)
    - Browser: Safari 17 (macOS)
    - Build: local dev & production bundle
  reported_by: qa-audit
  discovered_on: 2024-10-30
  related_work:
    - FEAT-20241022-5
    - BUG-20241022-6
  references:
    - src/components/OptionsClientWrapper.tsx
    - src/components/ProductOptions.tsx
  overlap_review:
    related_initiatives: []
    resolution: unique
    notes: |
      Reviewed .tasks backlog and no open item covers the cart edit configurator save path. Logged new defect.

observed_behavior:
  summary: |
    From /cart, clicking “Edit configuration” opens the configurator, but pressing the “Save Changes” CTA returns to the cart with no updates: newly toggled add-ons are ignored and line totals never change. Code passes the original cart options into the save handler and prices are recomputed against a non-existent `priceModifier` field, so nothing persists.
  reproduction_steps:
    - Step 1: On /cart, ensure a configurable item exists and open “Edit configuration”.
    - Step 2: Toggle one of the add-on checkboxes/radios in the options grid.
    - Step 3: Click the banner “Save Changes” button.
    - Step 4: Inspect cart item; options list and totals remain unchanged.
  actual_result: Save handler reuses stale `cartItem.options` and price delta is always zero because it sums `option.priceModifier`, leaving edits unsaved.
  supporting_artifacts:
    logs:
      - src/components/OptionsClientWrapper.tsx:314-322
      - src/components/OptionsClientWrapper.tsx:101-139
      - src/components/ProductOptions.tsx:208-335
    screenshots: []
    recordings: []

expected_behavior:
  summary: |
    Saving edits should capture the user’s current selections, update the cart item’s options list, and adjust the item totals before returning to /cart.
  confirmation_source:
    - FEAT-20241022-5 acceptance criteria (edit session must update cart item and reflect price changes)
    - Product configuration UX requirements

impact_analysis:
  affected_users:
    - Any shopper attempting to modify configuration from the cart
  business_impact:
    - Prevents upsell attachments and misleads shoppers; edit flow fails
  frequency: always
  blocking_release: yes

technical_analysis:
  hypothesized_root_cause: |
    `OptionsClientWrapper` calls `handleSaveConfiguration(cartItem.options || [])`, so it never sees newly selected options stored in `ProductOptions` state. The fallback `Add Selected Options` button calls the right handler, but the main Save CTA is a no-op. Additionally `handleSaveConfiguration` sums `opt.priceModifier`, yet `ProductOptions` produces payloads with a `price` field, so even when selections propagate the price delta is zero.
  diagnostic_notes:
    - Save button wired to stale data (`cartItem.options`) (OptionsClientWrapper.tsx:314-322)
    - Price recompute ignores `price` and only looks at `priceModifier` (OptionsClientWrapper.tsx:112-118)
    - `ProductOptions` emits payload with `price` field (ProductOptions.tsx:208-335)
  scope_of_failure:
    code_paths:
      - src/components/OptionsClientWrapper.tsx
      - src/components/ProductOptions.tsx
    data_entities:
      - Cart item options payload stored in Zustand cart store
  risk_if_unresolved:
    - Edit flow remains broken; pricing never reflects add-on changes

fix_plan:
  owner: frontend-dev
  tasks:
    - name: Confirm no duplicate fix in-flight
      description: Review backlog/PRs for overlapping configurator edits and update metadata.overlap_review.
      files:
        - n/a
      steps:
        - Scan .tasks for cart edit/configurator stories
        - Coordinate with feature owners if conflicting work appears
      safeguards:
        - Escalate to tech lead if ownership unclear
      acceptance_checks:
        - metadata.overlap_review captures findings and outreach
    - name: Wire Save CTA to current selection state
      description: Persist latest option selection and price delta from ProductOptions when saving.
      files:
        - src/components/OptionsClientWrapper.tsx
        - src/components/ProductOptions.tsx
      steps:
        - Track selected option payload in state or via callback so Save button uses fresh selections
        - Ensure `handleSaveConfiguration` receives that payload instead of `cartItem.options`
        - Update price calculation to sum `opt.price` (or normalize helper) rather than `priceModifier`
      safeguards:
        - Keep optimistic store update behind `updateCartItemSafe`; add rollback on failure
      acceptance_checks:
        - Editing options and hitting Save updates cart options & totals correctly
    - name: Regression coverage
      description: Add unit/integration test validating edit flow persists options and price changes.
      files:
        - src/components/OptionsClientWrapper.tsx (test harness)
        - tests/integration/cartEditFlow.test.tsx (new)
      steps:
        - Simulate edit session, toggle option, trigger Save, assert cart store updated
        - Cover price recompute rounding/formatting
      safeguards:
        - Run Storybook test-runner/RTL to prevent regressions
      acceptance_checks:
        - Tests fail before fix, pass after
  rollback_plan:
    - Revert OptionsClientWrapper/ProductOptions changes if regression detected.
  communication_plan:
    - channel: #frontend
      audience: FE/QA/PM stakeholders
      message: Cart edit Save/price bug fixed; regression tests added.

verification_matrix:
  test_cases:
    regression:
      - Edit cart item, change option, click Save, cart shows new option and price
    guardrail:
      - Hitting Cancel keeps original configuration
    performance:
      - Save interaction completes within 1s including optimistic update
    security:
      - No sensitive data logged during edit session persistence
  data_validation:
    - Confirm cart store entry reflects updated options & price after save
  monitoring:
    - metric: edit_session_completed
      expected_change: increase
      alert_if: remains zero after deploy

acceptance_criteria:
  - [ ] Bug reproduction steps now succeed without issue
  - [ ] Automated tests updated/added to cover regression
  - [ ] Logs/analytics show expected healthy signals post-fix
  - [ ] Stakeholders validated the fix in target environments
  - [ ] Related documentation/runbooks updated

checklist:
  - [ ] Bug reproducible and documented
  - [ ] Root cause confirmed or best-effort rationale captured
  - [ ] Overlap review completed and owners notified (metadata.overlap_review)
  - [ ] Fix implemented behind feature flag or safe rollout plan
  - [ ] Tests (unit/integration/e2e) executed and passed
  - [ ] Monitoring configured or updated
  - [ ] QA sign-off recorded
  - [ ] Deployment/rollback strategy documented

tracking:
  document: ../.tracking/bug_tracking.md
  entry: "BUG-20241022-8 | Cart edit save ignores selections | new"
