## Testing Requirements

### Unit Tests
```typescript
describe('OptionCard Variation Popup', () => {
  it('should show variation popup when clicking VARIABLE option', () => {
    const mockOption = {
      id: 'option-1',
      type: 'VARIABLE',
      variations: [
        { id: 'var-1', name: 'Red', price: 0 },
        { id: 'var-2', name: 'Blue', price: 0 }
      ]
    };

    render(<OptionCard option={mockOption} />);
    
    const card = screen.getByRole('article');
    fireEvent.click(card);
    
    expect(screen.getByText('Red')).toBeInTheDocument();
    expect(screen.getByText('Blue')).toBeInTheDocument();
  });

  it('should not show popup for SIMPLE options', () => {
    const mockOption = {
      id: 'option-1',
      type: 'SIMPLE',
      variations: []
    };

    render(<OptionCard option={mockOption} />);
    
    const card = screen.getByRole('article');
    fireEvent.click(card);
    
    expect(screen.queryByText('Red')).not.toBeInTheDocument();
  });
});
```

### Integration Tests
```typescript
describe('Model Configurator Integration', () => {
  it('should show variation popup in configurator context', async () => {
    const mockConfiguratorData = {
      baseModel: { id: 'model-1', name: 'Test Model' },
      categories: [{
