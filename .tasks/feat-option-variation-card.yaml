# Business Context
## Problem Statement
The current OptionVariationPopup displays variation products using basic HTML elements without a dedicated component. This creates inconsistent styling, poor reusability, and makes it difficult to maintain consistent variation display across the application.

## Business Impact
- **User Experience**: Inconsistent variation display affects user confidence in product selection
- **Maintainability**: Hard-coded variation display makes updates difficult and error-prone
- **Scalability**: No reusable component for variation display limits future feature development
- **Design Consistency**: Variations don't follow the same design patterns as OptionCard

## Success Metrics
- Consistent variation display across all popups and modals
- Reusable component that can be used in multiple contexts
- Improved user experience with professional variation presentation
- Reduced development time for future variation-related features

# User Story
**As a** customer using the Model Configurator
**I want** to see variation products displayed in a consistent, professional format
**So that** I can easily compare and select the variations that best meet my needs

**Acceptance Criteria:**
- Variation cards display with consistent styling matching OptionCard design
- Each variation shows name, price, attributes, and selection state clearly
- Variations support both radio (single selection) and checkbox (multiple selection) modes
- Component is reusable across different contexts (popups, modals, comparison views)
- Accessibility features match OptionCard standards

# Technical Requirements

## Component Architecture
```typescript
interface OptionVariationCardProps {
  // Core Props
  variation: Variation;
  option: OptionProduct;
  
  // Selection Props
  isSelected: boolean;
  selectionType: 'radio' | 'checkbox';
  disabled?: boolean;
  
  // Display Props
  variant?: 'default' | 'compact' | 'featured';
  size?: 'small' | 'medium' | 'large';
  showPrice?: boolean;
  showAttributes?: boolean;
  showImage?: boolean;
  showStockStatus?: boolean;
  
  // Interaction Props
  onSelect?: (variation: Variation) => void;
  onDeselect?: (variation: Variation) => void;
  onToggle?: (variation: Variation) => void;
  
  // Accessibility Props
  highContrast?: boolean;
  largeText?: boolean;
  reducedMotion?: boolean;
  screenReaderOptimized?: boolean;
  
  // Styling Props
  className?: string;
  selectedClassName?: string;
  disabledClassName?: string;
}

interface Variation {
  id: string;
  databaseId: number;
  name: string;
  price: number; // Price modifier (can be 0, positive, or negative)
  sku: string;
  image?: {
    sourceUrl: string;
    altText: string;
  };
  attributes: Array<{
    id: string;
    name: string;
    value: string;
  }>;
  stockStatus?: 'instock' | 'outofstock' | 'onbackorder';
}
```

