### Visual Design Elements

#### 1. **Variation Cards**
- **Size**: Consistent card dimensions (e.g., 200x150px on desktop)
- **Border**: Subtle border with hover effects
- **Selection State**: 
  - Selected: Blue border, checkmark icon, highlighted background
  - Unselected: Gray border, empty circle
- **Hover Effects**: Slight elevation, border color change

#### 2. **Color Variations**
- **Color Swatches**: Large color preview circles/squares
- **Color Names**: Clear text labels below swatches
- **Price Indicators**: Prominent price display (+$X, -$X, or $0)

#### 3. **Feature Variations**
- **Icons**: Relevant icons for each feature (safety, comfort, etc.)
- **Feature Names**: Clear, descriptive names
- **Descriptions**: Brief feature descriptions on hover

#### 4. **Service Variations**
- **Service Levels**: Visual indicators (Standard, Premium, White-Glove)
- **Duration**: Service duration information
- **Pricing**: Clear pricing display

#### 5. **Price Display**
- **Base Price**: Option base price
- **Variation Modifiers**: Individual variation price changes
- **Total Calculation**: Real-time total price updates
- **Currency Formatting**: Proper currency formatting ($X,XXX.XX)

### Interaction Patterns

#### 1. **Selection Behavior**
- **Radio Selection**: Clicking a variation deselects others
- **Checkbox Selection**: Clicking toggles selection state
- **Visual Feedback**: Immediate visual feedback on selection
- **Price Updates**: Real-time price calculation

#### 2. **Navigation**
- **Keyboard Navigation**: Tab through variations, Enter to select
- **Touch Navigation**: Tap to select, swipe gestures on mobile
- **Focus Management**: Proper focus handling when popup opens/closes

#### 3. **Actions**
- **Apply**: Apply selections and close popup
- **Cancel**: Close popup without applying changes
- **Clear**: Reset all selections
- **Save Default**: Save current selection as default

