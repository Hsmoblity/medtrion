## User Experience Flow

### 1. **Opening Option Popup**
1. User sees option card in the configurator
2. User clicks anywhere on the option card
3. Popup opens with smooth animation
4. User sees option details and available variations (if VARIABLE)
5. Current selections are highlighted (if already in configuration)

### 2. **Selecting Variations (VARIABLE Options Only)**
1. User hovers over variation card (desktop) or taps (mobile)
2. Card shows hover effects and selection preview
3. User clicks/taps to select variation
4. Selection state updates immediately
5. Price calculation updates in real-time

### 3. **Adding to Configuration**
1. User reviews option details and selected variations (if any)
2. User clicks "Add to Configuration" button
3. Option is added to configuration summary
4. Popup closes with smooth animation
5. Configuration summary updates to show new option

### 4. **Canceling Changes**
1. User clicks "Cancel" button or close (×) button
2. Popup closes without applying changes
3. Previous configuration remains unchanged
4. User returns to main configurator

