id: BUG-20241030-3
project: front-store
template: Bug Fix
description: ModelConfigurator delays rendering behind `isHydrated`, breaking SSR layout and Storybook hydration scenarios.

metadata:
  severity: major
  priority: p1
  status: new
  regression: unknown
  environment:
    - Browser: Chrome 119
    - Storybook: payment/configurator stories
    - Route: /product/[slug]/options (SSR/CSR)
  reported_by: frontend-qa
  discovered_on: 2024-10-30
  related_work:
    - FEAT-20250926-6
  references:
    - src/components/configurator/ModelConfigurator.tsx
  overlap_review:
    related_initiatives:
      - id: FEAT-20250926-6
        status: in-flight
      - id: FEAT-20241030-1
        status: new
    resolution: unique
    notes: |
      Storybook feature requires hydrated/empty-cart support; no active bug covers this hydration gate. Logged defect and notified owners.

observed_behavior:
  summary: |
    ModelConfigurator gates derived values behind `isHydrated`. SSR/Storybook renders show zero totals, missing financing badges, and hidden compatibility warnings until client hydration occurs, causing layout shifts and failing hydrated scenarios.
  reproduction_steps:
    - Step 1: Open /product/<slug>/options; observe initial “$0” totals before hydration.
    - Step 2: Run configurator Storybook story; note controls show empty selections despite mock state.
    - Step 3: Review component logic (lines 95-427) where `isHydrated` gates totals/options.
  actual_result: Initial render lacks expected data; updates only after hydration.
  supporting_artifacts:
    logs:
      - src/components/configurator/ModelConfigurator.tsx (lines 95-427)
    screenshots: []
    recordings: []

expected_behavior:
  summary: |
    SSR and Storybook should render consistent totals and selections without waiting for hydration. Derived values must use server-safe defaults and rehydrate seamlessly.
  confirmation_source:
    - FEAT-20250926-6 requirement (“support hydrated (persisted) and empty-cart scenarios”)
    - UX expectations for stable layout

impact_analysis:
  affected_users:
    - All storefront visitors
    - Storybook consumers/QA relying on hydrated scenarios
  business_impact:
    - Perceived instability; Storybook tests fail or require hacks
  frequency: always
  blocking_release: yes

technical_analysis:
  hypothesized_root_cause: |
    `isHydrated` defaults false and flips in `useEffect`, so initial render uses fallback zeros/nulls. When effect runs, state changes cause layout jumps. Storybook mocks also fail because hydration gating prevents display of preloaded selections.
  diagnostic_notes:
    - `getConfigurationSummary()` already handles data safely; gating redundant.
    - Compatibility warnings never show on SSR.
  scope_of_failure:
    code_paths:
      - src/components/configurator/ModelConfigurator.tsx
    data_entities:
      - selectedOptions
      - financingOptions
      - compatibilityIssues
  risk_if_unresolved:
    - Hydrated stories cannot be validated; production layout shifts persist.

fix_plan:
  owner: frontend-dev
  tasks:
    - name: Confirm no duplicate hydration fix in-flight
      description: Audit backlog/PRs for ModelConfigurator hydration changes; update overlap review.
      files:
        - n/a
      steps:
        - Search repo for `isHydrated` references.
        - Coordinate with configurator owners if overlapping work exists.
      safeguards:
        - Escalate to tech lead if conflicting refactor underway.
      acceptance_checks:
        - metadata.overlap_review updated with findings.
    - name: Refactor hydration handling
      description: Remove blanket `isHydrated` gating and use SSR-safe defaults.
      files:
        - src/components/configurator/ModelConfigurator.tsx
      steps:
        - Replace `useState(false)` with safer detection only where needed (e.g., window-dependent logic).
        - Compute totals/options via memoized helpers that accept optional data.
        - Ensure compatibility warnings and financing badges render on initial props.
      safeguards:
        - Unit tests verifying SSR snapshot matches hydrated output.
      acceptance_checks:
        - Initial render shows correct totals without flash; hydration diff-free.
    - name: Update Storybook scenarios/tests
      description: Ensure configurator stories simulate hydrated state without hacks.
      files:
        - src/stories/configurator/ModelConfigurator.stories.tsx
        - tests/integration/configuratorHydration.test.tsx
      steps:
        - Remove artificial hydration waits.
        - Add integration test asserting consistent render before/after hydration.
      safeguards:
        - Run Storybook test runner in CI.
      acceptance_checks:
        - Story scenarios pass without timers; tests confirm stable layout.
  rollback_plan:
    - Revert ModelConfigurator changes if regression discovered; temporarily disable feature flag for hero strip in Storybook.
  communication_plan:
    - channel: #frontend
      audience: FE/QA/Product
      message: Hydration gating removed; QA to retest configurator stories.

verification_matrix:
  test_cases:
    regression:
      - SSR snapshot and hydrated output match for totals/badges.
    guardrail:
      - Client option changes still update totals correctly.
    performance:
      - No increased CLS (<= 0.1).
    security:
      - No change.
  data_validation:
    - Compare `getConfigurationSummary()` output pre/post fix.
  monitoring:
    - metric: configurator_layout_shift
      expected_change: decrease
      alert_if: CLS spike post deploy.

acceptance_criteria:
  - [ ] Bug reproduction steps now succeed without issue
  - [ ] Automated tests updated/added to cover regression
  - [ ] Logs/analytics show expected healthy signals post-fix
  - [ ] Stakeholders validated the fix in target environments
  - [ ] Related documentation/runbooks updated

checklist:
  - [ ] Bug reproducible and documented
  - [ ] Root cause confirmed or best-effort rationale captured
  - [ ] Overlap review completed and owners notified (metadata.overlap_review)
  - [ ] Fix implemented behind feature flag or safe rollout plan
  - [ ] Tests (unit/integration/e2e) executed and passed
  - [ ] Monitoring configured or updated
  - [ ] QA sign-off recorded
  - [ ] Deployment/rollback strategy documented

tracking:
  document: ../.tracking/bug_tracking.md
  entry: "BUG-20241030-3 | ModelConfigurator hydration gating causes layout shift | new"
