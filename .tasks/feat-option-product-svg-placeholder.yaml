## Performance Considerations

### Lazy Loading
```typescript
// Only load placeholder when image fails
const [imageError, setImageError] = useState(false);

// Show placeholder immediately if no src
if (!src) {
  return <ImagePlaceholder />;
}

// Show placeholder if image fails to load
if (imageError) {
  return <ImagePlaceholder />;
}
```

### SVG Optimization
- Inline SVG to avoid additional HTTP requests
- Use `currentColor` for themeable icons
- Minimal path data for fast rendering
- No external dependencies

