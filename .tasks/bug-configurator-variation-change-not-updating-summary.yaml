# Problem Statement
## Issue Summary
In the Model Configurator, when a user changes their selected variation for an already-configured option product (e.g., changing from "Red Leather" to "Blue Fabric"), the configuration summary does not update to reflect the new selection. The summary continues to show the old variation selection, price, and attributes.

## Current Behavior
- User adds option with variation A to configuration
- Configuration summary shows option with variation A
- User reopens option and selects variation B instead
- Clicks "Update Configuration" or "Add to Configuration"
- Configuration summary DOES NOT update to show variation B
- Summary still shows variation A (stale data)
- Price does not update to reflect new variation price
- User sees incorrect configuration

## Expected Behavior
- User adds option with variation A to configuration
- Configuration summary shows option with variation A
- User reopens option and selects variation B
- Clicks "Update Configuration"
- Configuration summary UPDATES to show variation B
- Summary shows new variation name, attributes, and price
- Total price updates to reflect price difference
- User sees accurate, current configuration

## Impact Assessment
### User Impact
- **🚨 CRITICAL**: Users cannot change variation selections
- **💰 Wrong Purchase**: May purchase wrong variation
- **🤝 Trust Damage**: Summary shows incorrect information
- **😕 User Confusion**: Selected variation doesn't match summary
- **📞 Support Overload**: Users report incorrect configurations

### Business Impact
- **💸 Revenue Loss**: Users abandon due to broken functionality
- **🏢 Brand Damage**: Broken features damage credibility
- **📉 Conversion Rate**: Users cannot complete desired configurations
- **⚠️ Order Errors**: Customers may receive wrong products
- **🔥 Critical Severity**: Core configurator functionality broken

### Technical Impact
- **🔴 State Update Failure**: Store not updating existing options
- **🔗 Integration Broken**: Popup to summary integration broken
- **💾 Data Persistence**: Incorrect data saved to configuration
- **🎯 Update Logic Missing**: No logic to update existing selections
- **🔧 Calculation Error**: Price recalculation not triggered

# Root Cause Analysis

## Likely Causes
1. **addOption() Always Adds, Never Updates**: Store action adds duplicate instead of updating
2. **No Update Logic**: Missing logic to detect and update existing options
3. **State Comparison Missing**: No check if option already exists in configuration
4. **OptionVariationPopup Missing Update Mode**: Popup doesn't differentiate add vs update
5. **Store Action Incomplete**: addOption() doesn't handle "replace existing" scenario
6. **Key Mismatch**: Option identification by wrong key (id vs databaseId)
7. **Category State Not Cleared**: Old option not removed before adding new one

## Data Flow Analysis
```
User Selects New Variation
    ↓
OptionVariationPopup
    ↓
onAddToConfiguration(option, newVariations)
    ↓
configuratorStore.addOption(option, categoryId)
    ↓
Expected: UPDATE existing option
Actual: ADD duplicate OR ignore
    ↓
Summary Shows: OLD variation (WRONG)
Should Show: NEW variation (CORRECT)
```

## Affected Components
### Primary Components
- **OptionVariationPopup**: Needs update mode detection
- **ModelConfigurator**: Needs handleUpdateConfiguration logic
- **configuratorStore**: addOption() needs update-or-add logic
- **SummaryPanel**: Needs to reflect updated variations
- **CategoryGroup**: May need to handle selection updates

### Secondary Components
- Configuration state management
- Price calculation logic
- Option comparison utilities

# Technical Investigation

## Current Store Implementation Issue

### Problematic addOption Logic
```typescript
// src/stores/configuratorStore.ts
addOption: (option, categoryId) => {
  set((state) => {
    const newSelectedOptions = { ...state.selectedOptions };
    
    if (!newSelectedOptions[categoryId]) {
      newSelectedOptions[categoryId] = [];
    }
    
    // ❌ PROBLEM: Checks multiSelect but not if option already exists
    if (category?.multiSelect) {
      // Checks if exists but still may add duplicate
      const exists = newSelectedOptions[categoryId].some(
        opt => opt.databaseId === option.databaseId
      );
      if (!exists) {
        newSelectedOptions[categoryId].push(option); // ✅ Adds if new
      }
      // ❌ MISSING: else { UPDATE existing option }
    } else {
      // Replaces entire array but doesn't update variations
      newSelectedOptions[categoryId] = [option]; // ⚠️ May work but loses variation update
    }
    
    return { selectedOptions: newSelectedOptions };
  });
  
  get().checkCompatibility();
  get().calculateSummary();
  get().updateProgressCount();
}
```

## Expected Fix Implementation

### Fix 1: Update addOption to Handle Updates
```typescript
// src/stores/configuratorStore.ts
addOption: (option, categoryId) => {
  const state = get();
  const category = state.categories.find(c => c.id === categoryId);
  
  console.log('Adding/Updating option:', {
    optionId: option.databaseId,
    optionName: option.name,
    categoryId,
    hasVariations: option.selectedVariations?.length > 0,
    existingOptions: state.selectedOptions[categoryId]?.length || 0
  });
  
  set((state) => {
    const newSelectedOptions = { ...state.selectedOptions };
    
    if (!newSelectedOptions[categoryId]) {
      newSelectedOptions[categoryId] = [];
    }
    
    // Find if option already exists
    const existingIndex = newSelectedOptions[categoryId].findIndex(
      opt => opt.databaseId === option.databaseId
    );
    
    const exists = existingIndex !== -1;
    
    if (category?.multiSelect) {
      // Multi-select category
      if (exists) {
        // ✅ UPDATE existing option (replace with new variation selection)
        console.log('Updating existing option at index:', existingIndex);
        newSelectedOptions[categoryId][existingIndex] = option;
      } else {
        // ✅ ADD new option
        console.log('Adding new option to category');
        newSelectedOptions[categoryId].push(option);
      }
    } else {
      // Single-select category
      if (exists && newSelectedOptions[categoryId][0].databaseId === option.databaseId) {
        // ✅ UPDATE same option with new variations
        console.log('Updating option variations');
        newSelectedOptions[categoryId][0] = option;
      } else {
        // ✅ REPLACE with new option
        console.log('Replacing category selection');
        newSelectedOptions[categoryId] = [option];
      }
    }
    
    console.log('Updated selectedOptions:', newSelectedOptions[categoryId]);
    
    return { selectedOptions: newSelectedOptions };
  });
  
  // Recalculate everything
  get().checkCompatibility();
  get().calculateSummary();
  get().updateProgressCount();
},
```

### Fix 2: Add updateOption Action (Alternative Approach)
```typescript
// src/stores/configuratorStore.ts
updateOption: (option, categoryId) => {
  set((state) => {
    const newSelectedOptions = { ...state.selectedOptions };
    
    if (!newSelectedOptions[categoryId]) {
      console.warn('Cannot update option in non-existent category');
      return state;
    }
    
    // Find and update the specific option
    const optionIndex = newSelectedOptions[categoryId].findIndex(
      opt => opt.databaseId === option.databaseId
    );
    
    if (optionIndex === -1) {
      console.warn('Option not found in category, cannot update');
      return state;
    }
    
    console.log('Updating option:', {
      optionId: option.databaseId,
      oldVariations: newSelectedOptions[categoryId][optionIndex].selectedVariations,
      newVariations: option.selectedVariations,
      oldPrice: newSelectedOptions[categoryId][optionIndex].totalPrice,
      newPrice: option.totalPrice
    });
    
    // Update the option at the found index
    newSelectedOptions[categoryId][optionIndex] = option;
    
    return { selectedOptions: newSelectedOptions };
  });
  
  get().checkCompatibility();
  get().calculateSummary();
  get().updateProgressCount();
},

// Add to interface
interface ConfiguratorStore {
  // ... existing fields
  updateOption: (option: ConfigurableProductSchema, categoryId: string) => void;
}
```

### Fix 3: Update OptionVariationPopup to Detect Edit Mode
```typescript
// src/components/configurator/OptionVariationPopup.tsx
const OptionVariationPopup = ({ 
  option, 
  categoryId,
  isOpen, 
  onClose, 
  onAddToConfiguration 
}) => {
  // ✅ Check if option is already in configuration
  const { selectedOptions, addOption, updateOption } = useConfiguratorStore();
  
  const isAlreadyConfigured = useMemo(() => {
    const categoryOptions = selectedOptions[categoryId] || [];
    return categoryOptions.some(opt => opt.databaseId === option.databaseId);
  }, [selectedOptions, categoryId, option.databaseId]);
  
  // ✅ Get current variation selections if editing
  const currentVariations = useMemo(() => {
    if (!isAlreadyConfigured) return [];
    
    const categoryOptions = selectedOptions[categoryId] || [];
    const existingOption = categoryOptions.find(opt => opt.databaseId === option.databaseId);
    
    return existingOption?.selectedVariations || [];
  }, [isAlreadyConfigured, selectedOptions, categoryId, option.databaseId]);
  
  // ✅ Local state for temporary selections (before applying)
  const [tempSelectedVariations, setTempSelectedVariations] = useState(currentVariations);
  
  // ✅ Update temp selections when dialog opens with current selections
  useEffect(() => {
    if (isOpen) {
      setTempSelectedVariations(currentVariations);
    }
  }, [isOpen, currentVariations]);
  
  // ✅ Handle add or update based on mode
  const handleConfirm = useCallback(() => {
    const optionWithVariations = {
      ...option,
      selectedVariations: tempSelectedVariations,
      totalPrice: calculateTotalPrice(option.price, tempSelectedVariations)
    };
    
    console.log('OptionVariationPopup confirm:', {
      mode: isAlreadyConfigured ? 'UPDATE' : 'ADD',
      optionId: option.databaseId,
      oldVariations: currentVariations,
      newVariations: tempSelectedVariations,
      totalPrice: optionWithVariations.totalPrice
    });
    
    if (isAlreadyConfigured) {
      // ✅ UPDATE existing option
      updateOption(optionWithVariations, categoryId);
    } else {
      // ✅ ADD new option
      addOption(optionWithVariations, categoryId);
    }
    
    onClose();
  }, [option, tempSelectedVariations, isAlreadyConfigured, categoryId, addOption, updateOption, onClose]);

  return (
    <div className="option-variation-popup">
      <div className="popup-header">
        <h3>{option.name}</h3>
        <span className="mode-badge">
          {isAlreadyConfigured ? 'Update Selection' : 'Add to Configuration'}
        </span>
      </div>
      
      <div className="popup-body">
        {/* Show current selections if editing */}
        {isAlreadyConfigured && currentVariations.length > 0 && (
          <div className="current-selection-info">
            <p className="text-sm text-gray-600">
              Currently selected: {currentVariations.map(v => v.name).join(', ')}
            </p>
          </div>
        )}
        
        {/* Variations selection */}
        <div className="variations-grid">
          {option.variations?.map((variation) => (
            <OptionVariationCard
              key={variation.id}
              variation={variation}
              isSelected={tempSelectedVariations.some(v => v.id === variation.id)}
              onToggle={handleVariationToggle}
            />
          ))}
        </div>
      </div>
      
      <div className="popup-footer">
        <div className="price-preview">
          Total: {formatPrice(calculateTotalPrice(option.price, tempSelectedVariations))}
        </div>
        
        <div className="actions">
          <button onClick={onClose} className="btn-cancel">
            Cancel
          </button>
          <button 
            onClick={handleConfirm} 
            className="btn-confirm"
            disabled={tempSelectedVariations.length === 0 && option.type === 'VARIABLE'}
          >
            {isAlreadyConfigured ? 'Update Configuration' : 'Add to Configuration'}
          </button>
        </div>
      </div>
    </div>
  );
};
```

