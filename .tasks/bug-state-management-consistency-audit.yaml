## Expected State Architecture

### Global State (Zustand) - Single Source of Truth

#### Store 1: Configurator Store
**File**: `src/stores/configuratorStore.ts`
**Manages**:
```typescript
interface ConfiguratorStore {
  // Product Data
  model: ConfigurableProductSchema | null;
  categories: ConfiguratorCategory[];
  selectedOptions: Record<string, ConfigurableProductSchema[]>;
  
  // Calculations
  summary: ConfigurationSummary;
  compatibilityIssues: CompatibilityIssue[];
  
  // API State
  loading: boolean;
  error: string | null;
  
  // User Data
  savedConfigurations: SavedConfiguration[];
  editSession: EditSessionState;
  
  // Actions
  setModel, setCategories, addOption, removeOption,
  checkCompatibility, calculateSummary, etc.
}
```

#### Store 2: Cart Store (if exists, or create)
**File**: `src/stores/cartStore.ts`
**Manages**:
```typescript
interface CartStore {
  // Cart Data
  items: CartItem[];
  
  // Calculations
  subtotal: number;
  tax: number;
  shipping: number;
  total: number;
  
  // API State
  loading: boolean;
  error: string | null;
  
  // Actions
  addItem, removeItem, updateItem, clearCart,
  calculateTotals, applyDiscount, etc.
}
```

#### Store 3: Product Store (may need to create)
**File**: `src/stores/productStore.ts`
**Manages**:
```typescript
interface ProductStore {
  // Product Cache
  products: Record<string, ProductSchema>;
  featuredProducts: ProductSchema[];
  
  // Filters/Search
  filters: ProductFilters;
  searchQuery: string;
  
  // API State
  loading: boolean;
  error: string | null;
  
  // Actions
  fetchProduct, fetchProducts, setFilters,
  searchProducts, cacheProduct, etc.
}
```

### Local State (useState) - UI Only

**Appropriate Use Cases**:
```typescript
// ✅ Modal visibility
const [showModal, setShowModal] = useState(false);

// ✅ Form input (before submission)
const [inputValue, setInputValue] = useState('');

// ✅ Loading indicators (component-specific)
const [isSubmitting, setIsSubmitting] = useState(false);

// ✅ UI animations/transitions
const [isExpanded, setIsExpanded] = useState(false);

// ✅ Temporary selections (before confirmation)
const [tempSelection, setTempSelection] = useState(null);

// ✅ Hydration state
const [isHydrated, setIsHydrated] = useState(false);
```

**Inappropriate Use Cases** (should use global):
```typescript
// ❌ Configuration data
const [selectedOptions, setSelectedOptions] = useState({}); // Use global store

// ❌ Product data
const [product, setProduct] = useState(null); // Use global store

// ❌ Cart data
const [cartItems, setCartItems] = useState([]); // Use global store

// ❌ Shared state
const [categories, setCategories] = useState([]); // Use global store
```

