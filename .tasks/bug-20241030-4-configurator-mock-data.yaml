id: BUG-20241030-4
project: front-store
template: Bug Fix
description: Configurator and checkout flows still rely on mock data placeholders instead of live GraphQL mutations and option fetches.

metadata:
  severity: major
  priority: p1
  status: new
  regression: unknown
  environment:
    - Route: /product/[slug]/configure (SSR/CSR)
    - Storybook: Configurator & payment stories
  reported_by: frontend-qa
  discovered_on: 2024-10-30
  related_work:
    - FEAT-20241022-5
    - FEAT-20250926-6
  references:
    - src/pages/product/[slug]/configure.tsx
    - src/components/configurator/ModelConfigurator.tsx
    - src/components/OptionsClientWrapper.tsx
    - src/stores/configuratorStore.ts
  overlap_review:
    related_initiatives:
      - id: FEAT-20241022-5
        status: in-flight
      - id: FEAT-20241030-1
        status: new
    resolution: unique
    notes: |
      No open bug tracks replacement of mock configurator data with GraphQL APIs. This ticket covers the missing integration required by the PRD and Storybook feature specs. Product and FE leads notified.

observed_behavior:
  summary: |
    Configurator page and related flows include TODO placeholders and simulated delays instead of real GraphQL calls. Add-to-cart, save configuration, edit session completion, and category option fetches use static mock data, contradicting PRD requirements and Storybook payment coverage.
  reproduction_steps:
    - Step 1: Review `src/pages/product/[slug]/configure.tsx` and note TODO sections returning mock responses (lines ~40–115).
    - Step 2: Visit `/product/<slug>/configure`; network tab shows no GraphQL mutations for add-to-cart/save configuration.
    - Step 3: Inspect `handleFetchCategoryOptions` returning sanitized `_related_options_products` without calling WooCommerce/GraphQL APIs.
  actual_result: Configurator interactions do not hit real services; data remains static/mocked.
  supporting_artifacts:
    logs:
      - TODO comments in configure.tsx for add-to-cart/save/share/edit.
      - Configurator store lacks GraphQL hook implementations.
    screenshots: []
    recordings: []

expected_behavior:
  summary: |
    Configurator flows should consume live GraphQL queries/mutations for options, compatibility checks, financing, and cart mutations as required by FEAT-20241022-5 and Storybook payment PRD.
  confirmation_source:
    - FEAT-20241022-5 technical requirements (GraphQL integration)
    - FEAT-20250926-6 Storybook payment page coverage (hydrated vs persisted cart)

impact_analysis:
  affected_users:
    - All shoppers using configurator
    - Internal QA relying on realistic cart/save flows
  business_impact:
    - No real cart updates; configurator cannot create orders or persist edits
  frequency: always
  blocking_release: yes

technical_analysis:
  hypothesized_root_cause: |
    During migration, configurator retained mock handlers with TODOs for GraphQL integration. Supporting stores and utilities never wired to real APIs, so flows rely on static data.
  diagnostic_notes:
    - handleAddToCart uses `setTimeout` and redirects to /cart without mutation.
    - handleSaveConfiguration returns hard-coded object with empty selectedOptions.
    - handleFetchCategoryOptions maps existing `_related_options_products` but sets price=0 instead of live data.
    - OptionsClientWrapper/save flow still lacks mutation to persist cart edits.
  scope_of_failure:
    code_paths:
      - src/pages/product/[slug]/configure.tsx
      - src/components/OptionsClientWrapper.tsx
      - src/components/configurator/ModelConfigurator.tsx
      - src/stores/configuratorStore.ts
    data_entities:
      - CartItem
      - ConfiguratorCategory options
      - Saved configurations
  risk_if_unresolved:
    - Configurator unusable in production; analytics inaccurate; Storybook scenarios unreliable.

fix_plan:
  owner: frontend-dev
  tasks:
    - name: Confirm no parallel GraphQL integration work
      description: Audit backlog/PRs for configurator API integrations and update overlap notes.
      files:
        - n/a
      steps:
        - Review open merge requests referencing configurator GraphQL.
        - Align with backend team on available mutations.
      safeguards:
        - Escalate to product if dependency missing.
      acceptance_checks:
        - metadata.overlap_review updated with findings and contacts.
    - name: Implement cart & configuration mutations
      description: Replace mock add-to-cart/save/edit handlers with GraphQL mutations.
      files:
        - src/pages/product/[slug]/configure.tsx
        - src/components/OptionsClientWrapper.tsx
        - src/lib/graphql/configurator.ts (new)
      steps:
        - Create GraphQL mutations for add-to-cart, update configuration, save named configuration.
        - Wire handlers to call mutations, handle errors, update cart store.
      safeguards:
        - Use try/catch with user-facing toasts; rollback optimistic updates on failure.
      acceptance_checks:
        - Network trace shows GraphQL requests when saving/adding configurations.
    - name: Fetch real option/compatibility data
      description: Connect category option fetch and compatibility checks to services.
      files:
        - src/components/configurator/ModelConfigurator.tsx
        - src/lib/graphql/configurator.ts
        - src/stores/configuratorStore.ts
      steps:
        - Implement `onFetchCategoryOptions`, `onCheckCompatibility`, `onCalculateFinancing`, `onEstimateInsurance` using API endpoints.
        - Update store actions to merge results.
      safeguards:
        - Add retries/backoff; fallback to graceful errors.
      acceptance_checks:
        - Options populate from API; compatibility warnings reflect backend rules.
    - name: Update tests and Storybook mocks
      description: Ensure test suite covers live data paths; Storybook uses MSW mocks matching GraphQL schema.
      files:
        - tests/integration/configuratorApi.test.tsx
        - src/stories/configurator/ModelConfigurator.stories.tsx
        - src/stories/cart/CartEditFlow.stories.tsx
      steps:
        - Add MSW handlers for GraphQL queries/mutations.
        - Update integration tests to assert API calls invoked.
      safeguards:
        - Run storybook test runner & CI integration tests.
      acceptance_checks:
        - Tests fail pre-integration, pass post-fix; Storybook scenarios reflect live flows.
  rollback_plan:
    - Reintroduce mock handlers behind feature flag if backend unavailable; display maintenance notice.
  communication_plan:
    - channel: #frontend + #backend
      audience: FE, BE, QA, Product
      message: Coordinating configurator API go-live; request backend schema confirmation.

verification_matrix:
  test_cases:
    regression:
      - Add configuration triggers GraphQL mutation and updates cart.
    guardrail:
      - Fallback error path displays toast and prevents redirect.
    performance:
      - API calls cached/optimized; first response < 500ms (staging benchmark).
    security:
      - No sensitive data logged; rely on HTTPS endpoints.
  data_validation:
    - Verify returned configuration matches backend record post-save.
  monitoring:
    - metric: configurator_api_error_rate
      expected_change: decrease
      alert_if: >5% after launch.

acceptance_criteria:
  - [ ] Bug reproduction steps now succeed without issue
  - [ ] Automated tests updated/added to cover regression
  - [ ] Logs/analytics show expected healthy signals post-fix
  - [ ] Stakeholders validated the fix in target environments
  - [ ] Related documentation/runbooks updated

checklist:
  - [ ] Bug reproducible and documented
  - [ ] Root cause confirmed or best-effort rationale captured
  - [ ] Overlap review completed and owners notified (metadata.overlap_review)
  - [ ] Fix implemented behind feature flag or safe rollout plan
  - [ ] Tests (unit/integration/e2e) executed and passed
  - [ ] Monitoring configured or updated
  - [ ] QA sign-off recorded
  - [ ] Deployment/rollback strategy documented

tracking:
  document: ../.tracking/bug_tracking.md
  entry: "BUG-20241030-4 | Configurator still uses mock data instead of GraphQL | new"
