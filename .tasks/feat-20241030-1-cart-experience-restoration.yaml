id: FEAT-20241030-1
project: front-store
template: Feature
description: Restore the cart experience so add-to-cart, configurator edits, and checkout flows work reliably in the HSM Next storefront.

context:
  background: |
    The cart implementation migrated from Vue to Next.js but never reestablished a working provider layer. Add-to-cart dispatches fail because `CartContext` is never mounted, edit sessions do not persist option changes, and navigation back to merchandising stalls on non-homepages. PRD_CART_PAGE_COMPREHENSIVE.md v2.0 captures the current gaps and business need to unblock conversions.
  personas:
    - Shopper — Needs to adjust product bundles, trust pricing, and complete checkout.
    - Caregiver — Navigates between cart and homepage content while advising another person.
    - Internal CSR — Relies on edit flow to guide customers during assisted sales.
  dependencies:
    upstream:
      - BUG-20241022-6
      - BUG-20241022-7
      - BUG-20241022-8
    downstream:
      - Storybook cart documentation
      - Analytics dashboards relying on cart/checkout events
  artefacts:
    prd: .docs/PRD_CART_PAGE_COMPREHENSIVE.md
    design_spec: TBD (cart & edit flow refresh)
    analytics_dashboard: TBD (cart funnel metrics)
  existing_initiatives:
    related_items:
      - id: FEAT-20241022-5
        summary: Original cart→configurator edit flow feature (partially implemented)
        status: in-flight
      - id: BUG-20241022-6
        summary: Missing cart provider blocks add-to-cart
        status: new
      - id: BUG-20241022-7
        summary: Anchor navigation broken off homepage
        status: new
      - id: BUG-20241022-8
        summary: Cart edit save ignores new selections
        status: new
    overlap_rationale: |
      This feature consolidates fixes for the open bugs and fully realizes FEAT-20241022-5 requirements. It replaces the incomplete legacy context wiring and aligns navigation with the updated PRD. No other initiative is covering an end-to-end repair of cart, edit, and checkout flows.
    owner_notified: yes

technical_requirements:
  architecture:
    data_models:
      - name: CartItem
        description: Represents a shopper’s cart entry including selected options.
        fields:
          - cartItemId: string — Unique per entry, stable across edits.
          - slug: string — Product slug used for routing/configurator.
          - productId: string|number — WooCommerce/Contentful identifier.
          - variationId: string|null — Selected variation for parent product.
          - quantity: number — Must be ≥ 1.
          - price: number — Base unit price.
          - options: CartOption[] — Attached add-ons for the item.
      - name: CartOption
        description: Add-on product or variation attached to a cart item.
        fields:
          - cartItemId: string — Generated UUID for option entry.
          - productId: string|number — Parent add-on product id.
          - variationId: string|number|null — Variation id when applicable.
          - name: string — Display label.
          - price: number — Price delta in dollars.
          - sku: string|null — SKU for reporting.
          - quantity: number — Optional quantity multiplier.
      - name: EditSession
        description: Session contract stored in localStorage for cart edits.
        fields:
          - id: string — Secure random id (UUID preferred).
          - cartItemId: string — Target cart item being edited.
          - productSlug: string — Associated product route.
          - originalSelectedOptionIds: string[] — Snapshot before edits.
          - currentSelectedOptionIds: string[] — Last saved state.
          - startTime: Date — ISO timestamp.
          - expiresAt: Date — 30-minute timeout.
          - tabId: string — Originating browser tab identifier.
    state_management:
      storage_keys:
        - key: _cart
          scope: browser
          schema: JSON array of serialized CartItem for persistence.
        - key: app_session
          scope: browser
          schema: Encrypted/compressed object { editSessions: Record<string, EditSession>, activeTabId: string, version: number, lastCleanup: number }.
      caches:
        - name: cartBroadcastCache
          invalidation: BroadcastChannel `cart_updated` event clears stale copies across tabs.
    services:
      apis:
        - name: getProductBySlug
          method: query
          contract: Fetches Contentful product with options metadata.
          error_handling: Retry 1x with exponential backoff; surface toast on failure.
        - name: fetchRelatedProductsByIds
          method: query
          contract: Retrieves WooCommerce option catalog for configurator.
          error_handling: Fallback to `/api/debug/related-products`, log warning.
        - name: createOrder
          method: POST
          contract: Simulated order creation used by `/api/create-order`.
          error_handling: Display retry toast, rollback optimistic UI.
      events:
        - channel: cart_broadcast
          payload: { type: 'cart_updated', cartItemId?: string }
          latency_budget_ms: 200
    feature_flags:
      - id: cart_provider_refactor
        default: off
        rollout_plan: Enable for staging after automated tests pass, then production 100%.
  ux_requirements:
    routing:
      entry_points:
        - path: /
          gate: CSR
        - path: /cart
          gate: CSR
        - path: /product/[slug]/options
          gate: mixed (SSR + CSR)
        - path: /payment
          gate: CSR
      exit_paths:
        - success: /success?wpOrderId=[id]
        - cancel: /cart
        - error: /cart?error=[code]
    states:
      loading: Spinner or skeleton for cart fetch, edit session validation, payment submission.
      success: Toast notifications for saved configuration, order created.
      error: Inline banners for session invalid, fetch failure, quota issues.
      empty: Empty cart illustration with CTA linking to `/#shop`.
    accessibility:
      keyboard: All buttons focusable; edit modals trap focus; ESC closes modals.
      screen_reader: aria-live regions announce cart changes, save/cancel results.
      visual: WCAG 2.1 AA color contrast, consistent focus outlines.
    responsive_breakpoints:
      - name: mobile
        min_width: 0
        max_width: 767
        adjustments: Stack cart summary below items, sticky action bar replaced with fixed footer CTA.
      - name: desktop
        min_width: 1024
        adjustments: Two-column layout with sticky summary; edit banner inline.
  analytics_requirements:
    events:
      - name: add_to_cart
        trigger: Successful add button click.
        payload:
          - cartItemId: Unique id added.
          - productSlug: Product slug.
          - optionsCount: number of add-ons selected.
        owner: Analytics team
      - name: edit_session_completed
        trigger: Edit flow save completes.
        payload:
          - cartItemId: Edited item id.
          - priceDelta: Difference in total price.
        owner: Analytics team
      - name: checkout_start
        trigger: Proceed to checkout button on /cart.
        payload:
          - cartTotal: Current total.
          - cartCount: Item count.
        owner: Analytics team
    funnels:
      - name: cart_to_checkout
        steps:
          - add_to_cart
          - edit_session_completed (optional)
          - checkout_start
          - checkout_complete
        success_metric: Conversion to `checkout_complete` ≥ baseline +10%.
  performance_budget:
    initial_load_ms: 2000
    interaction_latency_ms: 200
    bundle_delta_kb: 0
  security_considerations:
    data_sensitivity: low
    storage_policy: Encrypt `app_session` payload via base64 or stronger.
    logging: Redact cart contents from console; only log ids/slugs.
    threat_vectors:
      - localStorage tampering
      - replay of expired session URLs

customer_journeys:
  - scenario: Shopper edits cart item before checkout
    preconditions:
      - Cart contains configurable stairlift with add-ons.
    steps:
      - Open cart page.
      - Click “Edit configuration”.
      - Toggle additional options, save.
      - See cart update, proceed to checkout.
    success_criteria:
      - Cart shows new options and updated totals.
      - Payment page reflects updated configuration.

non_functional_requirements:
  reliability: 99.5% availability for cart interactions (during business hours).
  observability:
    logs: Emit structured logs on edit session creation/expiry, checkout start.
    metrics: `checkout_start_count`, `edit_session_completed`, `cart_empty_errors`.
    alerts: Trigger if `checkout_start_count` remains zero 30 minutes post deploy.

rollout_strategy:
  phases:
    - name: staging
      description: Deploy to staging with analytics validation and automated tests.
      exit_criteria:
        - All automated tests green.
        - QA sign-off recorded.
    - name: production
      description: Gradual rollout with feature flag toggled per environment.
      exit_criteria:
        - Metrics stable for 48 hours.
  fallback_plan: Toggle `cart_provider_refactor` flag off and revert deploy if critical regression.

risks:
  known_risks:
    - description: Mixing context and Zustand may introduce race conditions.
      mitigation: Create single provider bridging to store, enforce singular API.
      owner: Frontend lead
    - description: Edit session storage quota errors.
      mitigation: Detect quota exceed, prompt user to clear, log telemetry.
      owner: Frontend dev
  open_questions:
    - Should we migrate fully to Zustand hooks (removing context) to simplify API?

communications:
  stakeholders:
    - name: Product manager
      update_cadence: Weekly check-in
    - name: QA lead
      update_cadence: Regression sync post feature completion
    - name: Analytics owner
      update_cadence: Post-release validation
  documentation:
    - .docs/PRD_CART_PAGE_COMPREHENSIVE.md
    - README updates for cart provider usage
    - Storybook docs for cart/edit flow

tasks:
  - name: Restore unified cart provider and navigation
    description: Reintroduce cart provider integrating Zustand store, repair global navigation anchors, and ensure add-to-cart works across app.
    rationale: Without a provider wiring, cart state mutations fail; navigation fixes are prerequisites for cart recovery.
    files:
      - src/pages/_app.tsx
      - src/components/PageLayout/PageLayout.tsx
      - src/contexts/cartItemsContext.ts
      - src/stores/cartStore.ts
      - src/components/ProductList/ProductList.tsx
      - src/components/PageLayout/Header.tsx
      - src/components/banner.tsx
      - src/components/PageLayout/Footer.tsx
    dependencies:
      internal:
        - step or module dependency
      external:
        - None
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Review backlog, .tasks folder, and roadmap for overlapping work.
            - Document findings in context.existing_initiatives.overlap_rationale.
            - Notify owners of related initiatives when overlap exists.
          acceptance_criteria:
            - Overlap assessment recorded and stakeholders acknowledged outcome.
        - step: 1
          name: Bridge CartContext to Zustand store
          files:
            - src/pages/_app.tsx
            - src/contexts/cartItemsContext.ts
            - src/stores/cartStore.ts
          details:
            - Create CartProvider exposing dispatch/selectors mapped to Zustand actions.
            - Wrap PageLayout/App with provider guarding SSR.
            - Ensure cookie persistence writes current cart on mutations.
          acceptance_criteria:
            - Add-to-cart populates cart items and persists to cookie.
        - step: 2
          name: Repair global navigation anchors
          files:
            - src/components/PageLayout/Header.tsx
            - src/components/banner.tsx
            - src/components/PageLayout/Footer.tsx
          details:
            - Replace hash-only hrefs with absolute `/#section` links routed via Next router.
            - Implement smooth scroll when already on homepage.
          acceptance_criteria:
            - Navigation from `/cart` or `/payment` to homepage sections works.
      testing_requirements:
        unit_tests:
          - CartProvider context mapping to store actions.
        integration_tests:
          - Add-to-cart updates cart list and totals.
        e2e_tests:
          - Navigate from `/payment` back to `/#shop`.
        performance_tests:
          - metric: add_to_cart_latency
            threshold: 200
      monitoring_plan:
        dashboards:
          - Cart funnel dashboard (to be created with analytics owner).
        alerts:
          - name: cart_add_zero
            condition: add_to_cart event count remains zero after release.
    deliverables:
      code:
        - CartProvider module
        - Updated navigation components
      documentation:
        - README snippet on provider usage
      operational:
        - Feature flag deployment plan

  - name: Fix edit flow persistence and pricing
    description: Ensure configuration edits capture latest selections, recompute pricing, and synchronize with payment summary.
    rationale: Current edit flow ignores user changes; cart totals never change, violating PRD.
    files:
      - src/components/OptionsClientWrapper.tsx
      - src/components/ProductOptions.tsx
      - src/stores/cartStore.ts
      - src/pages/cart.tsx
      - src/pages/payment.tsx
      - src/contexts/SessionContext.tsx
    dependencies:
      internal:
        - step or module dependency
      external:
        - Bug fixes from task 1 integrated
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Confirm no other branch is rewriting ProductOptions or edit flow.
            - Update overlap rationale if new work discovered.
          acceptance_criteria:
            - Stakeholder acknowledgement recorded.
        - step: 1
          name: Capture live option selections
          files:
            - src/components/ProductOptions.tsx
            - src/components/OptionsClientWrapper.tsx
          details:
            - Track current selected options in ProductOptions and expose via callback/ref.
            - Update save CTA to pass new payload instead of `cartItem.options`.
            - Normalize option price using `price` field with currency-safe helper.
          acceptance_criteria:
            - Save updates cart options and price delta.
        - step: 2
          name: Synchronize edit outcome with cart/payment
          files:
            - src/stores/cartStore.ts
            - src/pages/payment.tsx
            - src/pages/cart.tsx
          details:
            - Ensure store update triggers re-render in cart page components.
            - Payment summary recomputes totals using updated cart state.
            - Add success/error toasts via SessionContext notifications.
          acceptance_criteria:
            - Payment summary reflects edited configuration without refresh.
      testing_requirements:
        unit_tests:
          - handleSaveConfiguration calculates price using `price`.
          - store updateCartItem merges options immutably.
        integration_tests:
          - Simulated edit flow updates cart and payment summary.
        e2e_tests:
          - Edit configuration, add option, verify cart + payment totals.
        performance_tests:
          - metric: edit_save_latency
            threshold: 1000
      monitoring_plan:
        dashboards:
          - Edit session completion metrics.
        alerts:
          - name: edit_completion_zero
            condition: `edit_session_completed` stays zero post deploy.
    deliverables:
      code:
        - Updated ProductOptions & OptionsClientWrapper logic.
      documentation:
        - Storybook docs for edit flow scenarios.
      operational:
        - Edit session failure runbook.

  - name: Regression automation and documentation
    description: Add automated coverage, Storybook stories, and analytics validation supporting the restored cart experience.
    rationale: Prevent reoccurrence of cart/edit regressions and enable faster QA cycles.
    files:
      - tests/integration/cartFlow.test.tsx
      - tests/e2e/cartCheckout.spec.ts
      - src/stories/pages/CartPage.stories.tsx
      - src/stories/pages/Payment.stories.tsx
      - analytics tracking configuration
      - README.md
    dependencies:
      internal:
        - Tasks 1 & 2 code complete
      external:
        - Analytics owner provides event schema
    steps:
      implementation_steps:
        - step: 0
          name: Audit existing initiatives
          files: []
          details:
            - Confirm no parallel testing overhaul; align with QA plan.
          acceptance_criteria:
            - Overlap notes recorded.
        - step: 1
          name: Implement automated tests
          files:
            - tests/integration/cartFlow.test.tsx
            - tests/e2e/cartCheckout.spec.ts
          details:
            - RTL test: add-to-cart, edit save, proceed to payment.
            - Playwright/Chromatic scenario verifying navigation anchors.
          acceptance_criteria:
            - Tests fail pre-fix, pass post-fix; run in CI.
        - step: 2
          name: Update Storybook & docs
          files:
            - src/stories/pages/CartPage.stories.tsx
            - src/stories/pages/Payment.stories.tsx
            - README.md
          details:
            - Add stories showing populated cart, edit banner states, payment summary.
            - Document analytics events and manual QA checklist.
          acceptance_criteria:
            - Storybook renders scenarios without errors; docs reflect new workflow.
      testing_requirements:
        unit_tests:
          - Ensure analytics events triggered via mocks.
        integration_tests:
          - Storybook test runner for cart/payment stories.
        e2e_tests:
          - Playwright navigation/back-to-home scenario.
        performance_tests:
          - metric: storybook_render_time
            threshold: 200
      monitoring_plan:
        dashboards:
          - Chromatic visual regression dashboard.
        alerts:
          - name: storybook_failure
            condition: CI storybook test runner fails post merge.
    deliverables:
      code:
        - Automated test suites.
      documentation:
        - Storybook docs, README updates.
      operational:
        - Analytics tracking validation notes.

workflow:
  order: sequential
  dependencies:
    - Fix edit flow persistence and pricing depends-on Restore unified cart provider and navigation
  cadences:
    standups: Mon/Wed/Fri progress sync
    demos: Sprint-end cart experience walkthrough

rules:
  - DRY, KISS
  - stable params/returns
  - no duplicate functions
  - no ghost code
  - no overlapping code
  - no unnecessary complexity
  - confirm if requirements are ambiguous before implementing

acceptance_criteria:
  functional_requirements:
    - [ ] Add-to-cart populates cart list and persists between reloads.
    - [ ] Edit configuration saves selected options and updates totals.
    - [ ] Payment summary reflects cart state including edited options.
    - [ ] Navigation buttons from cart/payment reach correct homepage sections.
  technical_requirements:
    - [ ] Cart provider integrates with Zustand store without runtime errors.
    - [ ] Session storage handles edit sessions including expiry cleanup.
    - [ ] Automated tests pass in CI (unit, integration, e2e).
    - [ ] Bundle size does not exceed performance budget.
  quality_requirements:
    - [ ] WCAG 2.1 AA compliance verified for cart/edit components.
    - [ ] Storybook stories updated for cart and payment flows.
    - [ ] Analytics events validated against tracking plan.
    - [ ] QA regression suite executed and documented.
  security_requirements:
    - [ ] Session IDs generated via secure randomness.
    - [ ] No sensitive data logged during cart/edit operations.
    - [ ] LocalStorage encryption retained for `app_session`.
  analytics_requirements:
    - [ ] `add_to_cart`, `edit_session_completed`, `checkout_start` events fire with payload.

validation_matrix:
  test_plan:
    unit:
      owner: Frontend dev
      status: planned
    integration:
      owner: Frontend dev
      status: planned
    e2e:
      owner: QA lead
      status: planned
    accessibility:
      owner: QA lead
      status: planned
    performance:
      owner: Frontend dev
      status: planned
  sign_offs:
    - role: frontend-dev
      person: TBD
      status: pending
    - role: backend-dev
      person: N/A
      status: approved
    - role: qa
      person: TBD
      status: pending

metrics_and_observability:
  baseline_metrics:
    - name: checkout_start_count
      current_value: near zero
      source: analytics
  target_metrics:
    - name: checkout_start_count
      target_value: +50% vs baseline
      measurement_window: 7 days post release
    - name: edit_session_completed
      target_value: > 0 daily
      measurement_window: 7 days post release

checklist:
  - [ ] Code reviewed
  - [ ] Tests passed (unit/integration/e2e)
  - [ ] Storybook/docs updated where applicable
  - [ ] Feature flag rollout plan documented
  - [ ] Analytics events validated
  - [ ] Accessibility audit completed
  - [ ] Performance benchmarks documented
  - [ ] Operational runbook updated
  - [ ] Dedupe scan recorded and related owners notified (context.existing_initiatives)

tracking:
  document: ../.tracking/feat_tracking.md
  entry: "FEAT-20241030-1 | Cart experience restoration | new"
