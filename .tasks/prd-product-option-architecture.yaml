## Product Relationships and Data Flow

### Relationship Mapping
```typescript
// Main Product → Option Products
MainProduct.relatedOptions = [101, 102, 103, 104, 105]

// Option Product → Variations  
OptionProduct.variations = [
  { id: "var1", name: "Red Leather", price: 0 },
  { id: "var2", name: "Blue Leather", price: 0 },
  { id: "var3", name: "Premium Black", price: 50 }
]

// User Selection Flow
UserSelection = {
  baseModel: MainProduct,
  selectedOptions: {
    [optionId]: {
      option: OptionProduct,
      selectedVariations: Variation[],
      totalPrice: number
    }
  },
  grandTotal: number
}
```

### Data Flow Process
1. **Load Main Products**: Fetch SIMPLE products with `relatedOptions`
2. **Load Option Products**: Fetch VARIABLE products by IDs from `relatedOptions`
3. **Load Variations**: Variations are included in option product queries
4. **User Configuration**: User selects base model and customizes options
5. **Price Calculation**: Sum base price + selected option prices + variation modifiers
6. **Cart Integration**: Convert configuration to cart items with proper SKUs

