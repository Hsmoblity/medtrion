```

**ModelConfigurator.tsx**:
```tsx
// Ensure proper selection state management
const isSelected = (option: ConfigurableProductSchema): boolean => {
  return selectedOptions.some(selected => selected.databaseId === option.databaseId);
};

const handleOptionToggle = (option: ConfigurableProductSchema) => {
  if (isSelected(option)) {
    // Remove from selection
    setSelectedOptions(prev => 
      prev.filter(selected => selected.databaseId !== option.databaseId)
    );
  } else {
    // Add to selection
    setSelectedOptions(prev => [...prev, option]);
  }
};
```

