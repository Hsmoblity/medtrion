## Expected Data Structure

### Cart Item with Configuration
```typescript
interface CartItem {
  id: string;
  product: Product;  // Main product
  quantity: number;
  price: number;     // Base product price
  configuration?: {  // ⭐ Configuration data
    configId: string;
    options: ConfiguredOption[];  // ⭐ Option items
    totalPrice: number;
  };
  totalPrice: number; // Base + options
}

interface ConfiguredOption {
  id: string;
  databaseId: number;
  name: string;
  price: number;
  selectedVariations?: Variation[];
  totalPrice: number; // Option base + variations
}
```

