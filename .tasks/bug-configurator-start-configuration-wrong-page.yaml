### Option Loading Flow
```typescript
// Check if option loading flow is correct
const fetchProductOptions = async (productId: string) => {
  console.log('Fetching options for product:', productId);
  
  try {
    // Fetch product with related options
    const product = await fetchProduct(productId);
    console.log('Fetched product:', product);
    
    if (!product.relatedOptions || product.relatedOptions.length === 0) {
      console.warn('Product has no related options:', product);
      return [];
    }
    
    // Fetch option products
    const optionProducts = await fetchOptionProductsByIds(product.relatedOptions);
    console.log('Fetched option products:', optionProducts);
    
    return optionProducts;
  } catch (error) {
    console.error('Failed to fetch product options:', error);
    throw error;
  }
};
```

