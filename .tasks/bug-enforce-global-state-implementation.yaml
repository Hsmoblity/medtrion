## Enforcement Rules

### Rule 1: Single Store Call Per Component
```typescript
// ❌ VIOLATION
const { model } = useConfiguratorStore();
const { summary } = useConfiguratorStore(); // Duplicate call

// ✅ CORRECT
const { model, summary } = useConfiguratorStore();
```

### Rule 2: No Duplicate State
```typescript
// ❌ VIOLATION
const { categories } = useConfiguratorStore(); // Global
const [categories, setCategories] = useState([]); // ❌ Duplicate

// ✅ CORRECT
const { categories, setCategories } = useConfiguratorStore();
// Local state only for UI
const [showCategoryModal, setShowCategoryModal] = useState(false);
```

### Rule 3: Use Store Actions for Updates
```typescript
// ❌ VIOLATION
const { selectedOptions } = useConfiguratorStore();
const [localSelections, setLocalSelections] = useState({});
// Then syncing local to global later

// ✅ CORRECT
const { selectedOptions, addOption, removeOption } = useConfiguratorStore();
// Use store actions directly
addOption(option, categoryId);
```

### Rule 4: Local State Only for UI
```typescript
// ✅ CORRECT: Local state for UI interactions
const [showModal, setShowModal] = useState(false);
const [isHovered, setIsHovered] = useState(false);
const [isExpanded, setIsExpanded] = useState(false);
const [tempInput, setTempInput] = useState('');
const [isHydrated, setIsHydrated] = useState(false);

// ❌ VIOLATION: Local state for shared data
const [product, setProduct] = useState(null); // Use global store
const [cart, setCart] = useState([]); // Use global store
const [config, setConfig] = useState({}); // Use global store
```

