feature:
  title: Split WooCommerce GraphQL into single-purpose query templates
  area: frontend
  priority: p0
  status: new
  requested_by: techlead
  environment: production

summary:
  goal: Introduce dedicated GraphQL templates for targeted operations instead of overloading multi-purpose queries; first deliverable is an option-product-by-id fetch.
  scope:
    - Add a tailor-made query to fetch option products by WooCommerce databaseId (`GetOptionProductById`).
    - Refactor consumers to use the new template rather than generic list queries.
    - Establish pattern for future single-purpose queries (product by slug, cart, etc.).
  impact: Improves clarity, caching, and error handling by making each request explicit.

acceptance_criteria:
  - New query template added under `src/lib/graphql/configurator.ts` (or `woocommerce.ts`) for `GetOptionProductById($id: ID!)` using `idType: DATABASE_ID`.
  - API wrapper exposes `configuratorAPI.getOptionProductById` (or similar) with typed response and error handling.
  - Existing code path that needs option details (e.g., configurator) uses the new single-purpose query.
  - Tests cover the new query and confirm it returns expected option data.

implementation_plan:
  - Define the query string with required option fields (slug, name, price, image, metadata).
  - Update `configuratorAPI` (or `woocommerce` helper) to include a wrapper function.
  - Replace current `fetchProductsByDatabaseIds` usage for the single-id case with the new helper.
  - Add unit/integration tests verifying the client handles success/error cases.

risks:
  - WooCommerce schema differences between options and base products; ensure response shape matches expectations.
  - Need to coordinate with backend if additional fields are required.

stakeholders:
  - Frontend team
  - Backend/WooCommerce team
  - QA
