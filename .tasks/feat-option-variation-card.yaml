    option={option}
    isSelected={selectedVariations.includes(variation)}
    selectionType={selectionType}
    onToggle={handleVariationToggle}
    variant="compact"
    size="medium"
    showPrice={true}
    showAttributes={true}
    showImage={true}
    showStockStatus={true}
  />
))}
```

### ModelConfigurator Integration
