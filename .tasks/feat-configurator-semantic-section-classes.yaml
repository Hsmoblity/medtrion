## Section Breakdown

### Left Section: Configuration Options (Sidebar)

**Purpose**: Display configuration categories and navigation

**Semantic Class Names**:
- `configurator-sidebar` - Main sidebar container
- `configurator-section-left` - Layout position identifier
- `configuration-options-container` - Inner content wrapper
- `configuration-options-title` - Section heading
- `configuration-categories-nav` - Category navigation menu
- `configuration-category-group` - Individual category group
- `configuration-category-item` - Individual category item
- `configuration-category-active` - Active/selected category state
- `configuration-progress-bar` - Progress indicator at bottom
- `configuration-progress-fill` - Progress bar fill element
- `configuration-progress-text` - Progress text (e.g., "5 of 10 options")

**HTML Structure**:
```tsx
<aside className="configurator-sidebar configurator-section-left">
  <div className="configuration-options-container">
    <h2 className="configuration-options-title">
      Configuration Options
    </h2>
    
    <nav className="configuration-categories-nav">
      <div className="configuration-category-group">
        <button className="configuration-category-item configuration-category-active">
          <span className="category-icon">🛡️</span>
          <span className="category-name">Warranty</span>
          <span className="category-badge">2/5</span>
        </button>
      </div>
      {/* More categories */}
    </nav>
    
    <div className="configuration-progress-bar">
      <div className="configuration-progress-fill" style={{ width: '40%' }}></div>
      <p className="configuration-progress-text">
        4 of 10 options selected
      </p>
    </div>
  </div>
</aside>
```

### Center Section: Option Cards Display

**Purpose**: Display available option cards with details

**Semantic Class Names**:
- `configurator-content` - Main content area
- `configurator-section-center` - Layout position identifier
- `option-cards-container` - Main container for option cards
- `option-cards-title` - Section heading
- `option-cards-subtitle` - Optional subtitle or description
- `option-cards-grid` - Grid layout for cards
- `option-card` - Individual option card (from OptionCard component)
- `option-card-selected` - Selected state modifier
- `option-card-disabled` - Disabled state modifier
- `option-cards-loading` - Loading state container
- `option-cards-empty` - Empty state container
- `option-cards-error` - Error state container

**HTML Structure**:
```tsx
<main className="configurator-content configurator-section-center">
  <div className="option-cards-container">
    <h2 className="option-cards-title">
      Available Options - {currentCategory.name}
    </h2>
    <p className="option-cards-subtitle">
      Choose from the following options to customize your product
    </p>
    
    <div className="option-cards-grid">
      {/* Loading State */}
      {loading && (
        <div className="option-cards-loading">
          <div className="loading-spinner"></div>
          <p>Loading options...</p>
        </div>
      )}
      
      {/* Option Cards */}
      {!loading && options.map(option => (
        <OptionCard
          key={option.id}
          option={option}
          className="option-card"
          isSelected={isSelected(option)}
        />
      ))}
      
      {/* Empty State */}
      {!loading && options.length === 0 && (
        <div className="option-cards-empty">
          <p>No options available in this category</p>
        </div>
      )}
    </div>
  </div>
</main>
```

### Right Section: Configuration Summary Panel

**Purpose**: Display selected options summary with prices and total

**Semantic Class Names**:
- `configurator-summary` - Main summary panel
- `configurator-section-right` - Layout position identifier
- `configuration-summary-container` - Inner content wrapper
- `configuration-summary-title` - Section heading
- `selected-options-list` - List container for selected options
- `selected-option-item` - Individual selected option
- `selected-option-name` - Option name text
- `selected-option-price` - Option price text
- `selected-option-remove` - Remove button for option
- `configuration-summary-empty` - Empty state message
- `configuration-summary-footer` - Footer section with totals
- `configuration-total-price` - Total price container
- `total-price-label` - "Total:" label
- `total-price-amount` - Total price value
- `configuration-summary-actions` - Action buttons (Add to Cart, Save, etc.)

**HTML Structure**:
```tsx
<aside className="configurator-summary configurator-section-right">
  <div className="configuration-summary-container">
    <h2 className="configuration-summary-title">
      Configuration Summary
    </h2>
    
    {/* Selected Options List */}
    <div className="selected-options-list">
      {selectedOptions.length === 0 ? (
        <div className="configuration-summary-empty">
          <p>No options selected yet</p>
          <p className="text-sm text-gray-500">
            Choose options from the categories to build your configuration
          </p>
        </div>
      ) : (
        selectedOptions.map(option => (
          <div key={option.id} className="selected-option-item">
            <div className="selected-option-details">
              <span className="selected-option-name">
                {option.name}
              </span>
              <span className="selected-option-price">
                ${option.price}
              </span>
            </div>
            <button 
              className="selected-option-remove"
              aria-label={`Remove ${option.name}`}
            >
              ×
            </button>
          </div>
        ))
      )}
    </div>
    
    {/* Summary Footer with Total */}
    <div className="configuration-summary-footer">
      <div className="configuration-total-price">
        <span className="total-price-label">Total:</span>
        <span className="total-price-amount">${totalPrice}</span>
      </div>
      
      <div className="configuration-summary-actions">
        <button className="btn-add-to-cart">
          Add to Cart
        </button>
        <button className="btn-save-configuration">
          Save Configuration
        </button>
      </div>
    </div>
  </div>
</aside>
```

## CSS Class Naming Convention

### Naming Pattern

Follow BEM (Block Element Modifier) inspired naming:

```
[section]-[element]-[modifier]

Examples:
- configurator-sidebar (block)
- configuration-options-title (block-element)
- configuration-category-active (block-element-modifier)
```

### Prefix Standards

- **Layout sections**: `configurator-[section]`
  - `configurator-sidebar`
  - `configurator-content`
  - `configurator-summary`

- **Position identifiers**: `configurator-section-[position]`
  - `configurator-section-left`
  - `configurator-section-center`
  - `configurator-section-right`

- **Configuration elements**: `configuration-[element]`
  - `configuration-options-container`
  - `configuration-categories-nav`
  - `configuration-summary-container`

- **Option elements**: `option-[element]`
  - `option-cards-container`
  - `option-cards-grid`
  - `option-card`

- **Selected items**: `selected-[element]`
  - `selected-options-list`
  - `selected-option-item`

### State Modifiers

- `-active` - Currently active/selected state
- `-disabled` - Disabled/unavailable state
- `-loading` - Loading state
- `-empty` - Empty state
- `-error` - Error state
- `-selected` - Selected state (for options)
- `-expanded` - Expanded state (for collapsible elements)

