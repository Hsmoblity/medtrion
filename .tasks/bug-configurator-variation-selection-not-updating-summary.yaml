## Expected Behavior
```typescript
// Correct Implementation
const handleAddToConfiguration = (option: OptionProduct, variations?: Variation[]) => {
  if (!variations || variations.length === 0) {
    // Handle simple option without variations
    addSimpleOptionToConfiguration(option);
  } else {
    // Handle variable option with variations
    addVariableOptionToConfiguration(option, variations);
  }
  
  // Update configuration summary
  updateConfigurationSummary();
  
  // Recalculate total price
  recalculateTotalPrice();
  
  // Close popup
  setOptionPopup(prev => ({ ...prev, isOpen: false }));
};

const addVariableOptionToConfiguration = (option: OptionProduct, variations: Variation[]) => {
  // Create configuration item with variations
  const configurationItem = {
    id: option.id,
    name: option.name,
    type: option.type,
    basePrice: option.price,
    variations: variations.map(variation => ({
      id: variation.id,
      name: variation.name,
      price: variation.price,
      attributes: variation.attributes
    })),
    totalPrice: option.price + variations.reduce((sum, v) => sum + v.price, 0)
  };
  
  // Add to configuration state
  setSelectedOptions(prev => [...prev, configurationItem]);
  
  // Update configuration summary
  setConfigurationSummary(prev => ({
    ...prev,
    selectedOptions: [...prev.selectedOptions, configurationItem],
    optionsPrice: prev.optionsPrice + configurationItem.totalPrice,
    totalPrice: prev.basePrice + prev.optionsPrice + configurationItem.totalPrice
  }));
};
```

