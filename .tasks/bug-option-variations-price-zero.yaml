## Fix 5: Add Comprehensive Price Validation Utility
```typescript
// src/lib/utils/priceUtils.ts or priceValidation.ts
export const parsePrice = (price: any): number => {
  // Handle null, undefined, or empty string
  if (price === null || price === undefined || price === '') {
    console.warn('Price is null/undefined/empty, defaulting to 0');
    return 0;
  }
  
  // Handle numeric values
  if (typeof price === 'number') {
    if (isNaN(price) || !isFinite(price)) {
      console.warn('Price is NaN or Infinity, defaulting to 0', price);
      return 0;
    }
    return price;
  }
  
  // Handle string values
  if (typeof price === 'string') {
    // Remove currency symbols, commas, and whitespace
    const cleanPrice = price.replace(/[$,\s]/g, '');
    const parsed = parseFloat(cleanPrice);
    
    if (isNaN(parsed) || !isFinite(parsed)) {
      console.warn(`Failed to parse price string: "${price}", defaulting to 0`);
      return 0;
    }
    
    return parsed;
  }
  
  console.warn(`Unexpected price type: ${typeof price}`, price);
  return 0;
};

export const formatPrice = (price: any): string => {
  const validPrice = parsePrice(price);
  
  if (validPrice === 0) {
    return '$0.00';
  }
  
  return `$${validPrice.toFixed(2)}`;
};

export const formatPriceWithCurrency = (price: any, currency: string = 'USD'): string => {
  const validPrice = parsePrice(price);
  
  const formatter = new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: currency,
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  
  return formatter.format(validPrice);
};
```

