feature:
  title: Centralize GraphQL queries in shared consolidation layer
  area: frontend
  priority: p0
  status: new
  requested_by: techlead
  environment: production

summary:
  goal: Eliminate ad-hoc GraphQL query strings scattered in views/components by defining a consolidated query library (one source of truth) consumed across the app.
  scope:
    - Audit existing GraphQL usages and move query strings into `src/lib/graphql` (or `lib/woocommerce.ts`) only.
    - Expose typed helper functions for each query; components import helpers instead of embedding queries.
    - Document process for adding new queries.
  impact: Reduces duplication, eases maintenance, and ensures all data access routes stay aligned.

acceptance_criteria:
  - All GraphQL query/mutation strings live in the shared consolidation module; no component/page contains inline query strings.
  - Helper functions exported for each query (e.g., `getProductBySlug`, `getOptionsByIds`) and used across app.
  - Type definitions and mocks updated to match centralized schema.
  - Static analysis confirms no stray GraphQL strings outside the consolidation layer.

implementation_plan:
  - Inventory queries (configurator, cart, products) and relocate them to a single module (`src/lib/graphql/index.ts` or similar).
  - Update import paths in pages/components/stores to call the centralized helpers.
  - Add lint rule or code mod to prevent direct query definitions elsewhere.
  - Document usage in `/docs/graphql-query-guidelines.md`.

risks:
  - Large refactor touches many files; coordinate with simultaneous feature work.
  - Need to ensure tree-shaking/dead-code elimination still works; keep helpers modular.

stakeholders:
  - Frontend team
  - Backend team (for schema alignment)
  - QA
