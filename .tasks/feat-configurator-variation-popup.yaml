## Feature Request

### Summary

Enhance the Model Configurator's option cards to display variation products in an interactive popup/modal interface when clicked. This feature will improve the user experience by allowing users to view and select specific variations (colors, features, services) within each option category and add them directly to the configuration summary.

### Business Context

Based on the Product vs Product Options Architecture PRD, variable option products contain multiple variations that users need to select from. Currently, when users click on option cards, they may not see all available variations clearly. This feature will create a dedicated popup interface that opens when clicking on any option card, displaying all variations and allowing direct selection and addition to the configuration summary.

### User Story

**As a** customer configuring a stairlift  
**I want to** click on an option card and see all available variations in a popup  
**So that I can** easily select the specific variations I want and add them directly to my configuration summary

---

## Technical Requirements

### Core Functionality

#### 1. **Variation Popup Trigger**
- **Trigger**: Click on ANY option card (both SIMPLE and VARIABLE option products)
- **Condition**: Show popup for all option products when clicked
- **Behavior**: 
  - For SIMPLE options: Show option details and "Add to Configuration" action
  - For VARIABLE options: Show all variations with selection interface

#### 2. **Popup Interface Design**
- **Modal/Popup**: Overlay popup that covers the main configurator
- **Responsive**: Works on desktop, tablet, and mobile devices
- **Accessibility**: Keyboard navigation, screen reader support, focus management
- **Animation**: Smooth open/close transitions

#### 3. **Variation Display**
- **Grid Layout**: Display variations in a responsive grid
- **Visual Elements**: 
  - Variation images (if available)
  - Color swatches for color variations
  - Feature icons for feature variations
  - Service level indicators for service variations
- **Information Display**:
  - Variation name
  - Price modifier (+$X, -$X, or $0)
  - Description/attributes
  - Stock status (if applicable)

#### 4. **Selection Interface**
- **Radio Selection**: For `variableType: "radio"` options (single choice)
- **Checkbox Selection**: For `variableType: "checkbox"` options (multiple choices)
- **Visual Feedback**: Clear indication of selected variations
- **Price Updates**: Real-time price calculation as variations are selected

#### 5. **Popup Actions**
- **Add to Configuration**: Add selected variations directly to configuration summary
- **Cancel**: Close popup without applying changes
- **Clear Selection**: Reset all variations to unselected state (for VARIABLE options)
- **Update Configuration**: Update existing selections if option is already in configuration

### Data Structure Requirements

#### Option Product (SIMPLE or VARIABLE)
```typescript
interface OptionProduct {
  id: string;
  databaseId: number;
  name: string; // "Seat Color Selection" or "Extended Warranty"
  type: "SIMPLE" | "VARIABLE";
  optionType: "SAFETY" | "COMFORT" | "INSTALLATION" | "ACCESSORY" | "DELIVERY" | "WARRANTY";
  variableType?: "radio" | "checkbox"; // Only for VARIABLE products
  price: number; // Base option price
  description: string;
  shortDescription: string;
  image: {
    sourceUrl: string;
    altText: string;
  };
  variations?: Variation[]; // Only for VARIABLE products
  compatibleBaseModels?: number[];
}

interface Variation {
  id: string;
  databaseId: number;
  name: string; // "Red Leather Seat"
  price: number; // Price modifier
  sku: string;
  image?: {
    sourceUrl: string;
    altText: string;
  };
  attributes: Array<{
    id: string;
    name: string; // "Color", "Material", "Size"
    value: string; // "Red", "Leather", "Large"
  }>;
  stockStatus?: "instock" | "outofstock" | "onbackorder";
}
```

#### Popup State Management
```typescript
interface OptionPopupState {
  isOpen: boolean;
  selectedOption: OptionProduct | null;
  selectedVariations: Variation[]; // For VARIABLE options
  tempSelections: Variation[]; // For preview before applying
  pricePreview: number; // Calculated price with temp selections
  isAlreadyInConfiguration: boolean; // Check if option is already selected
}
```

