## Pricing Architecture

### Pricing Levels
1. **Base Model Price**: Set on main product
2. **Option Base Price**: Set on option product (can be 0)
3. **Variation Price Modifier**: Set on individual variations
4. **Total Option Price**: Option base price + selected variation modifiers
5. **Grand Total**: Base model + sum of all selected option totals

### Pricing Examples

#### Simple Option (No Variations)
```typescript
// Warranty Option - SIMPLE product
{
  name: "5-Year Extended Warranty",
  type: "SIMPLE",
  price: 299 // Fixed price
}
// Total: $299
```

#### Variable Option with Price Modifiers
```typescript
// Seat Color Option - VARIABLE product
{
  name: "Seat Color Selection",
  type: "VARIABLE",
  price: 199, // Base option price
  variations: [
    { name: "Red Leather", price: 0 },      // Total: $199 + $0 = $199
    { name: "Blue Leather", price: 0 },     // Total: $199 + $0 = $199  
    { name: "Premium Black", price: 50 }    // Total: $199 + $50 = $249
  ]
}
```

#### Multiple Selection Option
```typescript
// Safety Features - VARIABLE product with checkbox selection
{
  name: "Safety Features Package",
  type: "VARIABLE", 
  price: 0, // No base price
  variableType: "checkbox",
  variations: [
    { name: "Emergency Stop", price: 99 },   // Can select multiple
    { name: "Safety Rails", price: 149 },    // Can select multiple
    { name: "Warning Lights", price: 79 }    // Can select multiple
  ]
}
// If user selects all: $0 + $99 + $149 + $79 = $327
```

### Price Calculation Logic
```typescript
function calculateTotalPrice(configuration: UserConfiguration): number {
  let total = configuration.baseModel.price;
  
  for (const [optionId, selection] of Object.entries(configuration.selectedOptions)) {
    const optionBasePrice = selection.option.price;
    const variationModifiers = selection.selectedVariations.reduce(
      (sum, variation) => sum + variation.price, 0
    );
    total += optionBasePrice + variationModifiers;
  }
  
  return total;
}
```

