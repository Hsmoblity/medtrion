### **Step 5: Update Product Data Fetching**
```typescript
// src/lib/woocommerce.ts or similar
export const fetchProductForConfigurator = async (productId: string): Promise<Product> => {
  const query = `
    query GetProductForConfigurator($id: ID!) {
      product(id: $id) {
        id
        name
        description
        price
        image {
          sourceUrl
          altText
        }
        sku
        type
        relatedOptions
        # ... other fields
      }
    }
  `;

  const response = await fetchGraphQL(query, { id: productId });
  
  if (!response.data?.product) {
    throw new Error('Product not found');
  }

  const product = response.data.product;
  
  // Ensure price is properly parsed
  return {
    id: product.id,
    name: product.name,
    description: product.description,
    price: parseFloat(product.price) || 0, // Ensure price is a number
    image: product.image?.sourceUrl || '',
    sku: product.sku,
    type: product.type,
    relatedOptions: product.relatedOptions,
    // ... other fields
  };
};
```

### **Step 6: Update Configuration State Management**
```typescript
// src/stores/configuratorStore.ts
interface ConfiguratorState {
  selectedProduct: Product | null;
  basePrice: number;
  selectedOptions: Option[];
  total: number;
  isLoading: boolean;
  error: string | null;
}

interface ConfiguratorActions {
  setSelectedProduct: (product: Product) => void;
  addOption: (option: Option) => void;
  removeOption: (optionId: string) => void;
  calculateTotal: () => void;
  clearConfiguration: () => void;
}

export const useConfiguratorStore = create<ConfiguratorState & ConfiguratorActions>((set, get) => ({
  selectedProduct: null,
  basePrice: 0,
  selectedOptions: [],
  total: 0,
  isLoading: false,
  error: null,

  setSelectedProduct: (product: Product) => {
    const basePrice = product.price || 0;
    set({
      selectedProduct: product,
      basePrice,
      selectedOptions: [],
      total: basePrice,
      error: null
    });
  },

  addOption: (option: Option) => {
    const state = get();
    const newOptions = [...state.selectedOptions, option];
    const optionsTotal = newOptions.reduce((sum, opt) => sum + (opt.price || 0), 0);
    const total = state.basePrice + optionsTotal;
    
    set({
      selectedOptions: newOptions,
      total
    });
  },

  removeOption: (optionId: string) => {
    const state = get();
    const newOptions = state.selectedOptions.filter(opt => opt.id !== optionId);
    const optionsTotal = newOptions.reduce((sum, opt) => sum + (opt.price || 0), 0);
    const total = state.basePrice + optionsTotal;
    
    set({
      selectedOptions: newOptions,
      total
    });
  },

  calculateTotal: () => {
    const state = get();
    const optionsTotal = state.selectedOptions.reduce((sum, opt) => sum + (opt.price || 0), 0);
    const total = state.basePrice + optionsTotal;
    
    set({ total });
  },

  clearConfiguration: () => {
    set({
      selectedProduct: null,
      basePrice: 0,
      selectedOptions: [],
      total: 0,
      error: null
    });
  }
}));
```

