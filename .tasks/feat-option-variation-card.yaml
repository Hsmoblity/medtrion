## Design Specifications

### Visual Design
- **Layout**: Card-based design matching OptionCard aesthetic
- **Dimensions**: Responsive sizing (small: 200px, medium: 250px, large: 300px)
- **Spacing**: Consistent padding and margins following design system
- **Colors**: Blue accent for selection, gray for disabled states
- **Typography**: Clear hierarchy with variation name, attributes, and price

### Selection States
- **Unselected**: Gray border, white background
- **Selected**: Blue border, light blue background
- **Disabled**: Grayed out with reduced opacity
- **Hover**: Subtle shadow and border color change

### Selection Indicators
- **Radio Mode**: Single selection with circular indicator
- **Checkbox Mode**: Multiple selection with square indicator
- **Visual Feedback**: Clear selected/unselected states

## Data Integration

### Variation Data Source
```typescript
// Use real variation data from option.variations
const variations = option.variations || [];

// Map to Variation interface
const mappedVariations: Variation[] = variations.map(variation => ({
  id: variation.id,
  databaseId: variation.databaseId,
  name: variation.name || '',
  price: variation.price || 0,
  sku: variation.sku || '',
  image: variation.image,
  attributes: variation.attributes || [],
  stockStatus: 'instock' // Default, could be enhanced with real stock data
}));
```

### Price Display Logic
```typescript
const formatVariationPrice = (price: number): string => {
  if (price === 0) return 'Included';
  if (price > 0) return `+$${price}`;
  return `-$${Math.abs(price)}`;
};

const getTotalPrice = (optionPrice: number, variationPrice: number): number => {
  return optionPrice + variationPrice;
};
```

## Accessibility Features

### Keyboard Navigation
- **Tab Order**: Logical tab sequence through variation cards
- **Enter/Space**: Select/deselect variation
- **Arrow Keys**: Navigate between variations in radio mode
- **Escape**: Close popup or return focus to parent

### Screen Reader Support
- **ARIA Labels**: Clear labels for variation names and prices
- **Role Attributes**: Proper roles for interactive elements
- **State Announcements**: Announce selection changes
- **Descriptive Text**: Clear descriptions of variation attributes

### Visual Accessibility
- **High Contrast**: Support for high contrast mode
- **Large Text**: Scalable text sizes
- **Reduced Motion**: Respect user motion preferences
- **Color Independence**: Information not conveyed by color alone

## Integration Points

### OptionVariationPopup Integration
```typescript
// In OptionVariationPopup component
