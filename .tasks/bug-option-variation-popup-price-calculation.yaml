Selected Variation: "Red Leather" - $25

Calculation:
  Base Option Price: $100
  + Selected Variation: $25
  = Total: $125

User sees in popup:
  "Base Option Price: $100.00"
  "+ Selected Variation: $25.00"
  "─────────────────────────"
  "Total: $125.00"
