## Migration Strategy

### Phase 1: Add Field (Non-Breaking)
- Add `relatedOptions` to ProductSchema interface
- Update mapping functions to set both fields
- Keep all existing code using `_related_options` working

### Phase 2: Update Usage
- Update filter functions to use `relatedOptions`
- Update components to prefer `relatedOptions` over `_related_options`
- Add deprecation warnings for `_related_options` usage

### Phase 3: Cleanup (Future)
- Remove `_related_options` from ProductSchema (breaking change)
- Update all references to use only `relatedOptions`
- Document in migration guide

