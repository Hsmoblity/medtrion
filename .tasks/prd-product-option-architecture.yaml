## Technical Implementation

### GraphQL Queries
```graphql
# Get main products with related options
query GetMainProducts {
  products(where: { typeIn: [SIMPLE] }) {
    nodes {
      id
      name
      price
      relatedOptions # Array of option product IDs
    }
  }
}

# Get option products with variations
query GetOptionProducts($ids: [Int]) {
  products(where: { include: $ids, typeIn: [VARIABLE] }) {
    nodes {
      id
      name
      type
      variableType
      price
      variations(first: 50) {
        nodes {
          id
          name
          price
          attributes {
            nodes {
              name
              value
            }
          }
        }
      }
    }
  }
}
```

### Data Normalization
```typescript
// Normalize option products for configurator
function normalizeOptionProduct(wooProduct: any): OptionProduct {
  return {
    id: wooProduct.id,
    databaseId: wooProduct.databaseId,
    name: wooProduct.name,
    type: wooProduct.type,
    optionType: determineOptionType(wooProduct),
    variableType: wooProduct.variableType,
    price: parseFloat(wooProduct.price),
    variations: wooProduct.variations?.nodes?.map(normalizeVariation) || []
  };
}

function normalizeVariation(wooVariation: any): Variation {
  return {
    id: wooVariation.id,
    databaseId: wooVariation.databaseId,
    name: wooVariation.name,
    price: parseFloat(wooVariation.price),
    attributes: wooVariation.attributes?.nodes || []
  };
}
```

