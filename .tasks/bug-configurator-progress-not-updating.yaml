## Expected Behavior
```typescript
// Correct Implementation
const ModelConfigurator: React.FC<ModelConfiguratorProps> = ({ ... }) => {
  const [selectedOptions, setSelectedOptions] = useState<ConfigurableProductSchema[]>([]);
  const [configurationProgress, setConfigurationProgress] = useState<ConfigurationProgressData>({
    totalOptions: 0,
    selectedOptions: 0,
    completionPercentage: 0,
    categories: []
  });
  
  // Update progress when options change
  useEffect(() => {
    updateConfigurationProgress();
  }, [selectedOptions, categories]);
  
  const updateConfigurationProgress = useCallback(() => {
    const totalOptions = calculateTotalOptions();
    const selectedOptions = selectedOptions.length;
    const completionPercentage = totalOptions > 0 ? (selectedOptions / totalOptions) * 100 : 0;
    
    const categoryProgress = categories.map(category => ({
      id: category.id,
      name: category.name,
      totalOptions: category.options?.length || 0,
      selectedOptions: selectedOptions.filter(opt => opt.categoryId === category.id).length,
      completionPercentage: category.options?.length > 0 ? 
        (selectedOptions.filter(opt => opt.categoryId === category.id).length / category.options.length) * 100 : 0
    }));
    
    setConfigurationProgress({
      totalOptions,
      selectedOptions,
      completionPercentage,
      categories: categoryProgress
    });
  }, [selectedOptions, categories]);
  
  const handleOptionToggle = useCallback((option: ConfigurableProductSchema, categoryId?: string) => {
    if (isSelected) {
      removeOption(option.databaseId || 0, categoryId);
      onDeselect?.(option, categoryId);
    } else {
      addOption(option, categoryId);
      onSelect?.(option, categoryId);
    }
    
    onToggle?.(option, categoryId);
    
    // Update progress after option change
    updateConfigurationProgress();
  }, [isSelected, option, categoryId, updateConfigurationProgress]);
  
  return (
    <div className="model-configurator">
      {/* Configuration Progress */}
      <ConfigurationProgress
        progress={configurationProgress}
        onProgressUpdate={updateConfigurationProgress}
      />
      
      {/* Rest of configurator content */}
    </div>
  );
};
```

