### Lazy Loading
```typescript
// Lazy load variation images
const LazyVariationImage: React.FC<{ variation: Variation }> = ({ variation }) => {
  const [isLoaded, setIsLoaded] = useState(false);
  const [hasError, setHasError] = useState(false);

  if (!variation.image?.sourceUrl) {
    return <div className="w-full h-32 bg-gray-200 rounded" />;
  }

  return (
    <div className="relative w-full h-32 bg-gray-200 rounded overflow-hidden">
      {!isLoaded && !hasError && (
        <div className="absolute inset-0 flex items-center justify-center">
          <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600" />
        </div>
      )}
      <img
        src={variation.image.sourceUrl}
        alt={variation.image.altText || variation.name}
        className={`w-full h-full object-cover transition-opacity duration-200 ${
          isLoaded ? 'opacity-100' : 'opacity-0'
        }`}
        onLoad={() => setIsLoaded(true)}
        onError={() => setHasError(true)}
        loading="lazy"
      />
    </div>
  );
};
```

